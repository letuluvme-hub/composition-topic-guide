   byId() 原来是线性扫描，收藏/记录列表要逐条查（最多 30 条 × 462 篇
   ≈ 1.4 万次比较）。importIndex() 在导入后重建即可 —— 题库只增不改。 */
var BY_ID={};
function importIndex(){ BY_ID={}; for(var i=0;i<BANK.length;i++) BY_ID[BANK[i].id]=BANK[i]; }
importIndex();
function byId(id){ return BY_ID[id]||null; }
function keyOf(s){ return [s.g,s.d,s.c,s.e].join('|'); }
function match(b,s){ return (!s.g||b.g===s.g)&&(!s.d||b.d===s.d)&&(!s.c||b.c===s.c)&&(!s.e||b.e===s.e); }
function pool(s){ var out=[],i; for(i=0;i<BANK.length;i++) if(match(BANK[i],s)) out.push(BANK[i]); return out; }

/* 选项上要显示"这一步每个值还剩几篇"，所以要按当前其他选择算 */
/* 每一步的选项按哪些已选维度过滤 —— 选项卡上标的篇数必须与出题口径一致。
   旧版选项只按体裁过滤、显示 12 篇，出题却按四维过滤、实际命中 0.1 篇：
   虚高 105 倍，90.4% 的情况下 3 张卡全不符合选择（实测 4000 组遍历）。

   现在的口径：显示【选了这一项之后，严格命中四维的篇数】。
   这样卡片上的数字就是她真正会拿到几篇，不会骗人。数字变小是应该的 ——
   它终于说实话了。 */
var STEP_SCOPE={g:[], d:['g','c','e'], c:['g','d','e'], e:['g','d','c']};
function counts(dim){
  var scope=STEP_SCOPE[dim]||[], n={}, i,j,b;
  for(i=0;i<BANK.length;i++){ b=BANK[i];
    /* 必须满足 scope 里的全部条件；sel[dim] 自身不参与，否则会自我收窄 */
    var hit=true;
    for(j=0;j<scope.length;j++){ if(sel[scope[j]] && b[scope[j]]!==sel[scope[j]]){ hit=false; break; } }
    if(!hit) continue;
    n[b[dim]]=(n[b[dim]]||0)+1;
  }
  return n;
}
/* 同口径下，忽略本步自己已选值时的总数 —— 给「不限」那个卡片显示用 */
function countAll(dim){
  var scope=STEP_SCOPE[dim]||[], n=0, i,j,b;
  for(i=0;i<BANK.length;i++){ b=BANK[i];
    var hit=true;
    for(j=0;j<scope.length;j++){ if(sel[scope[j]] && b[scope[j]]!==sel[scope[j]]){ hit=false; break; } }
    if(hit) n++;
  }
  return n;
}

/* 排序：稳定散列 + 「换一个」加盐，保证换出来的是另一批 */
function hash(str){ var h=2166136261,i; for(i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,16777619); } return (h>>>0); }
/* 出一批题。
   设计决定（都是被实测数据逼出来的）：
   1) 选项卡上的篇数与出题口径必须一致 —— 选项上标的就是严格命中篇数，不虚标。
   2) 不做「硬过滤 + 放宽」，改成「按符合度排序」：每篇题算它符合几个维度
      （4=全中，3=差一项…），先给符合度最高的。四维交叉 4400 格、462 篇
      填不满（实测 4400 组里 90.4% 严格命中 0 篇），硬过滤必然大面积空；
      排序则总能给出结果，且最符合的排最前。
   3) 「换一批」在同一路里轮换，靠 salt 改变排序起点。
   4) 同一 (g,d,c,e) 组合只出 1 张卡 —— 3 张卡维度全一样，对她等于只给了 1 个选择。
      代价要说清楚：pool() 里的题目组合全都相同，所以严格命中哪怕有 2 篇，
      也只会出 1 张精确卡。这个折叠数会作为 collapsed 一起返回给文案用。 */
function matchScore(b){
  var keys=['g','d','c','e'], n=0;
  for(var i=0;i<4;i++){ if(!sel[keys[i]] || b[keys[i]]===sel[keys[i]]) n++; }
  return n;   // 未选维度算「符合」，因为那不是她的要求
}
/* 按符合度分 5 个桶（4=全中 … 0=全不中）。
   旧实现是把全库交给 Array.sort 再取前 3，cmp 里每比较一次就要跑
   2 次 matchScore + 2 次 hash + 3 次字符串拼接 —— 462 篇约 4000 次比较、
   1.6 万次函数调用，而结果只取 3 篇。分桶后是 O(n) 计数，
   只有真正要取的那几个桶才排序。 */
function scoreBuckets(list){
  var buckets=[[],[],[],[],[]], i;
  for(i=0;i<list.length;i++) buckets[matchScore(list[i])].push(list[i]);
  return buckets;
}
function results(){
  var list=pool(sel);          // 严格命中（可能为空）
  var seen={}, out=[], i, k;

  /* 排序键：符合度降序 → salt 决定的稳定散列。
     散列保证「同一选择 + 同一 salt」永远同一批（考前可练熟），
     salt 变了就换出另一批（同路轮换）。 */
  function cmpHash(a,b){
    return hash(salt+'|'+keyOf(sel)+'|'+a.id)-hash(salt+'|'+keyOf(sel)+'|'+b.id);
  }
  /* 先放严格命中的（它们必然是符合度最高的），再按符合度补齐。
     同一 (g,d,c,e) 组合只出现一次 —— 3 张卡如果维度全一样，对她等于只给了 1 个选择。 */
  function push(b){
    var tag=b.g+'|'+b.d+'|'+b.c+'|'+b.e;
    if(seen[tag]) return false;
    seen[tag]=1; out.push(b); return true;
  }
  function take(buckets){
    for(k=4;k>=0 && out.length<3;k--){
      var bk=buckets[k]; if(!bk.length) continue;
      bk.sort(cmpHash);
      for(i=0;i<bk.length && out.length<3;i++) push(bk[i]);
    }
  }
  var collapsedBefore=0;
  take(scoreBuckets(list));
  collapsedBefore=out.length;         // 严格命中实际贡献了几张卡（最多 1 张）
  /* 不够 3 篇才从全库里按符合度补。 */
  if(out.length<3) take(scoreBuckets(BANK));

  /* 符合度统计：用来如实告诉用户这批里几篇是真中选、几篇是相近的 */
  var full=0, near=0;
  for(i=0;i<out.length;i++){ var sc=matchScore(out[i]); if(sc===4) full++; else if(sc===3) near++; }

  return {
    list:list,               // 严格命中数
    shown:out,
    /* 严格命中里有多少篇因为「组合重复」被折叠掉没出卡 —— 文案要如实说明 */
    collapsed:(collapsedBefore===0)?0:Math.max(0,list.length-collapsedBefore),
    extra:out.length-full-near,   // 差两项以上的张数
    full:full, near:near,
    picked:['g','d','c','e'].filter(function(k){return !!sel[k];}).length
  };
}

function el(tag,cls,txt){ var e=document.createElement(tag); if(cls)e.className=cls; if(txt!=null)e.textContent=txt; return e; }
/* 把自绘的 div/li 变成键盘可操作、读屏可读的控件。
   全站只有这三处自绘可点元素（步骤条、素材项、侧栏条目），
   它们原来全是 el+click：键盘够不着，读屏也听不出状态。 */
function activatable(node, label, onActivate, role){
  node.setAttribute('role', role||'button');
  node.setAttribute('tabindex','0');
  if(label) node.setAttribute('aria-label', label);
  node.addEventListener('click', onActivate);
  node.addEventListener('keydown', function(ev){
    if(ev.key==='Enter'||ev.key===' '||ev.key==='Spacebar'){ ev.preventDefault(); onActivate(ev); }
  });
  return node;
}
/* 素材清单：本质是「勾掉用过的」开关，给 checkbox 语义 */
function matList(items, onToggle){
  var ul=el('ul','mat');
  items.forEach(function(m){
    var li=el('li',null,m);
    li.setAttribute('role','checkbox');
    li.setAttribute('tabindex','0');
    li.setAttribute('aria-checked','false');
    function toggle(){
      var on=li.classList.toggle('on');
      li.setAttribute('aria-checked', on?'true':'false');
      if(onToggle) onToggle(ul, on);
    }
    li.addEventListener('click',toggle);
    li.addEventListener('keydown',function(ev){
      if(ev.key==='Enter'||ev.key===' '||ev.key==='Spacebar'){ ev.preventDefault(); toggle(); }
    });
    ul.appendChild(li);
  });
  return ul;
}
function slotDefault(b){
  var w=(b.who&&b.who.length)?b.who[0]:null;
  return slots[b.id]!=null?slots[b.id]:w;
}
function finalTitle(b){
  var w=slotDefault(b);
  if(!w) return b.t;
  return b.t.replace(/\{[^}]+\}/g,w);
}
function badge(t){ var m=(t.emo||'·')+' '+t.nm; return m; }

/* ── 视图：步骤条 ──
   可点击范围是 0..maxStep（走到过的最远处），不是 0..step-1。
   原实现只有「已完成的步」可点，于是点过「不限」之后既回不去也跳不过来。
   样式上区分三种态：cur（当前）/ done（已走过）/ open（走过但不在当前）。 */
function renderSteps(){
  var box=document.getElementById('steps'); box.innerHTML='';
  var labels=['体裁','领域','切口','情感','定题'];
  for(var i=0;i<5;i++){
    var reachable = i<=maxStep;
    /* cur=当前；done=走过且已选过值；done0=走到了但没选（点了「不限」路过） */
    var picked = sel[['g','d','c','e'][i]];
    var cls = 'sdot'+(i===step?' cur':(reachable&&picked?' done':' done0'))
              +(reachable?'':' sdim');
    var d=el('div',cls);
    d.setAttribute('data-i',i);
    /* 步骤条是自绘的 div+click：键盘和读屏都够不着。
       给它 button 语义 + tabindex + Enter/Space 激活，
       并用 aria-current / aria-disabled 表达当前步与不可达步。 */
    d.setAttribute('role','button');
    d.setAttribute('tabindex', reachable?'0':'-1');
    d.setAttribute('aria-label', labels[i]+(i===4?'（定题）':'')+(reachable?'':'（还没走到）'));
    if(i===step) d.setAttribute('aria-current','step');
    if(!reachable) d.setAttribute('aria-disabled','true');
    var bar=el('div','sbar'); bar.appendChild(el('i'));
    var lab=el('div','slab',labels[i]);
    d.appendChild(bar); d.appendChild(lab);
    if(reachable && i!==step){
      d.addEventListener('click',(function(n){ return function(){ goStep(n); }; })(i));
      d.addEventListener('keydown',(function(n){ return function(ev){
        if(ev.key==='Enter'||ev.key===' '||ev.key==='Spacebar'){ ev.preventDefault(); goStep(n); }
      }; })(i));
    }
    box.appendChild(d);
  }
}

/* ── 视图：选择步 ── */
function renderChoice(){
  var v=document.getElementById('view'); v.innerHTML='';
  var st=STEPS[step], key=st.k, T=st.T;
  var n=counts(key);
  var nAll=countAll(key);
  var keys=Object.keys(T).filter(function(k){ return n[k]>0; });

  var h=el('div','qhead fade');
  h.appendChild(el('div','k',st.t.replace(/^第 (\d) 步 · (.)(.*)$/,function(_,i,a,b){return 'STEP '+i+' / 4 · '+a+b;})));
  var Q={
      g:['这次想写哪一种文体的作文？','每一步下面的数字 = 选了它之后，你真正能拿到的篇数。数字会越选越小，这是实话。'],
      d:['这件事发生在谁的范围里？','选完这一步，下面每个选项上的数字就是「选了它能拿到几篇」。'],
      c:['从哪里下笔最省力？','切口决定细节往哪儿使劲，也是结构最省事的一种。'],
      e:['你想让读者读完是什么心情？','选完这里就出题。卡片上的数字会告诉你这一路到底有几篇。']
    }[key];
  h.appendChild(el('h2',null,Q[0]));
  h.appendChild(el('p',null,Q[1]));
  v.appendChild(h);

  if(sel.g) v.appendChild(trail());

  var g=el('div','grid');

  /* 「不限」永远是第一个选项。四个维度交叉之后命中数会急剧变小
     （130 篇里 rec+family+object+warm 通常只有 1 篇），
     所以每一步都必须能说「还没想好」，否则用户会被逼进死路。 */
  var any=el('button','opt');
  if(!sel[key]) any.classList.add('pick');
  any.appendChild(el('span','emo','✳️'));
  any.appendChild(el('span','nm','不限'));
  any.appendChild(el('span','ds','这一步还没想好，先看全部'));
  any.appendChild(el('span','ct',nAll+' 篇'));
  any.addEventListener('click',function(){ chooseDim(key,null); });
  g.appendChild(any);

  keys.forEach(function(k){
    var t=T[k];
    var b=el('button','opt');
    b.appendChild(el('span','emo',t.emo));
    b.appendChild(el('span','nm',t.nm));
    b.appendChild(el('span','ds',t.ds));
    b.appendChild(el('span','ct',n[k]+' 篇'));
    if(sel[key]===k) b.classList.add('pick');
    b.addEventListener('click',function(){ chooseDim(key,sel[key]===k?null:k); });
    g.appendChild(b);
  });
  v.appendChild(g);
  if(!keys.length){
    v.appendChild(el('div','empty','这一步没有可写的组合了。选「不限」，或者点下面的「回去改一步」。'));
  }
}

/* 选一个维度值：上层改了，下层清空。
   「不限」（val=null）的语义是「这一步我跳过，继续往下」而不是「停在这一步」——
   原实现 step=val?(at+1):at 让它停在原地，于是点一次「不限」就再也走不到下一步，
   后面三个维度全都没法筛。maxStep 记录走到过的最远处，
   步骤条据此允许自由跳转（不只是「已完成的步」可点）。
   最后一格(下标3)选完之后【直接出题】：她已经答完四个问题，
   再要求点一次底栏按钮是多余的一步，也是「点完没反应」的错觉来源。 */
function chooseDim(key,val){
  sel[key]=val;
  var order=['g','d','c','e'], at=order.indexOf(key);
  for(var j=at+1;j<4;j++) sel[order[j]]=null;
  salt=0; chosen=null;
  if(at>=3){ maxStep=4; step=4; render(); window.scrollTo(0,0); return; }
  step=at+1;
  if(step>maxStep) maxStep=step;
  render();
}

function trail(){
  var t=el('div','trail');
  var names={g:G,d:D,c:C,e:E};
  ['g','d','c','e'].forEach(function(k){
    if(!sel[k]) return;
    var ch=el('span','chip x');
    ch.appendChild(el('b',null,names[k][sel[k]].nm));
    ch.appendChild(document.createTextNode(' ✕'));
    ch.addEventListener('click',function(){
      sel[k]=null; var i=STEPS.findIndex(function(s){return s.k===k;});
      for(var j=i+1;j<STEPS.length;j++) sel[STEPS[j].k]=null;
      step=i; salt=0; render();
    });
    t.appendChild(ch);
  });
  return t;
}

/* ── 视图：定题 ── */
function renderResults(){
  var v=document.getElementById('view'); v.innerHTML='';
  var R=results(), RN={g:G,d:D,c:C,e:E};

  var h=el('div','qhead fade');
  h.appendChild(el('div','k','STEP 4 / 4 · 定题'));
  h.appendChild(el('h2',null,R.list.length?'这几篇里，最接近你选的条件':'你选的这个组合题库里没有，下面是最接近的'));
  h.appendChild(el('p',null,'四步全中是一种要求，写出来是另一回事。下面每张卡都标了它符合你哪几步。'));
  v.appendChild(h);
  v.appendChild(trail());

  /* 如实说明这批是怎么来的。
     这里最容易骗人的地方有两个，都必须写出来：
     1) 严格命中 0 篇时，别把补位的卡片说成「最接近」——差两项以上就不是接近。
     2) 严格命中 >1 篇时也别只说 N 篇：pool() 里这些题目的四个维度完全一样，
        按组合去重后只会出 1 张卡，剩下的被折叠了。折叠掉的数量要说。 */
  var c=el('div','cnt');
  if(!R.shown.length){
    c.textContent='题库里没有可用的题目。';
  } else if(!R.picked){
    c.textContent='还没选任何条件 —— 从 '+BANK.length+' 篇里挑一个开始。';
  } else if(R.full===R.shown.length){
    c.textContent='这 '+R.shown.length+' 篇都完全符合你选的四项条件。';
  } else {
    var parts=[];
    if(R.full) parts.push('<b style="color:var(--ok)">'+R.full+'</b> 篇四项全中');
    if(R.near) parts.push('<b style="color:var(--gold)">'+R.near+'</b> 篇只差一项');
    if(R.extra) parts.push('<b style="color:var(--warn)">'+R.extra+'</b> 篇差两项以上');
    var lead;
    if(R.list.length===0){
      lead='你选的这四项，题库里<b>一篇都没有</b>';
    } else if(R.collapsed){
      lead='严格四项全中的有 <b>'+R.list.length+'</b> 篇，但它们四个维度完全一样（对你等于 1 个选择），所以只放了 <b>1</b> 篇';
    } else {
      lead='严格四项全中的有 <b>'+R.list.length+'</b> 篇';
    }
    c.innerHTML=lead+'。剩下按符合度补齐，每张卡都标了它差哪一步：'+parts.join('、')+'。';
  }
  v.appendChild(c);

  if(!R.shown.length){
    v.appendChild(el('div','empty','回上一步改一个条件，或者用右上角「题材库 → 加题」把老师给的题目贴进来。'));
    return;
  }

  /* 每张卡都标明：全中 / 差哪一项 */
  R.shown.forEach(function(b){
    var card=topicCard(b);
    /* 注意取值层级：RN.g 是「维度代码 -> 选项对象」的字典（{rec:{nm:'记叙文'}}），
       所以要 RN.g[sel.g].nm 两级索引。写成 RN.g.nm 是在字典本身上取 .nm，
       得到 undefined，界面就显示「你选了「undefined」」。
       而且要显示她【选的】那一项（sel.x），不是题目那一项（b.x）——
       她关心的是「我选了什么而这篇不同」。 */
    var miss=[];
    var KD=['g','d','c','e'];
    for(var mi=0;mi<4;mi++){
      var k=KD[mi];
      if(sel[k] && b[k]!==sel[k]){
        var opt=RN[k][sel[k]];
        miss.push(opt ? opt.nm : sel[k]);   // 兜底用代码本身，绝不出现 undefined
      }
    }
    var tag=el('div','sect');
    var line=el('div', miss.length?'trap':'hit');
    if(miss.length===0){
      line.appendChild(el('b',null,'完全符合　'));
      line.appendChild(document.createTextNode('四项都命中你选的条件。'));
    } else if(miss.length===1){
      line.appendChild(el('b',null,'只差一项　'));
      line.appendChild(document.createTextNode('你选了「'+miss[0]+'」，这篇写的是别的方向。'));
    } else {
      line.appendChild(el('b',null,'差 '+miss.length+' 项　'));
      line.appendChild(document.createTextNode('你选的「'+miss.join('、')+'」这几项都不同。'));
    }
    tag.appendChild(line);
    card.insertBefore(tag, card.children[1]||null);
    v.appendChild(card);
  });

  var row=el('div','acts'); row.style.padding='0';
  var more=el('button','abtn','换一批（同一条路换 '+R.shown.length+' 篇）');
  more.addEventListener('click',function(){ salt++; render(); window.scrollTo(0,0); });
  row.appendChild(more);
  var back=el('button','abtn','回去改一步');
  back.addEventListener('click',function(){ step=3; render(); window.scrollTo(0,0); });
  row.appendChild(back);
  v.appendChild(row);
}

/* 人物槽位。
   b.who 的真实语义是「这篇适合谁当主角」，不是「标题里要替换的词」——
   462 篇里只有 22 篇标题写了 {外婆} 这类占位符，其余 439 篇的标题是
   以物为中心的（《储藏室那只空奶粉罐》），换人换不进标题。
   旧实现不管有没有占位符都渲染按钮、还提示「点一下换人物」，
   结果 439 张卡上点了毫无反应（实测 who 有 461 篇、含占位符仅 22 篇）。
   现在按标题是否支持替换分开处理：
     - 支持：换人即换标题（占位符替换）

/* 计时器必须活在 renderDesk 之外。
   旧实现把 stop() 定义在 renderDesk 内部，外部（render()、换一篇、重来）
   根本够不着，于是：点「开始」后直接点「换一篇」→ 页面已经换掉，
   interval 还在跑，对着被 innerHTML='' 摘掉的节点写 textContent；
   再进写作台会叠加第二个 interval，两个一起改同一个 timerSec。
   现在 timerStop/timerStart 在模块级，render() 每次切页统一先停。
   另外间隔从 250ms 改成 1000ms —— 显示精度只到秒，而旧间隔每 tick 都
   重建一次 info 的 DOM（innerHTML='' + 两个新 div），40 分钟约 9600 次。 */
function timerStop(){
  if(tInt){ clearInterval(tInt); tInt=null; }
  if(timerOnReset) timerOnReset();
}
function timerStart(){
  if(tInt) return;
  tickAt=Date.now();
  tInt=setInterval(function(){
    var n=Math.floor((Date.now()-tickAt)/1000);
    var was=timerSec;
    timerSec=Math.max(0,2400-n);
    if(timerSec!==was) timerOnPaint();      // 只在整秒变化时重画
    if(timerSec<=0){ timerStop(); timerOnEnd(); }
  },1000);
}
function renderDesk(){
  var v=document.getElementById('view'); v.innerHTML='';
  var b=chosen; if(!b){ step=4; render(); return; }
  var q=QUOTA[b.g]||QUOTA.rec;

  var h=el('div','qhead fade');
  h.appendChild(el('div','k','写作台 · 已定题'));
  h.appendChild(el('h2',null,finalTitle(b)));
  var sub=el('p',null,G[b.g].nm+' · '+D[b.d].nm+' · '+C[b.c].nm+' · '+E[b.e].nm);
  h.appendChild(sub);
  if(b.who&&b.who.length) h.appendChild(el('p','subwho','主角：'+slotDefault(b)));
  v.appendChild(h);

  /* 计时 */
  var tm=el('div','timer');
  var t=el('div','t',fmt(timerSec));
  var info=el('div','info');
  function paintInfo(){
    info.innerHTML='';
    info.appendChild(el('div',null,timerSec>600?'离考试交卷还有 '+Math.ceil(timerSec/60)+' 分钟，先花 3 分钟列骨架':'只剩 '+Math.ceil(timerSec/60)+' 分钟：别再改开头，直接把主体写完。'));
    info.appendChild(el('div',null,'分段目标：'+QUOTA_LAB.map(function(l,i){return l+q[i]+'字';}).join(' · ')));
  }
  function paint(){ t.textContent=fmt(timerSec); tm.classList.toggle('hot',timerSec<=600); paintInfo(); }
  paint();
  var start=el('button','tbtn2','开始');
  var reset=el('button','tbtn2','重置');
  start.type='button'; reset.type='button';
  /* 把当前视图的绘制/复位回调挂到模块级，模块级的 timerStop/timerStart 才能用 */
  timerOnPaint=paint;
  timerOnReset=function(){ start.textContent='开始'; };
  timerOnEnd=function(){ start.textContent='开始'; toast('时间到'); };
  reset.addEventListener('click',function(){ timerStop(); timerSec=2400; paint(); });
  start.addEventListener('click',function(){
    if(tInt){ timerStop(); return; }
    start.textContent='暂停'; timerStart();
  });
  tm.appendChild(t); tm.appendChild(info); tm.appendChild(start); tm.appendChild(reset);
  v.appendChild(tm);

  /* 配额 */
  var qa=el('div','qa');
  QUOTA_LAB.forEach(function(l,i){ var d=el('div'); d.appendChild(el('b',null,q[i])); d.appendChild(el('span',null,l)); qa.appendChild(d); });
  v.appendChild(qa);

  /* 立意 */
  var s1=el('div','sect');
  s1.appendChild(el('h4',null,'立意（这句抄上去，开头结尾都要绕着它）'));
  s1.appendChild(el('p','idea',b.idea));
  v.appendChild(s1);

  /* 素材清单 */
  var s2=el('div','sect');

  var cnt=el('div','cnt');

  /* 骨架 */

  s3.appendChild(ol);
  v.appendChild(s3);

  /* 避坑 + 拓展 */
  var s4=el('div','sect');
  s4.appendChild(el('h4',null,'翻车点'));
  var tr=el('div','trap');
  tr.appendChild(el('b',null,'注意　'));
  tr.appendChild(document.createTextNode(b.trap));
  s4.appendChild(tr);
  v.appendChild(s4);

  var same=pool(sel).filter(function(x){ return x.id!==b.id && x.g===b.g; }).slice(0,3);
  if(same.length){
    var s5=el('div','sect');
    s5.appendChild(el('h4',null,'同一体裁，别的备选（万一写到一半卡住）'));
    same.forEach(function(x){
      var m=el('div','mini');
      m.appendChild(el('div','mt',finalTitle(x)));
      var ms=el('div','ms');
      ms.appendChild(el('span',null,D[x.d].nm)); ms.appendChild(el('span',null,C[x.c].nm)); ms.appendChild(el('span',null,E[x.e].nm));
      m.appendChild(ms);
      activatable(m, '换成：'+finalTitle(x), function(){
        chosen=x; step=4; salt=0; render(); window.scrollTo(0,0); toast('已换成：'+finalTitle(x));
      });
      s5.appendChild(m);
    });
    v.appendChild(s5);
  }

  var row=el('div','acts'); row.style.padding='0';
  var cp=el('button','abtn pri','复制整份写作单');
  cp.addEventListener('click',function(){ copyPlan(b); });
  var back=el('button','abtn','换一篇');
  /* 「换一篇」必须真的回到选题列表。旧实现只写 step=4，chosen 还留着，
     render() 于是又走 renderDesk() —— 按钮点了跟没点一样。
     要回列表就得把 chosen 清掉；顺手 salt++ 让下一批真的是另一批。 */
  back.addEventListener('click',function(){

  row.appendChild(cp); row.appendChild(back); row.appendChild(clear);
  v.appendChild(row);

function fmt(s){ var m=Math.floor(s/60), x=s%60; return (m<10?'0':'')+m+':'+(x<10?'0':'')+x; }

function planText(b){
  var w=slotDefault(b), q=QUOTA[b.g]||QUOTA.rec, L=[];
  L.push('【题目】'+finalTitle(b));
  L.push('【体裁】'+G[b.g].nm+'　【领域】'+D[b.d].nm+'　【切口】'+C[b.c].nm+'　【情感】'+E[b.e].nm);
  /* 主角写进写作单：选题时定的人，得跟着她抄到纸上才算数 */
  if(w) L.push('【主角】'+w);
  L.push('');
  L.push('【立意】'+b.idea);
  L.push('');
  L.push('【素材清单】');
  b.mat.forEach(function(m,i){ L.push('  '+(i+1)+'. '+m); });
  L.push('');
  L.push('【骨架】');
  b.how.forEach(function(h,i){ L.push('  '+(i+1)+'. '+h); });
  L.push('');
  L.push('【翻车点】'+b.trap);
  L.push('');
  L.push('【字数】开头'+q[0]+' · 主体'+q[1]+' · 结尾'+q[2]+'　合计 '+(q[0]+q[1]+q[2])+' 字');
  return L.join('\n');
}
function copyPlan(b){
  var txt=planText(b);
  function fallback(){
    var ta=document.createElement('textarea');
    ta.value=txt; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    var okc=false;
    try{ okc=document.execCommand('copy'); }catch(e){}
    document.body.removeChild(ta);
    toast(okc?'已复制到剪贴板':'复制失败，长按文字手动复制');
  }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(function(){ toast('已复制到剪贴板'); }, fallback);
  } else fallback();
}

/* ── 抽屉 ── */
/* 抽屉是模态：打开要把焦点送进去、Tab 不能跑到背后的内容、关闭要还回焦点。
   原来只做了 class 切换和 Esc，焦点一直留在顶栏那个「题材库」按钮上，
   键盘用户打开抽屉后完全不知道自己在哪、也 Tab 不进抽屉内容。 */
var libTab='fav', sheetOpener=null;
var FOCUSABLE='a[href],button:not([disabled]),input,textarea,select,[tabindex]:not([tabindex="-1"])';
function sheetFocusables(){
  return document.getElementById('sheet').querySelectorAll(FOCUSABLE);
}
function openSheet(tab){
  libTab=tab||libTab;
  sheetOpener=document.activeElement;
  document.getElementById('sheet').classList.add('on');
  document.body.classList.add('lb-open');
  document.getElementById('btnLib').classList.add('on');
  renderSheet();
  var f=sheetFocusables();
  if(f.length) f[0].focus();
}
function closeSheet(){
  document.getElementById('sheet').classList.remove('on');
  document.body.classList.remove('lb-open');
  document.getElementById('btnLib').classList.remove('on');
  /* 焦点还回打开它的那个按钮，键盘用户不会被丢回页面顶部 */
  if(sheetOpener && sheetOpener.focus) sheetOpener.focus();
  sheetOpener=null;
}
/* 焦点陷阱：Tab 在抽屉里循环，出不去（背景内容对读屏/键盘应当是不可见的） */
document.addEventListener('keydown',function(e){
  var sheet=document.getElementById('sheet');
  if(!sheet.classList.contains('on')) return;
  if(e.key==='Escape'){ closeSheet(); return; }
  if(e.key!=='Tab') return;
  var f=sheetFocusables();
  if(!f.length) return;
  var first=f[0], last=f[f.length-1], cur=document.activeElement;
  if(e.shiftKey && (cur===first || !sheet.contains(cur))){ e.preventDefault(); last.focus(); }
  else if(!e.shiftKey && (cur===last || !sheet.contains(cur))){ e.preventDefault(); first.focus(); }
});
function renderSheet(){

    var ta=el('textarea','ta');

    ta.value=LS.get('zxz.imp.draft','');

    var row=el('div','acts'); row.style.padding='10px 0 0';
    var ok=el('button','abtn pri','导入');

      ['写作台','定题后有 40 分钟倒计时和分段字数。开头/主体/结尾的配额按体裁给，照着分就不会写飘。'],

      ['避坑','每篇都有"翻车点"，写之前扫一眼，能省掉一类最低级的失分。'],
      ['加题','自己碰到好题目，用"加题"页按格式贴进去，以后所有步骤都能选到它。注意：自加题目只存在这台设备的这个页面里，刷新或关掉就没了。']
    ];
    KV.forEach(function(k){
      var r=el('div','kv'); r.appendChild(el('b',null,k[0])); r.appendChild(el('span',null,k[1]));
      body.appendChild(r);
    });
    body.appendChild(el('div','note','题目库：内置 '+BANK.length+' 篇固定组合，方向：上海中考 600 字记叙文为主（2023—2025 连续三年都是自拟命题），兼收想象、议论、应用文。'));
  }
}

/* 导入解析 */
/* 导入别名表：别名 → 维度代码。必须显式建表：
   拿中文别名去 indexOf(['rec','scene',...]) 永远匹配不上，
   「含关键字兜底」也会把 '记叙' 判成 '记叙文' 之外的任何东西。 */
var ALIAS={
 g:{rec:['g','rec','记叙','记叙文','叙事','写人','写事','故事'],
    scene:['scene','写景','状物','写景状物','景物','托物言志'],
    imagine:['imagine','想象','科幻','童话','穿越','科幻想象'],
    argue:['argue','议论','说理','议论文','演讲稿式议论'],
    apply:['apply','应用','应用文','书信','书信体','读后感']},
 d:{family:['family','家庭','亲情','家人','父母','长辈'],
    teacher:['teacher','师长','老师','同窗','师生'],
    friend:['friend','同学','友谊','友情','伙伴'],
    grow:['grow','成长','烦恼','心事','自我','青春期'],
    setback:['setback','挫折','励志','失败','坚持'],
    nature:['nature','自然','人与自然','季节','生物','天气'],
    society:['society','社会','见闻','凡人','城市'],
    culture:['culture','文化','传统','习俗','节日','老手艺'],
    hometown:['hometown','家乡','风物','弄堂','本土'],
    future:['future','科技','未来','科幻','幻想']},
 c:{object:['c','object','旧物','物件','一件旧物','物品'],
    moment:['moment','瞬间','一刻','一个瞬间','定格'],
    promise:['promise','约定','承诺','一个约定'],
    first:['first','第一次','首次','初体验'],
    mis:['mis','误解','误会','一次误解','冤枉'],
    contest:['contest','比赛','竞赛','赛场','一场比赛'],
    journey:['journey','出行','旅途','路上','一段出行','坐车'],
    secret:['secret','秘密','小秘密','藏起来'],
    word:['word','一句话','口头禅','某句话'],
    crowd:['crowd','一群人','人群','众生相','大家'],
    change:['change','变化','前后','一种变化','转变']},
 e:{warm:['warm','温暖','感动','温暖感动'],
    guilt:['guilt','愧疚','释然','愧疚到释然','后悔'],
    admire:['admire','敬佩','佩服','敬仰'],
    down:['down','失落','振作','失落振作','低落'],
    plain:['plain','平凡','平凡里的光','普通'],
    insight:['insight','领悟','成长领悟','明白','感悟'],
    curio:['curio','好奇','探索','疑问','好奇探索'],
    protect:['protect','守护','保护','守住']}
};
var ALIAS_ORDER={g:['rec','scene','imagine','argue','apply'],
 d:['family','teacher','friend','grow','setback','nature','society','culture','hometown','future'],
 c:['object','moment','promise','first','mis','contest','journey','secret','word','crowd','change'],
 e:['warm','guilt','admire','down','plain','insight','curio','protect']};

function normCode(dim,raw){
  var s=String(raw==null?'':raw).trim(); if(!s) return null;
  var table=ALIAS[dim]||{}, order=ALIAS_ORDER[dim]||[], low=s.toLowerCase(), i,j,k;
  /* 1 精确命中别名表 */
  for(k in table){ var al=table[k];
    for(i=0;i<al.length;i++) if(low===al[i]||s===al[i]) return k;
  }
  /* 2 词包含：'g记叙' / '记叙文（600字）' / '成长类' */
  var best=null, bestLen=0;
  for(k in table){ var al2=table[k];
    for(j=0;j<al2.length;j++){
      var a=al2[j];
      if(a.length<2) continue;                 // 排除 'g'/'d' 这类单字母，避免 'growth' 误配
      if(low.indexOf(a)>=0 || s.indexOf(a)>=0){
        if(a.length>bestLen){ best=k; bestLen=a.length; }   // 取最长匹配，「成长」胜过「成长烦恼」
      }
    }
  }
  if(best) return best;
  /* 3 显示名包含：'家庭亲情' 已被表覆盖，这里兜底 nm.indexOf(s) */
  var T={g:G,d:D,c:C,e:E}[dim];
  for(i=0;i<order.length;i++){ var nm=T[order[i]].nm;
    if(s.length>=2 && (nm.indexOf(s)>=0)) return order[i];
  }
  return null;
}
/* 题目文本归一化，只用于查重。
   去掉书名号/引号/空白后比较，这样
   「《 储藏室那只空奶粉罐 》」和「储藏室那只空奶粉罐」算同一道题。 */
function normTitle(t){
  return String(t==null?'':t).replace(/[\s\u3000]+/g,'')
    .replace(/[《》「」『』"'"''()（）【】\[\]]/g,'').toLowerCase();
}
/* 生成不与现有 id 冲突的 U 序号。
   旧实现用 hash(行内容)+行号当 id：同一份文本重复导入会算出同一个 id，
   于是走 if(used[id]) 分支再拼一次前缀变成 UU…，题目照样入库 ——
   导入三次就有三份重复题。这里改成单调递增的 U+序号，冲突时继续加。 */
function nextImpId(used){
  var n=1, id;
  do { id='U'+(n++); } while(used[id]);
  return id;
}
function parseImport(txt){
  var res={ok:0,skip:0,err:[]}, lines=String(txt||'').split(/\r?\n/), i;
  var used={}, titles={};
  /* 去重要比 id 和题目文本两道：
     同一份草稿重复导入时 id 会完全撞上，但题目文本才是她真正看到的那个东西。 */
  BANK.forEach(function(b){ used[b.id]=1; titles[normTitle(b.t)]=1; });
  for(i=0;i<lines.length;i++){
    var ln=lines[i]; if(!ln.trim()) continue;
    var parts=ln.split(/[|｜]/).map(function(s){return s.trim();});
    var t=parts[0];
    if(!t){ res.err.push('第'+(i+1)+'行：题目是空的'); continue; }
    var g=parts[1]?normCode('g',parts[1]):'rec';
    var d=parts[2]?normCode('d',parts[2]):null;
    var c=parts[3]?normCode('c',parts[3]):null;
    var e=parts[4]?normCode('e',parts[4]):null;
    if(!g){ res.err.push('第'+(i+1)+'行：体裁「'+parts[1]+'」认不出'); continue; }
    /* 已经加过同一道题：静默跳过并计数，不要让批量导入被自己的重复内容卡住 */
    if(titles[normTitle(t)]){ res.skip++; continue; }
    var id=nextImpId(used);
    used[id]=1; titles[normTitle(t)]=1;
    BANK.push({
      id:id,t:t,g:g,d:d||'family',c:c||'object',e:e||'insight',imp:true,
      who:null, idea:'（自加题目）先补一句立意：这篇想让读者读完记住什么？',
      mat:['把题目里最具体的一个名词换成你自己的人/事','写一个只有你才知道的细节','写一句当时的原话','写一个当时没做、现在后悔的动作'],
      how:['开头：一句话就出现题目里的那个关键物，别铺垫','主体：把那件东西拆成三个可摸可闻的细节','转折：写一件当时不懂、现在懂了的事','结尾：让那件东西再出现一次，换一种眼光'],
      trap:'自加题最容易写成流水账：把"发生→经过→结束"当作文结构。中间必须有一处停下来想。'
    });
    res.ok++;
  }
  importIndex();   // 自加题目进了 BANK，id 索引要跟着更新
  save();
  return res;
}

/* ── 路由 ── */
function goStep(n){ step=n; if(n<4) salt=0; if(n!==4) chosen=null; render(); window.scrollTo(0,0); }
function render(){
  /* 三个页面状态：step<4 选维度，step===4 且还没定题 = 出题列表，
     step===4 且 chosen = 写作台。step 单独一个数分不开后两个，必须看 chosen。 */
  /* 切页前先停表并丢掉旧视图的回调 ——
     计时器住在模块级，不在这里掐掉的话，它会继续对着已被 innerHTML=''
     摘掉的节点写 textContent（而且再次进写作台会叠加第二个 interval）。 */
  timerStop(); timerOnPaint=timerOnReset=timerOnEnd=null;
  if(step<4) renderChoice();
  else if(chosen) renderDesk();
  else renderResults();
  renderSteps(); renderNav();
}
function renderNav(){
  var nav=document.getElementById('nav'), hint=document.getElementById('navhint'), back=document.getElementById('btnBack');
  nav.classList.remove('hide');
  /* 「上一步」只在真的有上一步时【存在】，而不是用 visibility:hidden 藏起来 ——
     visibility:hidden 的元素照样占布局（实测第1步它占 56px，把 navGo 的右边缘
     顶到 393px，超出 390px 视口 3px）。没有上一步时就把它从 DOM 里摘掉。 */
  var canBack = step>0 || (step===4&&chosen);
  if(!canBack){ if(back.parentNode) back.parentNode.removeChild(back); }
  else {
    if(!back.parentNode) nav.insertBefore(back, nav.firstChild);
    back.style.visibility='visible';
    back.textContent=(step===4&&chosen)?'← 回到选题':'上一步';
    back.onclick=function(){
      if(step===4){ if(chosen){ chosen=null; } else { step=3; } }
      else step=Math.max(0,step-1);
      render(); window.scrollTo(0,0);
    };
  }

  /* 底栏两个出口：
     「下一步」= 直接去下一个维度（当前步没选也能走，相当于在这一步点「不限」再往前）
     「就按这几步出题」= 现在就出结果，不必走完四步
     两个都在，因为「点不限卡住」正是因为只有后者能往前走。 */
  ['navGo','navNext'].forEach(function(id){ var o=document.getElementById(id); if(o) o.remove(); });
  if(step<4){
    var next=el('button','abtn');
    next.id='navNext';
    next.textContent='下一步';   /* 不带箭头：390px 下三个按钮的 nowrap 宽度会超出视口 3px */
    /* flex:0 1 auto 而不是 none —— none 会让按钮不参与压缩，
       窄屏放不下时整条底栏就横向溢出（实测 320px 时右边缘到 338px）。 */
    next.style.flex='0 1 auto';
    next.addEventListener('click',function(){
      var at=['g','d','c','e'].indexOf(STEPS[step].k);
      step=Math.min(at+1,3);
      if(step>maxStep) maxStep=step;
      if(at>=3 && maxStep<4) maxStep=4;   // 走到最后一格后，「定题」格变为可点
      render(); window.scrollTo(0,0);
    });
    nav.appendChild(next);
    var go=el('button','abtn pri');
    go.id='navGo';
    go.textContent='按这几步出题';
    go.style.flex='0 1 auto';   /* 可压缩：390px 下 flex:0 0 auto 会让右边缘超出视口 3px */
    go.addEventListener('click',function(){ step=4; salt=0; render(); window.scrollTo(0,0); });
    nav.appendChild(go);
  }
  var names={g:G,d:D,c:C,e:E};
  if(step<4){
    var at2=['g','d','c','e'].indexOf(STEPS[step].k);
    var cur=STEPS[step].k;
    var picked=['g','d','c','e'].filter(function(k){return !!sel[k];});
    var mine=names[cur][sel[cur]];
    if(!picked.length){
      hint.innerHTML='一步都不用选 —— 点右边直接看全部 '+BANK.length+' 篇。';
    } else {
      hint.innerHTML=(mine ? ('第 '+(at2+1)+' 步已选 <b style="color:var(--gold)">'+mine.nm+'</b> · ') : '')
        +'共选了 '+picked.length+' 步';
    }
  } else if(chosen){
    hint.innerHTML='已定：<b style="color:var(--gold)">'+finalTitle(chosen).replace(/</g,'&lt;')+'</b>';
  } else {
    hint.textContent='挑一篇点「就写这篇」';
  }
}

/* ── toast ── */
var tOut=null;
function toast(msg){
  var t=document.getElementById('toast'); t.textContent=msg; t.classList.add('on');
  if(tOut) clearTimeout(tOut);
  tOut=setTimeout(function(){ t.classList.remove('on'); },1900);
}

  toast('回到第 1 步');
});

/* 自检 */
(function selfTest(){
  var bad=[];
  var seen={}, need={g:{},d:{},c:{},e:{}};
  BANK.forEach(function(b){
    if(!b.id||!b.t||!b.idea||!b.mat||!b.mat.length||!b.how||!b.how.length||!b.trap){ bad.push('字段缺失: '+JSON.stringify(b.t)); return; }
    if(seen[b.id]) bad.push('重复 id '+b.id);
    seen[b.id]=1;
    ['g','d','c','e'].forEach(function(k){ if(!b[k]) bad.push(b.id+' 缺 '+k); else need[k][b[k]]=1; });
  });
  ['g','d','c','e'].forEach(function(k){
    var T={g:G,d:D,c:C,e:E}[k];
    Object.keys(T).forEach(function(x){ if(!need[k][x]) bad.push('没有任何题目用到 '+k+'='+x+'（'+T[x].nm+'）'); });
  });
  if(!LS.ok) bad.push('localStorage 不可用，收藏功能会失效（不影响做题）');
  window.__ZXZ={bad:bad,n:BANK.length};
  if(bad.length && console.warn) console.warn('[作文题材向导] 自检发现问题:',bad);
})();
