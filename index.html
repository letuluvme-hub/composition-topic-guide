BANK.push({id:'K132',t:'《{妈妈}第一次学会扫码付款》',g:'rec',d:'family',c:'first',e:'admire',idea:'妈妈学扫码付款时手抖着输错两次密码，那点笨拙让我第一次看见，她也在努力追上我，而不是被我甩在后面。',mat:['她在付款码上按错了两次数字，删掉重新输一遍','手机屏被她擦得只剩一层指纹，怎么擦都擦不花','收银台前她把手机递过来，说你帮我看看后面','回家以后她在纸条上练密码，一张纸写满五行'],how:['开头：从妈妈第一次扫码付款、我蹲在旁边替她数位数写起，先写收银台','主体：写输错密码、擦不干净的屏、还有练满五行的纸条','深化：写我明白她不是笨，是怕在店门口耽误我看新手机的时间','结尾：收在她练会那晚，把纸条贴到鞋柜内侧这个动作上'],trap:'最容易把父母落伍当笑料，或者写成一次煽情和解；那五行练密码的纸条才是最该留住的东西',who:['妈妈','我']});
BANK.push({id:'K133',t:'《第一次把剩菜热了三遍还等不到人》',g:'rec',d:'family',c:'first',e:'down',idea:'第一次独自守着一锅剩菜等父母，热到第三遍才明白，他们的加班不是不想回，是这条路回不来。',mat:['锅里是中午的红烧肉，酱汁在锅边结成一层冻','微波炉转盘转起来咔咔响，客厅的灯忽明忽暗','锅底的饭粒结成一团，我用勺背一点点刮下来','门锁响的时候，墙上的钟已经走过十点一刻了'],how:['开头：从那晚只剩我一个人、锅上留着中午的剩菜写起，先不抱怨','主体：写热第一遍、第二遍、第三遍，天花板一点点变白','深化：写我懂了他们不是不想回来，是这条路太远，回不来','结尾：写我把热好的肉装进保鲜盒，第二天带去学校吃，不提一句怨'],trap:'最容易写成苦情戏，或者顺手把父母批评一顿；只用手温、结冻的酱汁和锅底的声音写等，不下判断',who:['爸爸','妈妈','我']});
BANK.push({id:'K134',t:'《我剪破了{奶奶}晒的被子》',g:'rec',d:'family',c:'mis',e:'guilt',idea:'被子上那个洞我赔了一星期的钱，却赔不回她只说一句天热反正要拆洗的那种轻，和她咽下去的半句责备。',mat:['剪刀是借来修窗帘的，我顺手在被角上剪了一刀','棉花从洞口探出来，像一小撮一直没散掉的云','她摸了摸洞口说天热要拆洗，让我别站着看，快走','拆洗的被子晒开以后，里面留着一个旧信封，没拆'],how:['开头：从我剪破被角后立刻想用针线藏起来这个动作写起','主体：写她摸洞口、说天热、赶我走开这三个反应，一个不重','深化：写我赔出去的是被子钱，她咽下去的才是我的莽撞和失望','结尾：收在那个旧信封上，她说要留着看我以后考多少分'],trap:'最容易写成闯祸挨骂或者我终于懂事的一次反转；棉花探出来和那个旧信封才是能救这篇的细节',who:['奶奶','我']});
BANK.push({id:'K135',t:'《我把{外婆}的咸菜坛子抱摔了》',g:'rec',d:'family',c:'mis',e:'admire',idea:'坛子碎了，里面不只有咸菜，还有她腌了三个月的那种舍不得，我用一个月的时间重新学会等。',mat:['坛口一圈盐霜，碎成五瓣摊在阳台的水泥地上','卤水淌进地砖缝里，干了以后一片发黑，有味','她蹲下来捡碎片，把最薄的那片收进口袋里，不说话','新坛子是爸爸从旧货市场拉回来的，四十块钱'],how:['开头：从坛子在阳台摔碎的那一声写起，先写声音再写人','主体：写捡碎片、把最薄那片收好、还有她那句轻描淡写的没事','深化：写我这才知道，腌三个月的东西坏在三分钟，等比做更难','结尾：写新坛子腌满那天起，我改成每隔一周去看一次，没说原因'],trap:'最容易写成我太大意的单薄认错，或者把外婆的辛劳铺陈成苦难；捡薄片这个动作要收住全文',who:['外婆','爸爸','我']});
BANK.push({id:'K136',t:'《我错把醋当酱油倒进了碗里》',g:'rec',d:'family',c:'mis',e:'insight',idea:'一碗倒错的醋让我闻到那股熟悉的酸，也第一次认出，家里所有瓶瓶罐罐上都贴着她写的日期。',mat:['瓶身标签褪得只剩一个陈字，边缘还卷着口，翘起','醋倒进面里，那股冲鼻的酸味一下窜上来，呛眼睛','她端着面跑过来，手里还攥着一块湿抹布，没放下','她揭下旧瓶，转身从柜底翻出装满了的那一瓶'],how:['开头：从我倒错醋那一刻、她正端面进屋的动作写起，先写她的脸','主体：写她抢过碗、掀开瓶盖闻、再转身翻柜底这三步动作','深化：写柜底那排瓶子上她写的日期，比我的记事本还要准','结尾：收在我现在动锅前，会先把每一个瓶盖都认一遍，再下手'],trap:'最容易写成一场笑闹然后收一句我们家很快乐；要从瓶盖和日期写出她那份不容乱的秩序',who:['妈妈','我']});
BANK.push({id:'K137',t:'《谁能让{外婆}的咳嗽停下来》',g:'rec',d:'family',c:'contest',e:'warm',idea:'我们比的不是谁赢了，是谁能让那个人的声音安静下来，这场比赛从来就没有赢过，因为谁也赢不了她。',mat:['外婆咳一声要三秒，压下去得先喝一大口温水，慢慢喝','我假装去倒水，抢着把保温杯递到她手心里，手心朝上','爸爸一开窗就说烟味才让她咳，她没接这句话','她的咳嗽和炉灶的火苗一高一低，谁也不让谁'],how:['开头：从家里那场没人宣布的比赛写起，只要一咳就有人起身','主体：写我抢水、爸爸开窗、奶奶假装去关煤气这三个人','深化：写我明白谁都赢不了，所以这场比赛要年复一年比下去','结尾：收在今年她咳得少了，可我们三个的姿势都还在，没改'],trap:'最容易写成病情戏，或者把咳嗽当伏笔铺一段伤感；只写起身这个动作的重复，不惊动病情',who:['外婆','爸爸','我']});
BANK.push({id:'K138',t:'《筷子头对筷子头的那个晚上》',g:'rec',d:'family',c:'contest',e:'plain',idea:'饭桌上抢最后一块排骨的人换了三轮，规矩从没定过，公平是我们自己在每一顿里感觉出来的。',mat:['奶奶总把骨头那一侧转向我们这边，自己不吃','爸爸假装夹到一筷子素菜，转身又放回盘子中央','我夹到以后又放进奶奶碗里，前后一共三次，她没发现','整桌没有一个人提过让给奶奶这五个字，一次也没有'],how:['开头：从晚饭抢最后一块排骨的四个回合写起，先写筷子','主体：写转骨头的角度、两双筷子的假动作，还有我的三次让','深化：写我明白规矩从没被人定过，全靠每一顿的临时判断，公平靠感觉','结尾：写现在轮到我把骨头那一侧转过去，全家没吭声，就这样'],trap:'最容易写成温馨套路或者逐盘记账的流水账；每一次假夹的角度要写清，才不是空喊互相谦让',who:['奶奶','爸爸','我']});
BANK.push({id:'K139',t:'《打赌谁先吃完一碗面，我输了三回》',g:'rec',d:'family',c:'contest',e:'admire',idea:'三碗输掉的赌约让我发现，长辈所谓的不争，是把时间一点点让出来，好让我们赢得轻松。',mat:['我输了三回，每一回压岁钱都实实在在输一局，她赢','她吃面前总先把碗里的面夹一半到我碗里，不吃','面汤很烫，她吹得很慢，一口要吹五六下才敢喝','赌约是她先提起来的，三年了没人取消过，谁也没提'],how:['开头：从那场谁先吃完面的赌约，和我的三连败写起，带上赌注','主体：写夹给我的半碗面、慢吹的热汤、还有赢了不说话','深化：写我这才明白她早就不会输，她只是要让我赢个痛快，也赢我','结尾：写今年赌约改成我先吃，我故意慢，一口一口地磨'],trap:'最容易滑成尊老爱幼的说教；要用她不会输却一直让我这个反差承载，别把结尾写成口号',who:['外婆','我']});
BANK.push({id:'K140',t:'《从菜场到她家那条下坡路》',g:'rec',d:'family',c:'journey',e:'protect',idea:'那条不到五百米的下坡路走了十几年，最后变成我替她拎菜的那一段，也是我替她看着的那一段。',mat:['路中间有一块砖翘着，我每次都得绕到边上走，怕摔','她走在前面，我跟在后面拎两个塑料袋，手心出汗','小卖部门口的塑料凳，总被人占着一张，空着两张','到了楼下她先站着喘口气，才掏钥匙开门，手抖'],how:['开头：从菜场回她家那条下坡路的起点写起，先写路面坡度','主体：写绕开翘砖、换手拎袋、到楼下先喘气这三件事，不议论','深化：写这条路我熟到能闭着眼走，熟的是她慢下来的速度，不是路','结尾：写现在换我走在前面，替她看着那段坡，不说原因'],trap:'最容易写成歌颂长辈的散文式抒情，路面细节全被抒情盖住；一块翘砖和换手拎袋已经足够撑起',who:['外婆','我']});
BANK.push({id:'K141',t:'《过年回家那四个小时的车程》',g:'rec',d:'family',c:'journey',e:'plain',idea:'车程里没人说话，谁先下车谁就去开门，这是我们家不用商量就定下来很久的规矩，也是最省力的那种亲。',mat:['高速服务区的厕所灯白得晃眼，风从门缝进来','后座睡着一个人，鞋掉在过道中间没人捡，歪着','导航报前方要拥堵二十分钟，车比原来还要慢','到楼下我第一个跳下车，跑过去按门铃，抢先一步'],how:['开头：从过年回家那四小时车程里的沉默写起，先写声音','主体：写睡着的人、掉在过道的鞋、拥堵播报和没人开口，全写静','深化：写我明白沉默不是冷战，是我们替对方省着一天的力气','结尾：写楼道的灯一层层亮起来，比说一声到了还要管用，不喊'],trap:'最容易写成旅途流水账，或者中途抒情一大段；分工和沉默的具体内容就是这篇的全部，别加风景',who:['爸爸','我']});
BANK.push({id:'K142',t:'《返校那天我只把她送到路口》',g:'rec',d:'family',c:'journey',e:'guilt',idea:'我以为把她送到路口就算告别，其实那天她一直站在原地，直到看不见车才上楼，我却在车上红了眼。',mat:['路口有个报刊亭，她坚持不进去，说不冷，就站着','布袋子换成一只手拎着，肩膀看上去没那么塌','车进站的时候她往后退了半步，人始终没动，只抬手','我在车上回头看，她还站在原来那个点上没走'],how:['开头：从返校那天我把她送到路口就想走的念头写起，别铺垫','主体：写不进报刊亭、只拎一只手、看车时后退半步这三处','深化：写我怕她看见我眼睛红，而她一直在等我回头那一眼，也在数','结尾：写后来我每次都多坐两站，才敢回头去看那个路口'],trap:'最容易靠车站分别煽情，收在我流泪了这种直白上；要用不进去的报刊亭和后退的那半步压住情绪',who:['外婆','我']});
BANK.push({id:'K143',t:'《糖罐底下的两张老照片》',g:'rec',d:'family',c:'secret',e:'warm',idea:'糖罐底下压着两张老照片她从没给我看，一张是全家福，一张只有她自己站在旧厂门口，纸都发脆了。',mat:['铁皮糖罐的盖子要先敲两下，才松动得了，有锈','底下用塑料袋包着两张老照片，边角已经发脆','一张全家福，一张单人照，背景是旧厂门口，褪色','照片背面有铅笔写的日期，和一串看不清的地址'],how:['开头：从我偷开糖罐找糖，碰到底下硬硬的东西写起，先写心跳','主体：写塑料袋、两张照片，还有背面那行铅笔小字，不解释','深化：写她留了全家福也留了只有自己那张，我猜她怕被忘','结尾：写照片放回原处，糖罐照旧放在灶台边，不追问，不问'],trap:'最容易把照片背后的故事编成家族秘辛或悲情往事；只让背面铅笔字和塑料袋包法暗示，答案留在外面',who:['外婆','我']});
BANK.push({id:'K144',t:'《{外婆}把碗柜最上层让给了我》',g:'scene',d:'family',c:'object',e:'insight',idea:'碗柜最上层要踮脚才够得着，她清空那一层给我那年，我只嫌放东西麻烦，不知道那是她够不到的高度。',mat:['碗柜上层垫着一块旧毛巾，剪成小块用来防滑','她踮着脚，把碗一个一个从上层搬下来摆好，慢','递碗的时候用围裙兜着，怕碗沿磕出小缺口，很轻','那一层后来放我的书包，和卷起来的试卷卷子，堆着'],how:['开头：从碗柜最上层被清空出来的那一天写起，先写高度','主体：写旧毛巾、踮脚搬碗、围裙兜着递这三处细节动作','深化：写我明白她把自己够不到的高度让给了我，还不许我说谢','结尾：写我现在放东西之前，先把那一层擦一遍才放上去，不响'],trap:'最容易写成被宠着的浅感动，或者只靠一个踮脚的镜头硬煽情；毛巾、防滑、围裙三处笨拙细节要落实',who:['外婆','我']});
BANK.push({id:'K145',t:'《她锁起来的那个樟木箱》',g:'scene',d:'family',c:'secret',e:'curio',idea:'家里有个上锁的樟木箱，钥匙一直挂在她自己身上，我到十四岁才懂，那不是不能给我看，而是留给她自己。',mat:['樟木箱的铜锁发黑，锁孔用一小块旧布堵着，防尘','她上锁的时候是背对着我们做的，谁也看不见','箱盖中间磨得比两边亮，能照见一点人影，发亮','梅雨天箱角垫着两块旧报纸，防潮用，边缘发软'],how:['开头：从家里那个始终上锁的樟木箱写起，先画它的样子','主体：写背对着人上锁、箱盖磨亮、垫箱角的报纸这三样','深化：写她守的是自己那段没人能问的年月，并不是不疼我们','结尾：写我从此没再问过，只每年春天替她擦一次铜锁，一次'],trap:'最容易编造箱中之物，把它写成家庭秘密或悬念；只写锁、磨亮和防潮报纸，答案要留在门外',who:['外婆','妈妈','我']});
BANK.push({id:'K146',t:'《楼下小店关门那天，她的旧伞被五块钱买走》',g:'scene',d:'family',c:'change',e:'down',idea:'楼下开了十年的小店关掉了，她那把旧伞被人五块钱买走，她却站在原地看了很久，看到路灯亮起来。',mat:['卷帘门只拉下一半，门口扔着半截烟头，没人捡','那把深蓝伞上有一块洗不掉的旧白痕，发硬了','买伞的人试了两次，才把伞撑开，卡了一下，没熟','她盯着看的，是伞面被风翻过来的那一瞬，没说话'],how:['开头：从卷帘门落下来那一刻、她站在店门口写起，先写灯','主体：写五块钱成交、两次没撑开的伞、翻过来的伞面三处','深化：写她舍不得的不是伞，是这条街上她认得的人和声音','结尾：写那天回家一路她一句抱怨也没有，我不评论，只记路'],trap:'最容易写成旧店消失的时代感议论，或者给老人的孤独下一个定论；五块钱和没撑开的伞已经足够',who:['外婆','我']});
BANK.push({id:'K147',t:'《饭桌上没人说出口的那句要不要转学》',g:'scene',d:'family',c:'word',e:'insight',idea:'那句要不要转学在饭桌上被提起三次又咽回去三次，我们家真正说出口的只有筷子碰碗的声音。',mat:['爸爸夹着菜开的口，说到一半改口说菜咸了，没抬头','我低头喝汤，汤面上晃着两个人影，一晃一晃','妈妈把电视声音调大了两格，谁也没有去拦，随它响','最后谁也没再提这事，碗底的饭都吃得干干净净'],how:['开头：从饭桌上那句转学的话起了个头又落下写起，别解释','主体：写改口的菜咸了、调大的电视声、低着不动的那颗头，无声','深化：写一家人的关心都拐了弯，谁也不肯先做那个开口的人，都等','结尾：写现在我可以自己提，只是要等屋里关灯以后再说，压低'],trap:'最容易写成批评父母不会沟通，或者一次和解的煽情收尾；拐弯的话和声音细节才是推进的东西',who:['爸爸','妈妈','我']});
BANK.push({id:'K148',t:'《如果外婆的手机二十年都不坏》',g:'imagine',d:'family',c:'object',e:'protect',idea:'想象那台手机二十年都不坏，我才看清那个小屏幕里装着的其实是我们全家的日子，不是一百个联系人。',mat:['屏幕右上角有一道细裂，她说是自己不小心摔的','早上第一个未接来电多是推销打来的，她照旧接','相册按人分过文件夹，家里人永远排在第一个','背面贴着手机店送的贴纸，边角已经磨起毛边'],how:['开头：从我想象这台手机用二十年都不坏这个设定写起，不解释','主体：写不换机、照旧接推销电话、按人分好的文件夹三样','深化：写一台不坏的手机让我看清她怎样把一大家子装进去','结尾：收在这个想象让我今天先回她一条消息这个小动作上'],trap:'最容易写成科技让亲情变淡的议论，全篇停在设备上；那道细裂和文件夹的顺序才是她的心思',who:['外婆','我']});
BANK.push({id:'K149',t:'《如果我一辈子不告诉外婆那件事》',g:'imagine',d:'family',c:'secret',e:'guilt',idea:'想象那件小事始终没说出口，我才发现我以为的隐瞒，在她那里有另一个解释，而且很轻。',mat:['那件事是一张没送出去的贺卡，压在语文书底下','她进门的时候我赶紧把书合上，动作慢了半拍','她以为是成绩单，看了一眼又放回桌子原处，没问','后来她只提过一句，说我最近好像话少了，很轻'],how:['开头：从我想象这件事一辈子都没说出口的那个夜里写起，设定先给','主体：写压在书底的卡片、慢了半拍的手、还有那句最近话少了','深化：写在她的理解里我的沉默只是累了，真相简单得可笑，不复杂','结尾：收在想象了一夜之后，我把那张贺卡放到了桌上，没说'],trap:'最容易编造沉重的秘密，或者误会成天大的事；那件事必须小到只值半拍动作那么大',who:['外婆','我']});
BANK.push({id:'K150',t:'《如果外婆家的墙会自己记事》',g:'imagine',d:'family',c:'change',e:'curio',idea:'想象她家的墙记下每次挪动家具的位置，就等于记下这个家每一次搬动和每一次说不清的别离。',mat:['墙上还挂着几个不再用的挂钩，钩子上落着灰','每个钩子下面有一道铅笔印，标着不同的高度','她记得哪一年沙发短了两寸，谁也说不清原因','新墙纸盖住了三代墙印，接缝处对不齐线，露出底'],how:['开头：从我想象她家的墙会自己记事这个设定写起，先看墙','主体：写空挂钩、铅笔划痕的高度、还有那两年短的沙发，不抒情','深化：写搬走的是家具，留下的是高度差，一家人过的高度不同','结尾：收在我现在每次搬完家，都去墙上比一比这个习惯上'],trap:'最容易靠这个虚构设定长篇抒情，脱离实物；想象只留一层，其余全用真实的铅笔痕和挂钩支撑',who:['外婆','我']});
BANK.push({id:'K151',t:'《我家到底该不该装空调》',g:'argue',d:'family',c:'change',e:'plain',idea:'一台空调装不装，表面是怕热，实际争的是这个家里谁有资格说出自己的难受，谁先低头。',mat:['外婆说电风扇用了十八年，坏了那年才换新的','爸爸在手机上查了三天的静音型号，一直没下单','暑假夜里我翻来覆去，身下的凉席都是潮的，没睡好','装好以后，她第一次自己去按那个遥控器，按错了'],how:['开头：从装空调这件事在饭桌上谈了一个暑假写起，先列理由','主体：写十八年的风扇、三天静音型号、还有夜里翻身的难熬','深化：写争的其实是声音，承认怕热等于承认自己需要被照顾','结尾：收在遥控器最后被放到她手边这个小细节上，不辩论'],trap:'最容易写成大人不理解小孩的委屈控诉；三种真实理由都要摆出来，长辈不能写成反派',who:['外婆','爸爸','我']});
BANK.push({id:'K152',t:'《"随便"到底算不算一种回答》',g:'argue',d:'family',c:'word',e:'curio',idea:'一句随便在这个家里用得太久，久到说话的人以为那代表同意，其实全家没有一个人被真正问过想要什么。',mat:['点菜时我说随便，选完以后又嫌那道菜太淡，被念','家长也会说随便，第二天转学的事照办不误，没商量','我学他们说随便，被反问一句你真不挑吗啊，愣住','我改口说我要吃面，全桌都愣了一下，没人接，静了'],how:['开头：从随便到随便你的那次晚餐写起，先把菜名记上，别评论','主体：写嘴上说随便、身体却做了另一个选择的两处细节，成对','深化：写所有人都在提供方便，唯独没人给出真实的那个答案，都省事','结尾：写现在我说随便，后面一定加一句真的，收在我改口上，收尾'],trap:'最容易把话题拔高成人际相处的大道理，或者写成家庭辩论赛；用一盘具体的菜和一次选择收住',who:['妈妈','我']});
BANK.push({id:'K153',t:'《过年走亲戚该按谁的顺序排》',g:'argue',d:'family',c:'crowd',e:'plain',idea:'排顺序这件事我们吵了三年，可两家人都不知道对方那年的难处，只知道谁先被踩了面子。',mat:['两家都说要先去外婆家，谁也不肯先让一步，僵着','手机里的排班表前后改了七版，都没能定下来','我被派去当通知员，在两家之间来回传话传了三趟','奶奶那句随他们吧，反倒让我们家安静了很久，没声'],how:['开头：从过年走亲戚的顺序在群里吵到深夜写起，先列两套','主体：写两套说法、七版排班表，还有派我去通知这件事，都写','深化：写两边争的不是顺序，是每年被让的那一次该轮到谁，其实','结尾：收在今年我提了个更笨的办法，就是谁近先去谁家，落地'],trap:'最容易写成群聊实录，或者把亲戚写成讽刺段子；班表改了七版和我这个通知员才是落点',who:['奶奶','爸爸','我']});
BANK.push({id:'K154',t:'《给{外婆}写的一张手机使用说明》',g:'apply',d:'family',c:'word',e:'plain',idea:'把说明书写成她认得的菜谱，她才第一次肯自己点开视频通话，还照着念了一遍，念错了也没删。',mat:['第一行我写的是接绿色的那个，绿色的按钮，圈出来','关键词全换成菜名：红烧、烧焦、找不到人，照抄','她照着念，念到第三条自己就笑了出来，没恼','那张纸折好，贴在她手机壳背面，随身带着，怕丢'],how:['开头：从我用五个步骤教外婆打视频电话这个场面写起，写步骤','主体：写把功能全换成菜名、念错的地方也不删掉这两处，照实','深化：写说明书不是给她看懂的，是让她的手不必再来问我一次','结尾：收在现在她打不通会先找那张纸这个小习惯上，不煽情'],trap:'最容易写成干巴巴的实用流程，或者结尾忽然煽情；要用菜名这类真会发生的错配撑起每一步',who:['外婆','我']});
BANK.push({id:'K155',t:'《贴在冰箱门上的一张家庭分工表》',g:'apply',d:'family',c:'crowd',e:'protect',idea:'一张贴在冰箱门上的分工表，让我们家第一次不用喊，就知道该谁去倒垃圾，也第一次有人抢着接手。',mat:['冰箱门贴的是磁扣纸，一格里写一个人名字，正楷','爸爸那一格只写一个油字，字写得最大，最黑','忘了打勾的那一格，下周还留着没人补上，空着','我主动把倒垃圾那一格接了过来，写上我的名字'],how:['开头：从我们家的分工第一次从冰箱门上开始写起，先看纸','主体：写磁扣纸、每格一个人的名字，还有忘记打勾的那一格','深化：写喊了十年的谁去倒，其实只要一张纸就能说得清，不吵','结尾：收在现在打勾的人会顺手把勾画得更整齐一点上，不夸'],trap:'最容易写成家庭会议纪要或感动流水账；表上要有失误、有擦改、还要有人主动伸手',who:['爸爸','外婆','我']});
BANK.push({id:'K156',t:'《给家族群发的一份拜年顺序指南》',g:'apply',d:'family',c:'crowd',e:'down',idea:'我把拜年顺序写成一张照着走的指南，才看见大人之间那些不肯明说的亲疏远近，和谁先谁后。',mat:['按辈分排序，每家后面还附上忌口和忌讳，很细','写完才发现有两家被我排在了最后面，没人问','爸爸看完删掉了其中两行字，什么也没解释，只删','剩下的顺序他照着念了三年，一次都没有改过'],how:['开头：从我给家族群做拜年顺序表的那个晚上写起，先写表格','主体：写辈分排序、忌口备注，还有被删掉的那两行字，不解释','深化：写一张表把平时不好意思当面说的话全摊平了，很平','结尾：收在今年他照旧照着念，我照旧照着排这件事上，不动'],trap:'最容易写成对亲戚势利的批判，或者写成家庭喜剧；用被删掉的两行和忌口备注写出分寸',who:['爸爸','外婆','我']});
BANK.push({id:'K157',t:'《讲台粉笔盒里最后那半截》',g:'rec',d:'teacher',c:'object',e:'warm',idea:'她总把用剩的半截粉笔收回盒子，说还能再用两天，那只盒子里积了十几截，全是她替下一节课先留好的。',mat:['粉笔盒底层躺着十几截短的，最短的一截不足一节长','她用之前先在掌心把粉笔转一下方向，再捏住写','断成两截的接回笔套，还能凑合写小字和日期','盒盖内侧贴着一张纸条，写满了日期和课次编号'],how:['开头：从放学后她收拾讲台、从粉笔盒里往外掏短粉笔写起','主体：写十几截短粉笔、在掌心转一下、还能写小字这几处','深化：写我懂她留的不是粉笔，是下一节课能开口的那几秒','结尾：写毕业那天盒子空了，她把它留在讲台抽屉最里层'],trap:'最容易写成赞颂老师节俭的品德作文，罗列她省下的东西；要把十几截的长度差别和纸条上的日期写出来',who:['班主任','数学老师','我']});
BANK.push({id:'K158',t:'《她那只装满红笔头的旧铁盒》',g:'rec',d:'teacher',c:'object',e:'curio',idea:'办公室抽屉里有一只旧铁盒，里面全是写秃了的红笔头，她一个也不扔，说攒着还能换一支新的。',mat:['铁盒里躺着几十个红笔头，颜色深浅完全不一样','最长的一支写到后来，只能在纸上点出一个小点','笔杆上还套着一圈橡胶皮，边缘都磨得发白了','盒底压着一张换笔价目表，她圈了最便宜那一档'],how:['开头：写我在办公室抽屉里翻出那只铁盒，先数了笔头的个数','主体：写笔头的深浅、只能写小点、橡胶皮磨白这几处细节','深化：写我明白她攒的不是笔头，是批完一叠卷子后的踏实','结尾：写毕业那周她把铁盒送给了接班来的那个实习老师'],trap:'容易写成一件旧物带出对我的照顾，落点很虚；必须让笔头的数量和那根写不出字的笔承载感情',who:['班主任','实习老师','我']});
BANK.push({id:'K159',t:'《她在走廊上等我的那两分钟》',g:'rec',d:'teacher',c:'moment',e:'warm',idea:'她本来可以直接回办公室，却站在走廊上等跑完八百米的我，那整整两分钟里她一句话也没有说。',mat:['我在操场跑最后两百米，她站在终点线外等着我','她手里捏着我的水壶，瓶盖已经提前替我拧松了','她先看了我的脸色，然后才把水壶递到我手里','她只说了句不累吧，就转身往办公楼那条路走'],how:['开头：从八百米跑完冲过终点、她站在线外等我的那幕写起','主体：写水壶、松开的瓶盖、她先看脸色才递水的次序顺序','深化：写她其实早就走了，是绕了一段路才刚好赶上我回来','结尾：写后来每次体育课，她都不在终点，而在跑道中段'],trap:'最容易写成师生情深的套路，一上来就说她多关心我；要靠绕路、水壶和那两句短对话把关心做实',who:['班主任','我']});
BANK.push({id:'K160',t:'《晚自习铃响后她还在改最后一本》',g:'rec',d:'teacher',c:'moment',e:'plain',idea:'铃响了她没有立刻走，因为我们班最后一本作业还没改完，她把灯关到只剩讲台上那一盏日光灯。',mat:['教室的灯一排排关掉，只剩讲台上那盏日光灯亮着','她左手按住本子，右手写批语写得又快又很稳','后排同学的椅子响了一声，她抬头看了一眼那边','最后一本合上，她才把笔帽仔仔细细扣好，灯丝才不晃'],how:['开头：写晚自习铃响、全班开始收拾书包而她一个人没有动','主体：写关灯的顺序、批改的速度、抬头看后排这几处细节','深化：写我以为她会先走，原来她只为一本本子留到最末','结尾：写第二天本子发下来，最后一本上的批语比平时更轻'],trap:'容易写成老师不辞辛苦的赞美，缺少现场感；要用关灯的顺序和她抬头那一下把时间撑住',who:['班主任','我']});
BANK.push({id:'K161',t:'《她说别急，我却在门外站了很久》',g:'rec',d:'teacher',c:'moment',e:'guilt',idea:'我没交上周的错题本，她只说了三个字别急，我却因为这三个字在门外站了一整个课间没敢进班。',mat:['错题本我塞在书包最底下，封面还沾着一粒饭粒','她翻了两页，把本子合上，只说了句别急而已','我说我今天带来，说完就低下头去什么也没有带','那节课我的笔尖在纸上停了很久，一个字也没有写'],how:['开头：从她翻开我空白的错题本、只说别急这两个字写起','主体：写塞在包底的本子、我接不下去的话、停住的笔尖','深化：写我怕的不是被批评，是她连批评都省下的那份失望','结尾：写第二天我把本子补齐，放到她桌上，什么也没说'],trap:'容易写成愧疚到痛哭的说教；要把那份不敢抬头的心情压住，用动作而不是眼泪来表达',who:['班主任','我']});
BANK.push({id:'K162',t:'《我答应每天问一道题，做了九天》',g:'rec',d:'teacher',c:'promise',e:'warm',idea:'我答应过她每天问一道数学题，前九天雷打不动，第十天起我开始抄答案，问问题这件事就这样没了。',mat:['本子前一页写题，后一页写答案，是两种字迹','第九天那道题，我硬算了二十分钟，草稿纸用掉两张','第十天那页是空白的，只抄了答案没有写过程','她把本子翻到第十天，没有问我为什么这样做'],how:['开头：从本子上那两种字迹写起，前一种工整后一种潦草','主体：写算题的那二十分钟、空白页和她没问的那一句话','深化：写她早就看出我抄了答案，只是没有当众拆穿我罢了','结尾：写我把那一页撕掉重新算，算了整整一个周末才算对'],trap:'容易写成自己努力学习的励志文；要用两种字迹和那页空白把半途而废写出来，不喊口号',who:['班主任','我']});
BANK.push({id:'K163',t:'《我说下周一定交，后来提了三次》',g:'rec',d:'teacher',c:'promise',e:'insight',idea:'我对她说过三次下周一定交，第一次交了，第二次忘了，第三次她主动说这次就算了，不用交了。',mat:['第一次交上去的是两页纸，字写得非常非常小','第二次她没有追问，我只说老师我下周一定交上去','第三次她把本子推回来，说这次就算了不用交了','她说那几个字的时候，声音平常得像在念名单一样'],how:['开头：从第一次下周一定交写起，把三次并排摆开来说明白','主体：写两页小字、她没追问和被推回来的那本作业本子','深化：写承诺失效以后，最先塌掉的是她那点还没用完的耐心','结尾：写现在我说下周一定，会先在便签上写个具体日期'],trap:'容易写成拖延的自我检讨，没有细节；要用三次的差别和作业本的厚度变化来承载',who:['班主任','我']});
BANK.push({id:'K164',t:'《第一次收作业，我少记了一个人》',g:'rec',d:'teacher',c:'first',e:'guilt',idea:'我当课代表第一次收作业，漏掉了一个同学的名字，被记进名单以后，我整节课都没敢抬头看她。',mat:['收本子的登记本上，有一格是空的，连日期都照抄着','我把空的那一格照抄了一遍，笔迹有点发抖，连自己都看出来了','名单贴在讲台边，她扫了一眼就摘走了那张，塞进抽屉里','那个同学一直站在门口等着，手里还捏着本子，没有走进来'],how:['开头：从登记本上那格空白写起，先交代那个名字是我漏记的','主体：写照抄时手抖、名单被摘走、门口那个人的位置，前后各写一次','深化：写我怕的不是挨骂，是让她替我收拾这个残局的麻烦','结尾：写第二天我主动去办公室，把那个同学的本子补交上'],trap:'容易写成马虎被批评的流水账；要把空白的那一格和门口那个人的位置写清楚',who:['班主任','课代表','我']});
BANK.push({id:'K165',t:'《第一次替她收卷子，我用书包压住》',g:'rec',d:'teacher',c:'first',e:'protect',idea:'第一次放学留下来帮她收卷子，风把最上面几张吹散了，我用整个书包横着压住了那一沓纸。',mat:['风从后门灌进来，卷子一页一页地掀起边角，哗哗地翻','我把书包横着压住最上面那一沓，压得纸都不响','她一边捡一边说，别压坏了你自己那个书包，声音不大','卷子的角上还是留下了一道深深的折痕，怎么抚也抚不平'],how:['开头：从风把卷子吹起来、我下意识用书包压住写起，先写风再写人','主体：写书包、卷边和她那句怕压坏书包的话，再写她劝我先走','深化：写她让我先走，我第一次没有听她的话，才敢留下来','结尾：写那道折痕后来她用熨斗压平了才发下来，不写一句抱怨的话'],trap:'容易写成我懂事了的温情收尾；要用书包压卷子这个笨动作写出保护的意思',who:['班主任','我']});
BANK.push({id:'K166',t:'《我把她写错的板书记了整整一学期》',g:'rec',d:'teacher',c:'mis',e:'down',idea:'有一道题她板书写错了符号，我照着抄了整整一学期，直到那次单元测的卷子发下来我才发现。',mat:['黑板上那个负号，比平时写得靠下了一点点位置','我在草稿本上抄公式的时候，也写成那样，一个字没改','单元测卷子发下来，我错了整整两道大题，正好扣住两分','她看了我的卷子，什么也没有问，只在分数上划了一道'],how:['开头：从黑板上一枚位置偏低的负号写起，写我照抄的经过','主体：写草稿本、那两道错题、以及她那天的沉默不语，两处对照着写','深化：写她大概早就想改口，又怕是自己记错了公式，她也在犹豫','结尾：写后来抄公式我一定回头再问她一遍，抄完再核对一遍'],trap:'容易写成马虎带来的深刻教训，说教味太重；要用一枚负号在纸上的位置讲清整条链子',who:['班主任','我']});
BANK.push({id:'K167',t:'《我把她的教鞭当成话筒传了一圈》',g:'rec',d:'teacher',c:'mis',e:'curio',idea:'那根教鞭被我们当话筒传着玩，最后落到了后排同学的铅笔盒里，她整整找了一节课没找着。',mat:['教鞭是深棕色的木杆，顶端包着一圈黑色小橡胶','我们把它当话筒，一排人传过来又传过去，传了整整两排','橡胶头磕在铅笔盒上，盒盖都合不上了，卡在那儿了','她下课回来，问全班谁见过这样一根棍子，教室里一下子静了'],how:['开头：从那根教鞭被当成话筒传起来、从抢走第一下写起','主体：写橡胶头、铅笔盒和她下课回来问的那一句话，按时间顺序写','深化：写我们没有恶意，可丢了就是丢了，那节课谁也不敢抬头','结尾：写我从铅笔盒里把它交回去，她只说了句以后别玩了'],trap:'容易把这件事写成欢快的回忆，掩盖了后果；要保住她找不到东西时教室里的那份安静',who:['班主任','后排同学','我']});
BANK.push({id:'K168',t:'《我把她批注的错题本先还了回去》',g:'rec',d:'teacher',c:'mis',e:'protect',idea:'那本错题本上有她圈出的三处红圈，我怕她上课发现，先一步把它塞回了办公室那道门缝里。',mat:['错题本最后一页有三个红圈，圈得特别用力，纸都透了','我趁课间把本子塞进了办公室的门缝里面，门缝卡得很紧','她翻本子时发现少了一本，坐在那里想了很久很久','她没有问，是不是我还给她的这一本子，只是把本子合上了'],how:['开头：从错题本最后那三个红圈写起，写我放不下面子的心思','主体：写塞门缝、她翻本子时的停顿、以及她没有追问，写她停顿有多久','深化：写我以为还本是体面，其实是让她多担了一份心，把好心办成了坏事','结尾：写第二天我把本子当面交回，说清前因后果，不写一句道歉的话'],trap:'容易写成我为面子犯错的浅薄忏悔；要靠塞门缝这个动作和她那一下停顿来承载',who:['班主任','我']});
BANK.push({id:'K169',t:'《拔河那天她只喊了四句》',g:'rec',d:'teacher',c:'contest',e:'plain',idea:'拔河那天她没有喊整句的加油，只在每一队拉紧的间隙喊了四个字，我们后来都记着那四句。',mat:['拔河的绳子绷得笔直，队伍往前挪了小小的一寸距离','她站在边线外面，两只手一直插在口袋里，像在等结果','她喊的是稳住别松手，加起来总共四个字，喊一次停一次','有人手心磨破了，她递过来一小卷医用胶布，还撕了一段'],how:['开头：从拔河时绳子绷直、所有人往前挪一寸的画面写起','主体：写她插手的站姿、那四个字和递过来的胶布，连喊的时机也写','深化：写她懂什么时候该喊，什么时候喊了也完全没有用，她懂分寸','结尾：写我们赢了，她只说了句去洗手吧，把她的克制写出来'],trap:'容易写成热血沸腾的运动会流水账；要把她不喊加油、只喊稳住的判断写出来',who:['班主任','我']});
BANK.push({id:'K170',t:'《黑板报评比我没有交稿》',g:'rec',d:'teacher',c:'contest',e:'guilt',idea:'黑板报轮到我们组画，我答应的那部分一直没画完，评比前一天她没有替我把那块缺口兜起来。',mat:['黑板右上角留了一大片空白，等着我那块内容的位子','我用周末两天打游戏，只画了三个字上黑板，粉笔都短两根','她说版面可以调，让我先把内容交上来，语气很平常','我说来不及了，她就没有再追问下去，转身就去上课了'],how:['开头：从黑板右上角那片空白是我留下的、为什么留下写起','主体：写两个周末、三个人字和她说版面可以调那一句，按周末分开写','深化：写我以为她会替我补上，她选择了不补，这才是最疼的','结尾：写第二天我用报纸的边角补了块边框，很丑但交上去了'],trap:'容易写成拖延被批评的套路；要用那块空白和她说可以调却不补来写后果',who:['班主任','我']});
BANK.push({id:'K171',t:'《值日比谁先到教室就算赢》',g:'rec',d:'teacher',c:'contest',e:'insight',idea:'值日改成比谁先到教室，输了的人扫整条走廊，我们争了两个星期才发现她一直最早到那间教室。',mat:['黑板上写着今天值日的两个名字，谁先来谁就算赢','那天她六点四十就在教室里，灯已经全开好了，连书包都放下','我们几个踩着七点整到教室，结果全部都输了，站在门口不敢进','她只是坐在讲台改作业，头都没有抬一下，像早知道会输'],how:['开头：从黑板上那两条值日新规矩写起，说明谁先到谁就算赢','主体：写六点四十的灯、七点整到达和她头也没抬的样子','深化：写这个比赛是她随口定的，因为她根本没打算要赢我们','结尾：写现在值日表还贴在门后，我们谁也不再比了，只用一句话交代'],trap:'容易写成一件小事感悟人生；要用六点四十的灯和她没抬头这两个细节顶住结尾',who:['班主任','我']});
BANK.push({id:'K172',t:'《从办公室到教室那七分钟》',g:'rec',d:'teacher',c:'journey',e:'plain',idea:'从办公室到教室七分钟，她每天要走两趟，我开始数，数到第三个月才发现她总在最后一分钟踩铃进班。',mat:['办公室在四楼，我们的教学班在三楼的最东头那一间','她上楼的时候，手里多半拿着作业本，有时还夹着教案','铃响前一分钟，她出现在教室的门口站着，手里没有卷子','我们总听见走廊上那双布鞋走路的声音，越来越近了'],how:['开头：写我开始数她从办公室走到教室到底用了几分钟，从第一天数起','主体：写楼层、手里的红笔和门口最后那半分钟，按顺序写三处','深化：写那七分钟她也在赶路，和我们一样在赶，不是悠闲地来巡视','结尾：写现在铃响前我不再抬头，只把黑板擦干净摆好，等铃响再抬头'],trap:'容易写成对老师辛劳的赞歌；要用数分钟这个动作和门口那半分钟把日常写实',who:['班主任','我']});
BANK.push({id:'K173',t:'《她替我跑了三楼那一趟》',g:'rec',d:'teacher',c:'journey',e:'down',idea:'我忘带了我的练习册，她下课后跑上三楼替我拿，回来的时候铃已经响了，她把本子放在我桌上。',mat:['练习册在教室后柜最上层，我一上午没想起来带','下课她听我说没带，转身就往楼上跑过去，连水杯都没拿','铃响的时候她才回来，一只鞋带散了边，挂在门槛上','本子放到桌上时，还带着她手心的温度，像刚从外面回来'],how:['开头：从我到中午才发现没带练习册写起，写出我当时的慌张','主体：写她跑上楼、散掉的鞋带和放下本子的动作，按时间顺序写','深化：写她一句责备也没有，只是把本子放下就走开了，这一处不抒情','结尾：写那本练习册我后来一直放在书包最外面一层，怕再忘一次'],trap:'容易写成感动得想哭的煽情段落；用鞋带散开和本子的温度这类身体细节替代抒情',who:['班主任','我']});
BANK.push({id:'K174',t:'《她陪我把值日做完才回家》',g:'rec',d:'teacher',c:'journey',e:'protect',idea:'放学只剩我们两个在教室，她陪我扫完走廊才走，我才知道她那天本来是要出门去拿药的。',mat:['走廊的落叶扫成一堆，扫把柄在我手里打滑，叶子黏在橡胶上','她拎着桶跟在我后面，那个桶很沉很沉的，她换了两次手','她的手机响过一次，她看了一眼就按掉了，铃声都没响','扫完她说回去吧，晚了赶不上这趟公交车，只剩下一班'],how:['开头：从只剩我们两个扫走廊写起，先写落叶和打滑的扫把柄','主体：写她拎桶、手机响按掉和提醒我赶公交的那几句，三处分开写','深化：写我知道她那趟要出门，也知道现在没法去弥补它，只写我做得到的','结尾：写第二天早上，我把一瓶热牛奶放在她办公桌上，不解释为什么'],trap:'容易写成牺牲自我式的伟大叙事，让人难受；要用桶很沉和按掉手机这两个动作点到为止',who:['班主任','我']});
BANK.push({id:'K175',t:'《她藏起来的第三张请假条》',g:'rec',d:'teacher',c:'secret',e:'down',idea:'办公室抽屉里有三张一样的请假条，前两张是她替我交的，第三张上面才是她自己真正的名字。',mat:['抽屉里有三张同样的请假条，字迹完全一样，连折痕都一样','前两张的日期是我的，理由都写着家中有事，没有一句抱怨','第三张的名字换成了她自己，日期在上个月里，就在抽屉最里面','纸角折得很整齐，看得出有人经常在整理它们，天天在理'],how:['开头：从抽屉里三张一样的请假条写起，交代我是怎么发现的','主体：写前两张是我的理由，第三张换成了她自己的名字，两张对照着写','深化：写她替我瞒过两次，轮到自己却谁都没说一声话，轮到她就不说','结尾：写那第三张她后来补了材料，又夹回原来的位置，仍旧放回原来的地方'],trap:'容易写成感人的师生情，只顾替她心疼；要用三张纸的对照和她不提这层来处理',who:['班主任','我']});
BANK.push({id:'K176',t:'《她替我记着的三件小事》',g:'rec',d:'teacher',c:'secret',e:'warm',idea:'她抽屉里有张便签，上面写着我怕冷、我不吃香菜、我妈中午来接我，走的时候她没让我看见。',mat:['便签上是我自己都不记得说过的三句普通话，写得歪歪扭扭','字写得很小，落在一张旧包装纸的背面，字小得看不清','最下面画了一道横线，像是提醒她自己别忘了，别再忘','后来她把这张纸夹在教案的中间那一页上面，压得平平整整'],how:['开头：从便签上那三句我自己都忘了的话写起，先把这三句抄出来','主体：写包装纸背面、小字和最下面那道提醒的横线，三处细节分开写','深化：写她记得这些不是职责，而是习惯，习惯比关心更重更长久','结尾：写毕业前我想再看一眼那张纸，没有敢开口，结尾只留一句话'],trap:'容易写成细节堆积的抒情，好读但没有结构；要用三句话的具体内容承担全部意思',who:['班主任','我']});
BANK.push({id:'K177',t:'《那句讲慢一点她说了三年》',g:'scene',d:'teacher',c:'word',e:'warm',idea:'从第一节课到最后一节课，她讲同一个知识点都会补一句讲慢一点，这四个字我听了整整三年。',mat:['她讲函数先在黑板上画图，再回头重复讲一遍全题','讲慢一点，这四个字她说得比公式还要熟，说过几百遍','最后一排有人小声问她，她转身又讲一遍，还是再讲一遍','我坐在最后一排，把这四个字抄在了错题本的封面一角'],how:['开头：从她讲函数时先画图、再回头补那四个字写起，把重复写够','主体：写她转身、最后一排再问和封面上的那句抄写，三处对照着写','深化：写她知道我们中间有人没跟上，所以每次都肯回头再讲一次','结尾：写现在没人再说这句话，可我做题慢时还会想起它那四个字'],trap:'容易写成感恩老师的通用抒发；要靠她转身再讲一次这个重复动作说明理由',who:['班主任','我']});
BANK.push({id:'K178',t:'《课间十分钟，后门那半块走廊》',g:'scene',d:'teacher',c:'crowd',e:'plain',idea:'课间十分钟全班都涌到前门那条走廊，后门这半块没人去，我们就站在那儿把一节课的话说完。',mat:['铃一响，四十几个人一起涌向前门那条走廊，像出了水的鱼','后门这半块地方，只剩五六个我们这样的人，我们占了半条','有人靠着栏杆站着，有人蹲在墙角那里喝水，水壶拿在手里','上课铃响我们最后几个跑回去，头发都跑乱了才停下'],how:['开头：从课间铃一响、全班涌向前门走廊的那个画面写起','主体：写后门那半块地、靠着栏杆和蹲着喝水的那几个人','深化：写那里不是没人想去，是人多到只能挤在一起，把空间关系说清楚','结尾：写后来我们管那里叫后门五分钟，成了班里的说法沿用至今'],trap:'容易写成课间嬉闹的流水账；要靠后门这半块地默认属于我们的空间感来写',who:['班主任','后排同学','我']});
BANK.push({id:'K179',t:'《她把讲台上的钟换了方向》',g:'scene',d:'teacher',c:'change',e:'plain',idea:'钟原本挂在教室门边，她把它摘下来挂到黑板正上方，从此我们抬头的次数都不一样了，每节课抬头更多。',mat:['钟原来挂在门边，我们看它得先扭一下头，脖子先酸起来','她踩着椅子，用图钉把钟挂到黑板上方，钉子敲歪了两颗','她调了三天，最后把钟面对准教室正中间，秒针正对着我们','她说这样你们不用扭头也能看到几点几分，不用问人也知道'],how:['开头：从钟原来挂在门边、我们要扭头才能看到写起，先写脖子怎么酸','主体：写踩椅子、按图钉和调三天对准中间这三处，按动手顺序写','深化：写她改的不是那只钟，是我们抬头的方向和习惯，我们都在变','结尾：写那个钟现在还挂在黑板上方，秒针走得很响，不抒情只写声音'],trap:'容易写成小事寓意的套话；要用椅子、图钉和调三天对准这三个动作讲清她的想法',who:['班主任','我']});
BANK.push({id:'K180',t:'《懂了吗这三个字有三种语气》',g:'scene',d:'teacher',c:'word',e:'curio',idea:'她问懂了吗，这三个字听得出三种意思，第三种最凶，而她从没在我们面前用过那一种语气。',mat:['讲完看我们点头，她说懂了吗，那是第一种，声音是松的','有同学答不上来，她说懂了吗，那是第二种，声音是平的','有次她敲一下桌子说懂了吗，没人敢喘气，教室里一下静了','第三种只出现过一次，之后再没有出现过，是留给抄作业的人的'],how:['开头：从她讲完看我们点头的那句懂了吗写起，先写第一种语气','主体：写三种场合、三种语气，一件一件分开来说，三种分开不混','深化：写第三种留给的是抄作业那一类事，她心里有分寸，分得很清','结尾：写现在没人敢在她面前装懂，我也不敢再装，只写现在这一句'],trap:'容易写成对老师语气的文学化解读，太抽象；要用三种场合把语气差异钉在具体的事上',who:['班主任','我']});
BANK.push({id:'K181',t:'《如果学校永远不换那套旧桌椅》',g:'imagine',d:'teacher',c:'change',e:'admire',idea:'如果教室里的桌椅永远不换，桌面上那些刻痕就会一直在，包括她手把手教我写过的那几个字。',mat:['桌面右下角有一道刻痕，写着一个歪歪扭扭的小字','另一边是我自己刻的，被同学笑了整整一个月才好','换新桌椅那天，她把旧桌一张张抬到走廊上，肩膀都酸了','她在自己的新桌上写下了换字两个字的日期，写在桌子正中间'],how:['开头：从桌面上那两道刻痕写起，一道是她的，一道是我自己刻的','主体：写换桌那天她一张张抬旧桌、又在新桌上写字，按换桌那天的顺序写','深化：写她记得自己桌面上写过什么，教室对她也是一段旧的记忆','结尾：写我至今不知道，她那天在新桌上写的是哪几个字，别猜'],trap:'容易靠想象抒情写虚；想象只留一层，其余全用刻痕和抬桌子这些实物撑住',who:['班主任','我']});
BANK.push({id:'K182',t:'《如果她退休那天由我来点名》',g:'imagine',d:'teacher',c:'promise',e:'admire',idea:'如果有一天她不再站在门口，我大概会照她的样子先点一遍名，再安安静静地等十秒才开口。',mat:['早读她先站在门口，点完名才走进教室里，人在门框外面','有个同学迟到了半分钟，她就在那儿等十秒，一步也没有动','那十秒里全班没人说话，也没有人敢抬头，笔尖都没敢碰纸','她的声音压得很低，一点也不像在批评人，倒更像是提醒'],how:['开头：从她每天先点一遍名、才走进教室这个固定动作写起','主体：写迟到的那半分钟、等待的十秒和压低的声音，三处对照着写','深化：写我模仿的不是她的声音，而是她那十秒的耐心，模仿落在动作上','结尾：写现在没有人这样等过我，连老师也没有这样等，不比较只写现在'],trap:'容易写成想象自己当老师的空想，落点全在想象那一层；想象只留在等十秒这一个动作上',who:['班主任','我']});
BANK.push({id:'K183',t:'《如果那本错题本能自己说话》',g:'imagine',d:'teacher',c:'object',e:'curio',idea:'如果错题本能自己说话，我想先听它说，为同一道题它被那支红笔圈过四次，一次也没有落下过。',mat:['错题本第一道题被红笔圈了四次，圈越来越小，一次比一次小','最后一次圈旁边没有批语，只写了会了两个字，收笔很轻','纸被写透了，背面能摸出凸起来的一道硬痕，手指能摸出来','我翻到后面，是几页完全空白的纸，白得晃眼，一张也没写'],how:['开头：从被红笔圈过四次的同一道题写起，先说那道题是什么题','主体：写圈越来越小、只写会了和被写透的那张纸背面，四次圈分开写','深化：写她圈四次不是没耐心，是在换着方式让我记住，她换了方法','结尾：写最后那几页空白，是因为我已经不用她圈了，落在空白上'],trap:'容易写成对老师耐心的感动总结；要用四次圈子和空白页的纸背凸起去证明她放弃了反复',who:['班主任','我']});
BANK.push({id:'K184',t:'《她把自己的手机调成静音放在讲台上》',g:'argue',d:'teacher',c:'change',e:'admire',idea:'她坚持上课时把手机放在讲台角落并调成静音，我们班从第一节课起就没人敢在底下偷偷玩。',mat:['她把手机屏幕朝下放在讲台角落，那个位置是固定的','第一节课就有人问怎么没收了，她说先放我这，放我这就行','两个月以后，班里就没人再带手机进教室了，连课代表也没有','她的手机震过一次，屏幕亮着，没有人去看它，响了三下'],how:['开头：从她把手机屏幕朝下放在讲台角落这个动作写起，先写她的动作','主体：写我们第一次问、两个月后的变化和亮着的屏幕，按时间推移写','深化：写她自己先守规矩最难，我们服的不是那台手机，我们服的是这一点','结尾：写毕业前有人问那手机后来呢，她说还在用呢，用她一句话收住'],trap:'容易写成讨论该不该没收手机的大道理；要靠屏幕朝下和亮着没人看这两个细节说话',who:['班主任','我']});
BANK.push({id:'K185',t:'《值日该不该少排一个人》',g:'argue',d:'teacher',c:'crowd',e:'down',idea:'我们提了三次少排一个人，全班都能少排，只有她一直不松口，说值日也是学习的一部分。',mat:['提议贴在黑板右上角，签名一共有三十九个人，占了大半个黑板','第一次表决，我们输了七票给老师的那个名字，只差三票','第二次她把值日表贴得比原来更靠前一点，眼睛先扫一遍','第三次没人再签名，她把那张提议擦掉了，只说了句先上课'],how:['开头：从黑板右上角那张提议和三十九个签名写起，签名数字先写出来','主体：写输掉七票、她把值日表往前贴和没人再签名，三次分开写','深化：写她擦掉提议时我们才发现，我们争的只是自己不用值日而已','结尾：写值日表现在还贴着，只是提议那一栏永远空着，结尾不议论'],trap:'容易写成班里表决的热闹情节，输在没写清各自的理由；要用签名数和贴表位置的变化写分歧',who:['班主任','我']});
BANK.push({id:'K186',t:'《毕业留言簿该不该当面交》',g:'argue',d:'teacher',c:'secret',e:'insight',idea:'她让我们把留言簿当面交上去，我写了三页，最后一页空着，因为想不出哪一句是我敢写的。',mat:['留言簿统一发下来，封面印着班级和当天的日期那行字','我写了三页，最后一页一个字也没有写上去，空着那一张','交上去的时候教室很吵，她一页一页地翻，翻了很久','翻到空的那一页，她把本子合上了，还夹了一张纸条在里面'],how:['开头：从统一发下来的留言簿和封面上印着的日期写起，先写封面日期','主体：写三页内容、空着的第四页和她合上本子的动作，三页各举一句','深化：写我们敢在背后说她，从不敢当面写一句真心话，差的是当面这一句','结尾：写毕业照那天，我仍然没有说出那一句，就让这句话空着'],trap:'容易写成煽情的毕业文，只堆遗憾；要用那页空白和她合上本子的动作收住，别写哭',who:['班主任','我']});
BANK.push({id:'K187',t:'《值日表该不该让老师也排上》',g:'argue',d:'teacher',c:'contest',e:'protect',idea:'我们在值日表上加了老师那一栏，她用红笔划掉了两次，第三次自己把名字写了上去，没人逼她。',mat:['值日表最下面空着一行，我们写上了她的名字，写得很工整','她用红笔划掉，说老师不参加这个活动，划得很干脆','第二次我们又写上去，她拿红笔再划一次，纸都戳破了','第三次她没有划，还把顺序调到最后一个值日，把名字留着'],how:['开头：从值日表最下面我们擅自加上的那个名字写起，先写我们擅自加名','主体：写两次被红笔划掉、第三次她自己写了上去，三次对照着写','深化：写她划的不是名字，是怕我们多想两天才敢做，她给我们留时间','结尾：写现在那张表换了新纸，她名字还在最后一行，用位置说话'],trap:'容易写成班级民主的热闹账；要用红笔划掉两次这个重复动作写出她的分寸',who:['班主任','我']});
BANK.push({id:'K188',t:'《我替她做了第一周的错题安排》',g:'apply',d:'teacher',c:'first',e:'insight',idea:'我当上错题记录员的第一周，做出一张表贴到墙上，后来才发现这张表比我这个人更有用。',mat:['第一张表是我用格子纸画的，横线竖都没对齐，贴得很歪','她看完只改了一个字，把必做改成了建议，别的字没动','我把必做加粗了三天，后来又悄悄改回去，还是觉得别扭','第二周交上来的卷子，比第一周多了一叠半，摞起来有半指高'],how:['开头：从我用格子纸画的第一张错题安排表写起，先写格子纸歪着','主体：写她只改一个字、我加粗又改回去和卷子变多，三处对照着写','深化：写她不插手比插手更省事，方法留给我自己慢慢长，她退到一边去','结尾：写那张表贴在教室后墙，纸边已经卷起来，只写纸边卷起来这点'],trap:'容易写成我主动为班级服务的表彰稿；要靠她只改一个字和我改回去这两个细节',who:['班主任','课代表','我']});
BANK.push({id:'K189',t:'《我给运动会写的那句加油》',g:'apply',d:'teacher',c:'crowd',e:'admire',idea:'全班二十三个人一起写的加油稿，最后只被广播念了一句，而那一句是她站在最前面喊出来的。',mat:['稿子是我们几个人凑出来的，词写得特别土气，还改了三次','广播里先念了三句队名，中间停了两秒，才轮到念那加油稿','二十三个人的名字，没有一个被念到过，连班长也没有','最后那句是扯着嗓子喊完的，一直喊到底了，喊到破音为止'],how:['开头：从稿子凑得特别土写起，写大家抢着出主意那阵子里的样子','主体：写广播先念队名、只念一句稿子和没人被念名字，按广播的顺序写','深化：写二十三个人第一次一起喊同一句，队伍就齐了，把落差写出来','结尾：写那句加油稿现在夹在教室角落的旧报纸里，夹得很平很稳'],trap:'容易写成班集体的温情场面，缺少过程；要用只念一句和名字没被念的落差写出那一下用力',who:['班主任','我']});
BANK.push({id:'K190',t:'《我给她写的评语，其实没说到点子上》',g:'apply',d:'teacher',c:'word',e:'guilt',idea:'学期评语我改了三天才定稿，她看完只回了一句知道了，可那句话明显不是说给我听的那个语气。',mat:['评语表在办公室，她一叠一叠翻到我那一张纸，翻了两分钟','我改了三天才定稿，一共不到四十个字，写了划掉三遍','她说知道了，语气和平常批卷一模一样，平常得像在念分数','她把我那张表单独压在讲台的玻璃下面，压得很平整'],how:['开头：写我为了那不到四十个字改了三天的稿子，先写改了几遍才定稿','主体：写她翻表、知道了三个字和压在玻璃下面的表，三个动作分开写','深化：写她压住的是我那句没说到点子上的评语，我猜她已经看出来了','结尾：写那句话我至今不敢问她，看出没看出来，留在没问出口那里'],trap:'容易写成我被敷衍后的失落，缺少前因；要用改三天的字数和她压住那张表的细节',who:['班主任','我']});
BANK.push({id:'K191',t:'《被我顺走的那半盒彩色粉笔》',g:'rec',d:'friend',c:'object',e:'guilt',idea:'我把办公室木架上那半盒彩色粉笔塞进书包，理由是美术课要用，后来才知道那是同桌攒了两个星期零花钱买的，我用一整节课不敢抬头。',mat:['办公室木架上挂着半盒粉笔，红黄蓝各剩几根','同桌说这盒是她用攒下的零花钱买的，别弄断','我在书包侧袋摸到它，手指头粘了一层红颜料','美术课下课我把粉笔按颜色排好，放回她的笔袋'],how:['开头：写我伸手去拿那半盒粉笔，停在「零花钱」上制造疑问','主体：补当天美术课的经过，把手指沾上颜料的细节写足','深化：弄丢的不是粉笔，是我把别人的心意当成公用东西','结尾：收在粉笔按颜色排好放回笔袋，她什么也没问出口'],trap:'别让同桌当场拆穿我，也别写成我哭着道歉，真实版本是两个人心知肚明却都装没发生。',who:['同桌','美术老师','值班老师']});
BANK.push({id:'K192',t:'《教室后排那排没人取的伞》',g:'rec',d:'friend',c:'object',e:'curio',idea:'靠窗挂钩上常年多出两三把没人认领的伞，我顺手把紫伞带回座位，撑开晾了一晚，才知道那伞的主人早就不在了。',mat:['挂钩上三把伞的伞柄都磨白了，没人说过是谁的','我把紫伞塞进桌肚，撑在走廊晾一晚，伞骨有点歪','体育课下雨，同桌举伞在楼梯口等，没提旧伞','后来在毕业照背面看到伞主人的名字，才对上'],how:['开头：先写挂钩上多出来的那两三把伞，把疑问留给读者','主体：写我撑伞晾水、和她一起在楼梯口等伞的具体画面','深化：物件比人记得久，伞留着雨就还在，不必解释主人','结尾：收在毕业照翻到背面那个名字，伞终于有人来认领'],trap:'别给伞主人安上生病或意外那套煽情桥段，越可怜越假，留白反而更真。',who:['同桌','值日生','伞的主人']});
BANK.push({id:'K193',t:'《换座位时那三秒》',g:'rec',d:'friend',c:'moment',e:'warm',idea:'换座位那天全班安静了三秒，谁都没先开口，我抱起书走过七张桌子，那三秒比整堂课都长。',mat:['老师说按成绩排座位，教室里的翻书声突然全停了','同桌把桌肚里的东西一件件码齐，书脊朝同一个方向','我走过第七张桌子时，粉笔灰在阳光里飘了一下','坐下后她把橡皮推过来，什么话也没有说出口'],how:['开头：把教室安静下来的那三秒放在第一句，先造出停顿感','主体：只写搬书、挪椅、跨过七张桌子的动作，一句抒情都不要','深化：真正难的不是换座位，是开口说一句我们还做同桌吗','结尾：橡皮被推过来那一下收尾，让一个动作代替回答的话'],trap:'容易写成哭着挽留或老师强行安排，用沉默、搬书速度、橡皮来写更贴近初二。',who:['同桌','班主任','后桌']});
BANK.push({id:'K194',t:'《同桌把靠窗的冷位子换给了我》',g:'rec',d:'friend',c:'moment',e:'protect',idea:'她把靠窗的冷位子换给了刚做完手术回到教室的我，自己去坐走廊那侧，后来她说冷位子也没那么难熬，我记着走廊的风比窗外的喇叭还响。',mat:['换座表上她把自己的名字划了，在我的名字旁边画个框','走廊那侧下午有穿堂风，稿纸的一角一直在翻','我递给她暖宝宝，她塞进校服口袋说留着明天用','后来她值日锁门，走廊的风把门吹得撞在墙上'],how:['开头：先写她在名字上划的那一笔，停顿的地方要写出来','主体：写穿堂风、稿纸、暖宝宝这些具体交换，不夸她伟大','深化：她把冷让给我，等于把难受拆成两份自己先拿一份','结尾：收在锁门那晚风声撞墙的那一刻，我终于说出了一句谢谢'],trap:'别写成她主动要求照顾你，她只是顺手换了一下名字，别拔高成圣母。',who:['同桌','班主任','值日班长']});
BANK.push({id:'K195',t:'《说好一起锁门，我先进了食堂》',g:'rec',d:'friend',c:'promise',e:'warm',idea:'我们说好值日最后锁门一起走，那天我惦记着食堂最后一份红烧肉先跑了，回来时门边的灯还替我们亮着。',mat:['放学铃响前同桌把钥匙塞我手里，说她扫完北边那一列','我跑到食堂刷卡时只剩两份红烧肉，端着往回走','回教室门锁着，钥匙在我口袋，窗户里透出灯光','她说没关系，明天也一样，下次轮到你等我五分钟'],how:['开头：先写放学前那句约定和塞钥匙的动作，语气要放轻','主体：写我一路小跑、端着饭、站在那扇锁着的门前的那几秒','深化：她一个人扫完两个区，灯留给我，这件事我没说谢','结尾：收在「下次换我等她」，把亏欠转成一个具体的下次'],trap:'别让她一句抱怨都不发，她越不生气，你越要在细节里显出内疚和躲闪。',who:['同桌','值日班长','食堂阿姨']});
BANK.push({id:'K196',t:'《第一次被排到最后一组值日》',g:'rec',d:'friend',c:'first',e:'guilt',idea:'第一次轮到我拿钥匙拖地，别的组早走了，我把整层楼拖完才发现拖把还是我上一组留的那把。',mat:['值日表按学号排，我排在最后，教室里只剩我和她','拖把毛已经散开，木柄上还留着前一组的粉笔字','我把四个班的地面拖完，地漏那里堵着一团头发','锁门的时候她回头说了一句，你今天怎么比我妈还啰嗦'],how:['开头：交代排到最后一组这个事实，语气要认命不要抱怨','主体：细写拖把散毛、地面返潮、头发缠住拖布的全过程','深化：不是我勤快，是我不想承认那地是被别人顺带做完的','结尾：收在她那句玩笑话，我才发现钥匙在我手里攥出了印'],trap:'容易写成我主动留下帮大家，真实的是我不敢早走才硬撑着拖完，别美化。',who:['同桌','值日班长','教导主任']});
BANK.push({id:'K197',t:'《同桌第一次把作文念给全班听》',g:'rec',d:'friend',c:'first',e:'insight',idea:'她念自己那篇作文，念到第三段声音开始抖，念完后全班安静，我带头举了手，结果她躲到操场哭了半节体育课。',mat:['她把稿子折了三折，塞在校服口袋边，纸角是软的','念到「我奶奶的灶台」那句，喉咙卡了一下，全班听得见','念完全班都安静下来，窗外有人在操场上吹哨子','我第一个举起手，她低头擦眼睛，小声说别举了'],how:['开头：先写那份被折了三折的稿子，让紧张有实物可以抓住','主体：还原她念到第三段时的声音、停顿、卡住的那一下','深化：全班安静不是嘲笑，是不知道怎么回应，也包括我自己','结尾：收在她那句别举了，我的手还举在半空，慢慢才放下'],trap:'别把她的哭写成当场崩溃痛哭，真实的是体育课躲着人偷偷擦眼睛。',who:['同桌','语文老师','后桌']});
BANK.push({id:'K198',t:'《糖纸不是同桌撕的》',g:'rec',d:'friend',c:'mis',e:'guilt',idea:'桌肚里出现一张折成方块的糖纸，我认定是同桌的，连着两天不跟她说话，第三天值日我看见隔壁班男生在门口练投篮。',mat:['糖纸被折成小方块，压在桌角，展开有一道折痕','我两次把脸转向窗户，她伸过来的手停在半空','第三天值日我看见隔壁班男生在门口一次一次投球','她只说了一句，你这两天怎么话这么少，问完就低头'],how:['开头：先写那张折成方块的糖纸，让疑心从实物里长出来','主体：写我冷着脸的那两天，写她递笔过来又被我推了回去','深化：错不在判断，在我明明可以问一句却选择了一直不问','结尾：收在她那句「你话好少」，比被她当面骂一顿还难受'],trap:'别让真相来得太轻巧，重点应放在我错怪时的别扭和不敢认错的沉默上。',who:['同桌','隔壁班男生','后桌']});
BANK.push({id:'K199',t:'《早读我没等到同桌》',g:'rec',d:'friend',c:'mis',e:'down',idea:'那天我提前十分钟到校，同桌的位子一直空着，书包挂在椅背上，我一节早读都在想她是不是换了座位没告诉我。',mat:['七点十分她的书包挂在椅背上，人却始终没有来','我把课本翻到同一页，十五分钟没往下读一行','第二节她推门进来，袖口湿了一片，说伞坏了','我那节数学笔记断了两行，她笑我连这也没抄全'],how:['开头：写空着的椅背和挂在上面的书包，不要急着下结论','主体：写我等着、猜着、又不好意思开口问的那段别扭劲','深化：真正难受的不是她没来，是我在意这件事却装作无所谓','结尾：收在她坐下第一句「笔借我」，我假装嫌弃地递过去'],trap:'别把这事写成她转学或家里出事，她只是伞坏了，在地铁站等了四十分钟。',who:['同桌','课代表','早读值班老师']});
BANK.push({id:'K200',t:'《拔河绳上我先松了手》',g:'rec',d:'friend',c:'contest',e:'guilt',idea:'拔河最后一局，我脚下的地面在往后滑，我松了手，全班跟着倒了一片，体育委员没怪我。',mat:['绳子中段被汗浸出一段深色，掌心磨得发烫发麻','我站在第三个，鞋底在瓷砖上蹭出吱的一声响','一排人齐刷刷往后坐倒，喊加油的声音断在半空','体育委员一句话没说，只把绳子重新缠回手臂'],how:['开头：从脚下打滑的那一秒切入，把现场的声音压到最低','主体：写我犹豫的那半秒，和整队倒下时那串连锁的反应','深化：松手不是背叛，是我知道再撑下去要伤人，可我没敢说','结尾：收在缠绳子的动作，队伍重来，我站回第三个位置'],trap:'容易写成我因为愧疚主动认罚，真实里我一句解释都没有，先把绳缠好。',who:['体育委员','后桌','体育老师']});
BANK.push({id:'K201',t:'《黑板报评比我们班得了倒数》',g:'rec',d:'friend',c:'contest',e:'plain',idea:'评比结果贴出来那天没有人抱怨，同桌把奖状撕成小条分给画画的几个同学，末等奖也是奖。',mat:['名单贴在教室后门，最后一行是我们班，编号十七','奖状只有薄薄一张，粉笔灰蹭在鼓励两个字上','同桌把它撕成六份，写名字那位写反涂了两遍','值日时她把一条贴在扫帚间门上，说给下一个人看'],how:['开头：先写名单最后一行和那个编号，事实说完再说情绪','主体：写撕奖状、分奖状、写反名字这些小动作，不作评价','深化：倒数不等于白费，值日那几个晚上才换来这块黑板','结尾：收在扫帚间门上那条纸，路过的人抬头就能看见它'],trap:'别把结果写成虽有败犹荣的套话，用撕奖状和分奖状的动作代替感想。',who:['同桌','宣传委员','值日生']});
BANK.push({id:'K202',t:'《我们偏要走那条河堤》',g:'rec',d:'friend',c:'journey',e:'curio',idea:'从学校后门到地铁站有两条路，我们走那条多绕七分钟的河堤，只因为那边有卖糖炒栗子的推车。',mat:['河堤栏杆上有人用粉笔写了一排正字，我数到第三十一','推车师傅的炒勺有节奏地敲着铁锅，香味先到','我们把最后两颗栗子分着吃，纸袋攥成一团塞进口袋','走到第二个红绿灯的时候她说，明天这一袋换你来买'],how:['开头：先交代从学校后门到地铁口有两条路，答案先别给','主体：写栏杆正字、炒栗子的节奏、纸袋这些路上的细节','深化：绕远的七分钟不是为了吃，是把一天的课留给走路','结尾：收在「明天换你买」，把明天当成一份还没兑现的约定'],trap:'别把糖炒栗子写成廉价怀旧道具，香味、敲锅声、纸袋的油腻要具体。',who:['同桌','推车师傅','值日生']});
BANK.push({id:'K203',t:'《春游大巴上我欠的那瓶水》',g:'rec',d:'friend',c:'journey',e:'warm',idea:'大巴开出加油站，我答应给她带一瓶水，回来时只剩空瓶，那天我一路都在想那句给我带瓶水。',mat:['车上空调坏了半边，后排有人脱外套盖在腿上','她说水不用太凉，常温就行，语气比我想得还随便','大巴在服务区停了八分钟，我抱回两瓶，瓶身都是热的','她拧开喝了一口，把空瓶塞进我手里，说留着给我'],how:['开头：先写服务区停的八分钟，和那两瓶太热的水这个障碍','主体：写我怎么挑、怎么没挑到、怎么抱着两瓶热的走回去','深化：她越不介意，我越不敢说自己忘了，只能一路找补','结尾：收在她把空瓶塞回我手里，水在瓶壁里晃来晃去地响'],trap:'别把我写成自责到哭，真实表现是反复擦瓶身、把座位让给她，一路上不说话。',who:['同桌','大巴司机','随队老师']});
BANK.push({id:'K204',t:'《没有署名的错题本》',g:'rec',d:'friend',c:'secret',e:'admire',idea:'我发现同桌给班里每个人抄了错题本，抄得很细，我的本子夹层里多了一张，署名那栏是空的。',mat:['本子用挂历纸背面抄的，格子歪，边上还画着小方块','她的错题字写得很小很小，像是怕多占别人地方','我的那张夹在英语书里，题目是我上周才错的','最后一页上写着日期，一直记到上个月十四号'],how:['开头：从我翻开英语书、掉出那张纸写起，制造一点惊讶','主体：写格子歪、字小、夹层这些细节，让她这个人先立住','深化：署名为空不是怕麻烦，是她觉得这事不值得被感谢','结尾：收在最后一页那个日期上，说明这件事一直在发生'],trap:'别用颁奖或表扬结尾，让秘密保持没有名字的状态，别让全班都知道。',who:['同桌','课代表','语文老师']});
BANK.push({id:'K205',t:'《群里那条撤回了两分钟的消息》',g:'rec',d:'friend',c:'secret',e:'protect',idea:'班级群里同桌撤回了一条说我坏话的消息，两分钟后全班安静，第三天我才知道那是她自己打的字。',mat:['撤回提示只闪两秒，我截图又发现图里什么都没有','那天下午群里改成只发通知，没人再提这件事','同桌照常收作业、擦黑板，只是字写得比平时慢','我问她那天到底发了什么，她说没什么，我信了'],how:['开头：先写那条两秒的撤回提示，和截不到内容的空白图','主体：写班级群从吵闹到只发通知，那两天里每个人的沉默','深化：她先说了我的坏话再替我圆回去，我选择了不知道这件事','结尾：收在她说没什么那句话，一周后我才发现群昵称被改过'],trap:'别把撤回写成她替我打圆场的英雄行为，她只是不想让群里吵起来。',who:['同桌','班长','群里的同学']});
BANK.push({id:'K206',t:'《「真的假的」传遍了整个班》',g:'rec',d:'friend',c:'word',e:'warm',idea:'同桌那句「真的假的」先是逗我，后来变成全班都会的口头禅，连数学老师答题也学了一句。',mat:['她说这句时手里总在转笔，笔掉过两次都被她接住','早读前排四个人同时说，音调一模一样像录音','课代表统计过一周说了十一次，全班的人也都记得','数学老师在黑板上写完答案也接了一句，底下笑成一片'],how:['开头：先把这四个字单独写出来，让它在第一段里稳稳站住','主体：写转笔、传染、课代表统计这些具体传播的样子子','深化：语言传得快是因为大家需要一个轻松的说法去挡紧张','结尾：收在老师那句和底下的笑声，口头禅活成班里的东西'],trap:'别写成单纯搞笑段子，要写出它在紧张的时候被人拿出来用的样子。',who:['同桌','数学老师','课代表']});
BANK.push({id:'K207',t:'《他说「随便」，我就不随便了》',g:'rec',d:'friend',c:'word',e:'insight',idea:'同桌一学期说过十几次随便，我起初以为他敷衍，后来才发现那是他不想让人失望的办法。',mat:['点菜说随便，问他要不要下雨带伞也说随便，抽屉里却备着两把','我问他到底要什么，他停两秒说都行，眼睛看着桌面','有一次他真的随便了，是把值日排班让给了别人','那天我第一次替他做主，点了那杯加冰的柠檬汽水'],how:['开头：用一串随口就来的随便开场，先让读者以为那是敷衍','主体：写备两把伞、停两秒、眼神躲开桌面这些反证的细节','深化：随便不是没主意，是把选择权交出去就不用担责任','结尾：收在我替他点了那杯加冰，他愣了两秒钟才点头说好'],trap:'别把随便解读成高冷或者心理问题，理由越简单越可信，别上理论。',who:['同桌','值日班长','点菜的朋友']});
BANK.push({id:'K208',t:'《换了座位，我好像换了个班》',g:'rec',d:'friend',c:'crowd',e:'down',idea:'座位往第三排一挪，课间围过来的人就少了一半，我开始怀疑他们喜欢的到底是同桌还是座位。',mat:['第一天没人叫我借笔，第二天有人问我借水，第三天彻底没有了','我主动去后排找人，人家说在讨论数学题，话题接不上','放学时她还是照旧等我，只是要穿过整间教室','走过那三分钟的空走廊，比一整个星期还要漫长'],how:['开头：从借笔的人不见了这种小变化切进去，别急着抒情','主体：写三个递进的失联，和一次主动搭话被生硬挡回来','深化：人缘跟着座位走，那之前的好是不是真的，我很怕知道答案','结尾：收在她穿过整间教室、来我桌边叫住我的那三分钟'],trap:'别写成全班孤立我的惨状，用借笔借水这种小请求写失落更接近真实。',who:['同桌','后排男生','课代表']});
BANK.push({id:'K209',t:'《课间那圈人中间的同桌》',g:'rec',d:'friend',c:'crowd',e:'admire',idea:'每次课间她桌边都围一圈人，问题从数学到游戏到食堂菜单，她答得比我们老师还快，人却一直不抬头。',mat:['围过去的人手里都攥着本子或作业本，她一支笔同时在两张纸上写','有人问昨天那题的另一种解法，她翻到本子中间就找到了','后排的男生从不来问，但总在人流散开时递给她一瓶水','她说其实别人一问我就烦，只是他们先不好意思'],how:['开头：先画出那个圈，再写圈里的人一个一个往她跟前凑','主体：写同时写两张纸、翻本子找解法这些本事上的细节','深化：她不是喜欢被围着，她只是受不了别人开口时为难的样子','结尾：收在她那句解释，语气要轻，别把她写成社交达人'],trap:'别写成她高冷地享受被崇拜，要写出她对被这么围着时那种无奈和疲倦。',who:['同桌','后排男生','课代表']});
BANK.push({id:'K210',t:'《值日表上我的名字换了一次》',g:'rec',d:'friend',c:'change',e:'insight',idea:'开学值日表贴出来，我那格从值日换成了检查，位置没变，可我一下午都在琢磨这两个字。',mat:['表格是手抄的A4纸，贴歪了，四个角用透明胶重新粘过','我的名字后面多了两个字，字迹是班主任的蓝色','检查要等全组走完才能锁门，比值日多站二十分钟','我提前十分钟到，站在门口看他们一个一个签完'],how:['开头：先写换位那两个字和老师的笔迹，变化落在细节里','主体：写提前十分钟到、站在门口、等最后一个签完的过程','深化：升上去不等于更轻松，多出来的时间是我自己选的','结尾：收在锁门那一刻，名单上我的名字被划到最后一格'],trap:'别把换岗写成被赏识的爽文，重点要写那二十分钟怎么打发和自己怎么想。',who:['班主任','同桌','值日班长']});
BANK.push({id:'K211',t:'《扫帚间里那排只剩三根毛的扫帚》',g:'scene',d:'friend',c:'object',e:'curio',idea:'扫帚间挂着十几把扫帚，只有一把还剩三根毛，我一直怀疑那把是谁留着的，也一直没问。',mat:['扫帚间在楼梯转角，没装灯，开门要用肩膀顶','竹柄上缠着一圈红胶带，像是被谁系上去的记号','那把只剩三根毛的挂在最里面，位置比别的低','从门缝里能看见墙上用粉笔写着的明天大扫除'],how:['开头：用推不开的门和一股霉味，先把人带进扫帚间那场景','主体：写十几把扫帚的排列，和那把只剩三根毛的特别位置','深化：留着不扔是有原因的，我决定不打听，这比追问真实','结尾：收在扫帚间的门重新关上，锁扣咔地响了一声就停了'],trap:'场景类容易写成悬疑氛围堆砌，用霉味、胶带、位置三个实物收住。',who:['同桌','看门人','清洁阿姨']});
BANK.push({id:'K212',t:'《闷热那节课，窗被推开了》',g:'scene',d:'friend',c:'moment',e:'warm',idea:'七月的数学课全班没人动，同桌把窗推开一条缝，风把试卷吹起来一页，老师从讲台那边看了一眼，没说话。',mat:['教室没装风扇，只有天花板那台吊扇，转起来吱呀响','她的手臂抬起一格，窗框插销锈住，晃了两下','风从操场那边吹过来，带着跑道上那股橡胶味','试卷翻起来一角，全班一起伸手去按，她第一个按住'],how:['开头：用闷热和吊扇转动的声音，先把人关进那间闷教室','主体：写推窗的那三个小动作，抬手、晃插销、按住试卷','深化：她做的事很小，小到只有同一排的人会跟着按住那页纸','结尾：收在风忽然停下来那一秒，谁也没提刚才是谁推开的窗'],trap:'场景文最容易写拖沓，一节课只写一个动作链，别加心理大段独白。',who:['同桌','数学老师','值日生']});
BANK.push({id:'K213',t:'《一整天我说了七个「嗯」》',g:'scene',d:'friend',c:'word',e:'plain',idea:'那天我数了自己的回应，一共七个「嗯」，最长的一句是「嗯，我知道了」，六个字说完就没了。',mat:['早上到校的时候，班长问昨天作业交了没，我答嗯','课间她递来水壶，我答嗯，谢谢，一共两个词','中午在食堂她说面太咸，我嗯了一声就没了下文','放学她问我明天见吗，我说嗯，然后她先走了'],how:['开头：开头就把这个七个的数字写出来，让读者自己去好奇','主体：按时间顺序列这四个嗯，每个都配一个具体的小场景','深化：我不是不高兴，是每次话到嘴边都被我自己咽回去','结尾：收在她先一步走出校门这个动作上，我不解释只写事实'],trap:'数字最容易写假，这四次回应必须来自不同的场景，不能都放在教室里',who:['同桌','班长','食堂里的人']});
BANK.push({id:'K214',t:'《如果同桌明天不来上学》',g:'imagine',d:'friend',c:'journey',e:'insight',idea:'如果她明天不来，我会先在第二节课发现，然后装作早就知道，直到放学才敢一个人走出校门。',mat:['想象里第二节课是英语，同学翻书声很响，同桌的椅子空着','我把英语书竖起来挡住自己，竖了十分钟也没读进去','想象里我照常值日，扫完北边那一列才发现自己一直在等','想象里校门口人流散尽，我手里的伞还没打开'],how:['开头：开头用一句假设，后面全部改用想象出来的那种口吻','主体：只写那一天里的三个时间点，每个都配一个具体动作','深化：假设不是抒情，是让我提前看清我有多依赖这段同行','结尾：收在校门口那把没打开的伞，留一个不回答的问题'],trap:'想象类容易滑向煽情结局，别写她生病或转学，只要按想象推进一天。',who:['同桌','英语老师','校门口的保安']});
BANK.push({id:'K215',t:'《同桌书包侧袋里那个布袋装的什么》',g:'imagine',d:'friend',c:'secret',e:'curio',idea:'我猜过那个洗到发白的布袋里装的是橡皮、断掉的跳绳绳，或者她不敢说的事，一整个学期没猜到。',mat:['布袋是米白色的，边缘起球，用别针别住了一个角','她每节课都把布袋往里按一下，动作比掏铅笔还快','体育课换班时她第一个动作是摸一下侧袋，确认还在','有一次别针掉了，她在座位底下摸索了足足半分钟'],how:['开头：先描述布袋在颜色、边缘、别针这三处细节，吊起好奇','主体：写按一下、摸一下、摸半分钟这些重复出现的小动作','深化：好奇心的尽头不是答案，是发现她在怕丢某样东西','结尾：收在别针重新别好那一刻，袋子里的东西仍然没出现'],trap:'想象类不能提前给答案，全篇不写布袋里是什么，只写动作和猜测。',who:['同桌','体育老师','邻座']});
BANK.push({id:'K216',t:'《想象我们毕业那天谁先哭》',g:'imagine',d:'friend',c:'change',e:'warm',idea:'想象十年后我们再走进这间教室，大概是我先哭，因为她会在旁边递纸，先递纸的人不承认自己也要哭。',mat:['想象里桌椅是旧的，墙上的黑板报换成激光屏，粉笔灰换成粉笔盒','想象里我们穿着不同的衣服，袖口都是陌生的商标','想象里她还是那句随便，但这次我一定认真回答','想象里出校门的路只有一条，路上没有地铁口'],how:['开头：用想象把时间推到十年以后，语气要轻，不要写得沉重','主体：写想象里的三个具体细节，它们都来自今天这间教室','深化：十年后变的是桌椅和衣服，不变的是谁先递纸的习惯','结尾：收在走出校门那条只有一条的路上，留下一个不点破的结局'],trap:'想象类别写成重逢煽情，细节要来自当下，不许提前编造十年后的大事件。',who:['同桌','班主任','当年的值日生']});
BANK.push({id:'K217',t:'《那个外号跟了我三年》',g:'argue',d:'friend',c:'crowd',e:'plain',idea:'全班给我起了个外号，叫了三年，我嘴上说随便，私下一次没笑过，可我从来没认真说过一句我介意。',mat:['外号从一次口误开始，后来写在黑板角落又被擦掉','课间有人喊我的名字，我抬头比平时慢了半拍','体育课分组时笑声最大，我被推到最边上那次','我回教室以后在草稿纸上写了四个字，又划掉'],how:['开头：先用一句话交代这个外号是怎么来的，别的都先不说','主体：写三个被叫的具体场面和我的反应，只写动作不评论','深化：我嘴上说随便，是怕一开口就输，其实我记着每一次','结尾：收在草稿纸上被划掉的那四个字，笔迹压得能划破纸'],trap:'议论类最怕写成一篇演讲，只写事实和身体反应，不替全班人下结论',who:['同桌','起外号的同学','后桌']});
BANK.push({id:'K218',t:'《我们说了三百遍明天再说》',g:'argue',d:'friend',c:'promise',e:'insight',idea:'从初一到初二，我们把明天再说说了三百遍，真到要说出来的那一次，谁也没能把话说明白。',mat:['说这句话的场合通常是放学路口，书包往下一沉再往上一提','第一次说是因为作业没抄，第二次是因为要去买水','说完就各自骑车，谁也没有回头，笑得特别快','值日表上我那一格空着，名字被人划到下周去了'],how:['开头：把这五个字直接摆进第一句里，一个字也不要急着解释','主体：按场合写出那三次说完就走的三个画面，要各不相同','深化：拖延不是懒，是有些事一说出口就必须真的去做才行','结尾：收在值日表上被划到下周的名字，话没说，事已经往后拖了'],trap:'议论文容易空转讲道理，三个场面必须各不相同，不能重复同一个路口。',who:['同桌','班长','值日班长']});
BANK.push({id:'K219',t:'《我以为她嫌我慢》',g:'argue',d:'friend',c:'mis',e:'down',idea:'那天我一路快走回家，以为是甩下了她，后来听后排同学说，她在校门口站着等了二十分钟。',mat:['我那天因为小组作业没写完，一路小跑，鞋带散着没管','校门口她站的位置被太阳照着，手里拿着我的水杯','第二天她照常来问我的作业，声音和平时一模一样','我准备了三种道歉的话，最后一句都没说出口'],how:['开头：先用那句我以为起笔，再把这份误会直接摆到台面上来','主体：写小跑、散掉的鞋带、她手里那只水杯这三个具体事实','深化：误会里最伤人的不是猜测，是对方在太阳里等的那二十分钟','结尾：收在我一句道歉都没说出口，索性写她照常来问作业'],trap:'别让误会靠一次解释就解开，真实里它会留到第二天，甚至留到更久',who:['同桌','小组同学','值日班长']});
BANK.push({id:'K220',t:'《我们班的接力棒该怎么排》',g:'apply',d:'friend',c:'contest',e:'admire',idea:'运动会前排棒顺序，二十秒里只有我们这些没接过棒的人说了算，写清楚这个顺序的方法。',mat:['顺序要按三段成绩分，第一棒不能是最快的，得是起步稳的','交接区在跑道外侧，提前两步伸手接比站着等稳','掉棒也是技术问题，握棒的位置要往后移一点','排完顺序先走一遍交接区，不能只对着名单讨论'],how:['开头：把二十秒的限制和谁说了算先说清，是方法类写法','主体：按起步稳、按成绩分段、握棒位置这三条写具体做法','深化：排顺序不是排强弱，是把最怕的环节交给最稳的人','结尾：收在走一遍交接区这一步，方法要落到脚下的跑道'],trap:'应用类最忌只讲道理，每一条做法都要能被验证，比如现场先走一遍',who:['体育委员','接力队同学','体育老师']});
BANK.push({id:'K221',t:'《第一次上台前，我把稿子折了三折》',g:'apply',d:'friend',c:'first',e:'protect',idea:'第一次上台，最该准备的不是稿子，而是卡住时手里能抓住的东西，我选了三折的纸，后来发现它比背熟全文管用。',mat:['稿子按开头、主体、结语折三次，手指能捏住折痕处','练的时候对着镜子练了七次，前三次都忘第一句','上台前先看清讲台的台面高度，太高会挡住稿子','卡住就低头看一眼纸，抬头接着说，别停超过两秒'],how:['开头：先给出三折这个具体准备，指出多数人漏掉的是身体','主体：把这四条做法一条条排开，每一条都要当天就能做完','深化：紧张不是敌人，失控才是，纸和折痕是给你一个落脚点','结尾：收在别停超过两秒这一句，把慌也说成了技术问题'],trap:'应用类最容易写成万能模板，稿子折几折、练几次都要写成具体数字',who:['同桌','语文老师','舞台边的同学']});
BANK.push({id:'K222',t:'《怎么兑现明天一起走》',g:'apply',d:'friend',c:'promise',e:'curio',idea:'我们总说明天一起走，想让它变成真办法，得先解决三件事：谁喊、谁等、还有走哪一条路。',mat:['谁喊最难定，得固定一个人，不然第一天就散','谁等要看谁先到校门，早上到的那个在校门内侧等','路要固定，走河堤还是走操场，一改就容易走散','真散过一次之后要补一句我以为你也走了，别互相怪'],how:['开头：用三个具体问题开头，把话题从抒情拉到能执行下去','主体：三条办法各配一件小事，写的时候要写清谁先做什么','深化：约好的事能不能成，不看感情看有没有人负责喊第一声','结尾：收在补那一句解释的细节上，小约定也需要补救机制'],trap:'应用类别写成漂亮的道德说教，要把办法落到具体的人和具体的时间上',who:['同桌','值日班长','校门口的保安']});
BANK.push({id:'K223',t:'《体检单上那行被人盖住的数字》',g:'rec',d:'grow',c:'object',e:'guilt',idea:'体检单发下来那天，我用手盖住体重那一行，回家妈妈问起，我又报了一个比纸上更好看的数字，一直藏到熄灯。',mat:['体检单夹在数学书里，纸边被翻得发毛，夹痕已经很深','量身高那天队伍从走廊排到楼梯口，前面是五个男生','表上我的身高比同桌矮一个数字，她当时什么都没说','晚上我用修正液盖住那一行，笔尖在纸上顿了顿'],how:['开头：先写体检单被夹进数学书，不解释原因，只写纸边发毛','主体：排队量身高，写前面五个男生的背影和我故意挺直的腰','深化：落在我报给妈妈的那个数字上，数字比人更早学会藏事','结尾：收在修正液盖住那一行，笔尖顿了顿就挪开，不作解释'],trap:'别让妈妈翻出体检单当场对质，真实里我只换了说法，疼都疼在自己心里。',who:['同桌','妈妈','校医']});
BANK.push({id:'K224',t:'《抽屉最里面那只旧眼镜盒》',g:'rec',d:'grow',c:'object',e:'admire',idea:'抽屉最里面是一只旧眼镜盒，镜腿缠着胶布，我从没问过它是谁的，只在写不下去的时候打开看看。',mat:['眼镜盒是墨绿的，边角磨出白印，扣子按下去还要晃两下','里面的镜片有一道斜着的划痕，光照过去会分成两半','妈妈整理抽屉时问过一句，我说是外婆的，就没再问','我写不出作文就打开盒子，摸一下那块磨白的绒布'],how:['开头：先写抽屉拉到最底摸到硬壳，让这只盒子先有重量','主体：写盒子的三处细节，划痕、胶布、绒布，一处不省','深化：我不问是谁的，是因为知道就会碰到某些我不打算碰的事','结尾：收在重新关上抽屉的那声轻响，盖子合得比平时轻一点'],trap:'别让妈妈主动讲出这只镜子的来历，悬着比交代更有味道，一解释就轻了。',who:['妈妈','外婆','同桌']});
BANK.push({id:'K225',t:'《被点到名字的那三十秒》',g:'rec',d:'grow',c:'moment',e:'down',idea:'数学课上被点到名字的那三十秒，我盯着书上同一行，等老师喊第二遍，全班翻书的声音像在催我。',mat:['点到我的名字之前，教室安静得能听见窗帘上的铁环','我把课本竖起来，竖着也看不见那行算式写在哪','站起来时膝盖顶到桌沿，椅子发出很轻的一声','我说我等下算出来，声音比我想的还要小一点'],how:['开头：用窗帘上那个铁环的声音开场，安静要有具体的来处','主体：写站起来的四个连续动作，膝盖、椅子、手里的笔','深化：最难受的不是不会，是那三十秒里所有人都在等我出错','结尾：收在我坐下后补写的那一行笔记，字比平时密得多'],trap:'别写成老师讥讽或同学哄笑，真实里最难堪的是安静，是你被留在一片沉默里。',who:['数学老师','同桌','后排男生']});
BANK.push({id:'K226',t:'《第一次把一段稿子念完》',g:'rec',d:'grow',c:'moment',e:'insight',idea:'第一次上台念稿，我只记住一件事：台下第四排有人一直抬头，我知道是同桌，就把那几十个字念完了。',mat:['稿子抄在卡片上，字写得很大，念错一行的后果我想过很多遍','台上灯太亮，看下去台下是一整片模糊的脸，只有一张认得出','念到中间卡住两秒，我听见自己的声音在体育馆里来回撞','念完最后一个句号，第四排那个人还在抬头看我'],how:['开头：先写卡片上抄的那几行大字，紧张要落在具体的实物上','主体：写台上看见的那张脸和卡住的两秒，不写心理活动','深化：有人在看，就足够把人从自己身上拽回来，念完就够了','结尾：收在最后那个句号和第四排的目光，两个动作并排停下'],trap:'别把上台写成成功后的感动，重点写灯太亮、看不清台下这种真实的失控感。',who:['同桌','语文老师','主持人']});
BANK.push({id:'K227',t:'《说好这周不熬到十一点》',g:'rec',d:'grow',c:'promise',e:'warm',idea:'我答应她这周不熬到十一点，第一次做到，两个人在班级群发了一个数字，像完成一件大事。',mat:['约定是她提出来的，因为她第二天早上起不来，趴了半节课','我把台灯挪远一点，光圈就够不到作业本，够不到正好','星期二我把闹钟从六点十分改到六点，手机扣在枕头下面','她先在群里发了个数字一，我跟着发了一，谁也没多说'],how:['开头：先写约定的来由，用她起不来这件事落地，不要煽情','主体：写三件小事，挪台灯、改闹钟、提前关灯，件件具体','深化：数字一发出去就有回音，被人记着比被管着容易坚持','结尾：收在周末我发了个三，她回了一个三，谁也没解释这个计数'],trap:'别把守约写成巨大的毅力，真实里全靠台灯距离和闹钟这类小机关，别写成鸡汤。',who:['同桌','妈妈','值日生']});
BANK.push({id:'K228',t:'《我说好考到前二十》',g:'rec',d:'grow',c:'promise',e:'guilt',idea:'期中考前我说好考到前二十，出来是三十四，我没有解释，只把那句承诺从脑子里删掉了。',mat:['那句话是在放学路口说的，她背着书包问，我说我考不到前二十跟你姓','考试那两天我吃了三次糖醋排骨，第三次就吃不动了','成绩贴在后门那排，我从后往前数，数到三十四停了很久','晚上我翻开错题本写下我保证，又一个字一个字划掉'],how:['开头：从那句跟你姓的狠话切入，承诺要具体到有点可笑','主体：写考前的两次松懈，还有考场外那些很琐碎的小细节','深化：难堪不在分数差十四名，在我开始躲着不再提起那句话','结尾：收在错题本上被划掉的那行字，划得很重，纸背能摸到'],trap:'别让同桌来安慰我说下次努力，那太轻了，写我不提起它才见失信的重量。',who:['同桌','妈妈','班主任']});
BANK.push({id:'K229',t:'《第一次拖地被同学撞见》',g:'rec',d:'grow',c:'first',e:'plain',idea:'第一次轮到我拖地，被三个同学撞见，我解释了一句就低头继续拖，那天我把走廊拖了两遍。',mat:['拖把是我从教室后面的小间里拿的，杆子上还在滴水','他们站在门口笑，说原来拖地是这个声音，我说是有点响','拖到一半水用完了，我端着半桶水走了两层楼梯','回来时走廊已经干了，我又拖了一遍，拖到看不见水痕'],how:['开头：先写撞见的那一下，用三个人的站位和手里的东西交代','主体：写一句解释、一次抬水、一次走楼梯，全程只用动作','深化：被看见不可怕，可怕的是我开始在意自己的动作像不像样','结尾：收在拖到看不见水痕的这句话上，后面不要再加评价'],trap:'别写成被嘲笑的惨事，那三个同学没有恶意，重点写我自己放不下的那点别扭。',who:['后桌','同桌','值日班长']});
BANK.push({id:'K230',t:'《第一次月考我数了两遍名次》',g:'rec',d:'grow',c:'first',e:'down',idea:'第一次月考排名贴在后门，我从后往前数到自己的名字，又从最前面数了一遍，两遍结果一样。',mat:['名单是两张纸拼的，字是打印的，全班一共四十七个人','我数到三十九的时候停了一下，又从最上面开始重新数','午休我没有去食堂，一个人把数学卷子又做了一遍','自动铅笔芯断了三次，第三次是我用牙咬开的'],how:['开头：先写两张打印纸和四十七个人，让数字先立在眼前','主体：写数两遍、重做卷子、笔芯断三次这几个具体的过程','深化：比起名次我更怕放学时看见有人正站在那张纸前面','结尾：收在用牙咬开第三根笔芯这个动作，铃响了才站起来'],trap:'排名类最容易写成自我安慰的结尾，要停在难受上，别让名次变励志。',who:['后桌','班主任','校门口的同学']});
BANK.push({id:'K231',t:'《他一句玩笑我记了半个月》',g:'rec',d:'grow',c:'mis',e:'insight',idea:'同学那句玩笑我记了半个月，起初以为他在针对我，后来发现他到今天也不知道自己说过那句话。',mat:['课间他说侬今天气色真好么，语气跟念课文一样平','旁边两个女生笑了两声就去接水了，笑声断得很干净','我回了一句我气色好得很，声音比平常高了半度','后来走廊上遇见他，他照旧问我要不要一起去小卖部'],how:['开头：先把那句玩笑原样抄写出来，句子里一个情绪词也不要','主体：写笑声停下、我高半度的回答、他完全没察觉这三段','深化：让人难受的是那句话没有恶意，甚至没人记得说过','结尾：收在走廊上他照旧叫我一起走，敌意根本不存在过'],trap:'别让对方在结尾发现并道歉，那会便宜了误会，要保留他自己都不知情的空白。',who:['同学','同桌','后桌']});
BANK.push({id:'K232',t:'《他们说我抄了同桌的作文》',g:'rec',d:'grow',c:'mis',e:'guilt',idea:'交上去的作文和同桌的像了两个地方，那两天谁都不理我，后来我才知道像的是同一本参考书。',mat:['语文老师在课上点出两处相同的句子，我正好坐在中间','我把作文本翻到背面，最后一页有一行很小的批注，是我自己的字','同桌主动把本子交给老师，翻到中间某一页停住了','后来我在图书室查到，那两句都出自同一篇范文'],how:['开头：从老师点出相同句子切入，先写教室里所有人的反应','主体：写我翻到背面、她主动交本子、图书室查到三件事','深化：委屈之外更难堪的是我确实在偷懒，抄参考书也是抄','结尾：收在她翻到那一页停住的指甲，停了两秒才把本子拿回去'],trap:'别把误会写成一次澄清就结束，那两天没人跟我说话的过程必须写够。',who:['同桌','语文老师','后桌']});
BANK.push({id:'K233',t:'《演讲比赛我拿了第三》',g:'rec',d:'grow',c:'contest',e:'plain',idea:'演讲比赛我拿第三，奖状拿回家卷进书包，第二名的手在发抖，我后来才知道那也是她第一次上台。',mat:['台上有两根话筒，我上去时左手那只没插好，说出来只有一半响','稿子里有一句我练了二十遍，说出口还是漏了半句','领奖时主持人念到第二名的名字，队伍里有人轻轻吸了口气','奖状是卷起来的，塞进书包侧袋，一整个星期没打开'],how:['开头：先写那只没插好的话筒，失误要出现在第一段的最前面','主体：写漏半句、队伍里的吸气声、卷起来的奖状这三处','深化：名次其实不重要，重要是我开始在意谁在台下看着我','结尾：收在侧袋里没打开的奖状，一星期后纸已经有点软'],trap:'别把名次写成失落或者骄傲，重点写上台那两秒话筒失灵的真实感受',who:['同桌','语文老师','主持人']});
BANK.push({id:'K234',t:'《接力棒在我手里掉了》',g:'rec',d:'grow',c:'contest',e:'down',idea:'运动会四百米接力，棒在我手里掉了，我捡起来跑完那一段，交棒的时候两只手心都是灰。',mat:['我们班排第四，前三棒都有把握，最后一棒换了我','掉棒在弯道刚开始的地方，棒子弹出去滚到跑道外','我弯腰时听见后面有人喊，声音混在风里分不清是谁','交棒那一下我们的手撞在一起，掌心都是灰，都是湿的'],how:['开头：从我们班排第四、最后一棒换我写起，交代输赢压力','主体：写掉棒、捡棒、跑完那一个弯道的三个动作，节奏要快','深化：我一直以为大家会怪我，结果谁也没提，只催我快跑','结尾：收在交棒时两手相撞的触感，掌心的灰是这一段的纪念'],trap:'别把掉棒写成全校议论的丑闻，班里反应很淡，淡才显出我自己放得太大。',who:['体育委员','同桌','终点裁判']});
BANK.push({id:'K235',t:'《放学路上多出来的三分钟》',g:'rec',d:'grow',c:'journey',e:'curio',idea:'放学我比同桌多骑三分钟，绕进一条没有监控的小巷子，只为在那个路口看三分钟的落日。',mat:['从学校到地铁口两个方向都堵，我选了没有红绿灯的那条','巷口有家修自行车的铺子，摊主每次都抬头看我一眼','第三分钟那家店会放一段听不清的老歌，音量固定不变','我到地铁口时她已经站了十分钟，发消息说风太大了'],how:['开头：先写两个方向都堵，把绕路这件事说得合情又合理','主体：写巷口的车铺、抬眼的目光、听不清的老歌这三样','深化：多出来的三分钟不为了风景，是为了天黑前先一个人待一会儿','结尾：收在她那句风太大了，我笑了一下，回了两个字马上到'],trap:'别把绕路写成逃学或危险，理由要琐碎安全，重点是那三分钟只属于自己。',who:['同桌','修车摊主','妈妈']});
BANK.push({id:'K236',t:'《从说不清到一句完整的自我介绍》',g:'rec',d:'grow',c:'journey',e:'insight',idea:'我用了两年才把一句自我介绍说完，中间卡住的那几秒，现在听别人卡住就知道那是嘴笨，不是笨。',mat:['刚入学时我介绍到一半就停了，后面站着的人替我把话补完','我说话爱重复第一个字，重复完自己就忘词了','老师让我每天读一段课文，我读到第三周才不漏字','现在我做值日讲解，紧张还是会，但不再重复那个字'],how:['开头：从别人替我把话补完的那一瞬间写起，尴尬要具体','主体：写重复第一个字、忘词、每天读课文这三段的过程','深化：慢不是缺点，是我在给自己留出把话说完的那点时间','结尾：收在值日讲解的最后一句，说完自己先在原地站了两秒'],trap:'别把口音或结巴写成励志逆袭，重点写重复字这个具体毛病带来的误会。',who:['同桌','语文老师','值日班长']});
BANK.push({id:'K237',t:'《成绩单背面朝下塞进书包》',g:'rec',d:'grow',c:'secret',e:'protect',idea:'那张卷子我一直背面朝下塞在书包里，谁问起来就说是草稿纸，其实那是我这学期最差的一次。',mat:['卷子折成三折，折痕正好压在分数那一行的背面','书包侧袋的拉链坏了一直没修，它就靠这个口袋藏东西','同学借数学本时我会先按住侧袋，动作很快很自然','后来我把它拆开重做一遍，错的是三道计算大题'],how:['开头：先写把它折成三折这个动作，让藏起来有具体的手势','主体：写按住侧袋、压住分数、拆开重做这三处很具体的细节','深化：我护的不是纸，是那一次我确实在走神，坐直了也没听进去','结尾：收在重做完那三道计算题，卷子塞回去了，折痕换了个方向'],trap:'别让家长意外翻出这张卷子，秘密要靠坏拉链守住，情节必须安静。',who:['同桌','数学老师','后桌']});
BANK.push({id:'K238',t:'《我偷偷学了她半年的坐姿》',g:'rec',d:'grow',c:'secret',e:'admire',idea:'有人问过我为什么最近坐得那么直，我说是换了椅子，其实我跟着同桌的坐姿坐了大半年。',mat:['她写作业时左手托着下巴，背挺得很直，脚掌踩在地上','我一开始学得很用力，写十分钟就要晃一下腰','后来改成脚踩地这个办法，坐久了脚会酸，酸着就不想趴','她换座位那天，我的新桌角贴了张便签，写着三个坐姿要点'],how:['开头：从别人问我为什么最近坐得直写起，答案先留着不说','主体：写模仿左手托下巴、脚掌踩地、贴便签这三个阶段','深化：羡慕一个人不一定要说出口，抄她一个习惯也算一种靠近','结尾：收在新桌角那张便签，纸边已经卷了，字还是照抄她的'],trap:'别把这件事写成盲目模仿的自卑，结尾要留在安静的习惯上，不作评价。',who:['同桌','后桌','班主任']});
BANK.push({id:'K239',t:'《我爸那句沪语词的来处》',g:'rec',d:'grow',c:'word',e:'curio',idea:'我爸说话爱带一个沪语词，我查了很多人才知道那是句老话，他从小学就想考出去，词却一直带着。',mat:['那个词他一天要用十几次，家里每个人都听得出区别','写货车调度表时他会停下来念一遍，声音很轻，像在点数','我在网上查到词出自一本旧诗集，注音标的是普通话','他没读过那本诗集，他说这词是爷爷传下来的'],how:['开头：先让那个词单独出现一次，不解释，让读者感到突兀','主体：写家里一天十几次、念调度表、查诗集这三段推进的过程','深化：有些东西不查来源就一直活着，查清了反而少了味道','结尾：收在爷爷传给他这一句，末了加一句他从没说过来源'],trap:'别把查词写成父女和解，父女之间可以只是各自保留一句话，不和解更真。',who:['爸爸','爷爷','同桌']});
BANK.push({id:'K240',t:'《那句口头禅是我传染出去的》',g:'rec',d:'grow',c:'word',e:'plain',idea:'我随口一句拖长音的口头禅，一个学期里全班都跟着说，连体育老师吹哨前也带上了一句。',mat:['我说这句时习惯拖最后一个音，拖长了显得慢条斯理','最早是隔壁组学我的，后来早读时整排都在说，声音排成一片','班主任听见后没制止，只在班会上重复了一次，像确认','现在我自己反而不说了，一开口就听见身后四十几个人跟着'],how:['开头：先写那句被拖长的尾音，说明它为什么容易被人跟着说','主体：写传染的三个阶段，隔壁组、早读整排、班会上那一次','深化：被一整个班跟着说很热闹，热闹里也有一点说不出口的孤单','结尾：收在我不敢再开口的那一下，身后的声音比我还长'],trap:'别写成我很得意的恶作剧，重点是那点说不出口的孤单，别写成纯搞笑。',who:['同桌','班主任','后桌']});
BANK.push({id:'K241',t:'《量身高那天排在前面的男生》',g:'rec',d:'grow',c:'crowd',e:'plain',idea:'量身高的队伍从前门排到后门，我排在第七个，前面六个男生互相报着数字，我一句都没插。',mat:['队伍贴着墙根排，走廊宽不了两个人，鞋尖挨着鞋尖','他们比数字的方式很随便，先报再撩起头发看有没有人笑','我两只手攥着校服下摆，攥出一道很深的褶子','轮到我时念出的数字，比体检表上写的少了半格'],how:['开头：先写队伍贴着墙根的宽度，集体场面要有物理的边界','主体：写他们比数字、我攥衣摆、我少报半格这三处小动作','深化：我在人群里不参与比较，是因为一比就一定会输给谁','结尾：收在念出那个数字时那半格的犹豫，老师没有听出来'],trap:'别把排队写成同班互相嘲笑，同龄人更多是无聊地闹，不是恶意，别写重了。',who:['后桌','男同学','校医']});
BANK.push({id:'K242',t:'《门牙掉下来的那个星期》',g:'rec',d:'grow',c:'change',e:'warm',idea:'门牙掉下来的那个星期，说话都漏风，我不敢张嘴，同桌却天天追着我用漏风的音念课文。',mat:['牙是早上咬着苹果掉的，咬下去没有声音，只有一下空','说话漏风，我说一句要抿一下嘴，抿多了话就越来越少','她学我说话时自己也在漏风，两个人的声音都成了筛子','第四天新牙冒了一点白头，硬的馒头终于能咬两口'],how:['开头：从咬苹果那一下忽然没有声音写起，这种失落要写得很轻','主体：写漏风、抿嘴、她跟着学这三个重复出现的小细节','深化：被她学我说话居然不难堪，因为她把我当成一起闯祸的人','结尾：收在第四天冒白头的那颗牙，馒头终于能咬得动了'],trap:'别把换牙写成被嘲笑的惨事，她的学法是亲近不是取笑，重点写这个区别。',who:['同桌','语文老师','妈妈']});
BANK.push({id:'K243',t:'《体检单夹在美术书第二十三页》',g:'scene',d:'grow',c:'object',e:'protect',idea:'体检单我夹在美术书第二十三页，那一页画着一尊石膏像，同学翻到那里都只以为是废纸。',mat:['美术书比数学书厚，压得住，也不容易被顺手抽出来','第二十三页那幅石膏像的眼睛有一道裂线，我特意挑了这一页','自习课上有人翻到那一页，看了两秒，没说话就合上了','后来我在裂线旁画了一道竖线，当作只有我看得懂的记号'],how:['开头：先写美术书被翻开的动作，从别人无意碰到它写起','主体：写挑这一页的用意、别人的那两秒、我补画上去的记号','深化：藏起来的东西也要有人误认成别的，这个误会是我的保护层','结尾：收在那道补上的竖线上，书合上时两张纸夹在一起响了一声'],trap:'场景类容易写成紧张戏，别安排任何人当场发现，让误会一直完整地留着。',who:['同桌','美术老师','后桌']});
BANK.push({id:'K244',t:'《饭桌上那句你又瘦了》',g:'scene',d:'grow',c:'word',e:'down',idea:'饭桌上妈妈说我又瘦了，我嗯了一声，夹了口菜，饭吃了一半就回房间，那次我没关厨房的灯。',mat:['碗里的米饭堆成小尖，是爸爸先拨给我一勺的','那句话后面跟着的是明天煮骨头汤，说的是补身体，听着像责备','我说我想吃炸鸡，她说油大，然后话题就断了','回房间时厨房的灯还亮着，光从门缝铺进来一条直线'],how:['开头：先写那碗堆成小尖的饭，让关心和压力同时都存在','主体：写一句抱怨带出两句对话，节奏要短，中间不留空','深化：我不是生气，是不知道怎么证明自己也需要被照顾','结尾：收在那条从门缝进来的灯光上，门没关，饭没吃完'],trap:'别让妈妈接着解释她的担心，那会变成和解，真实里饭桌常常就断在那里。',who:['妈妈','爸爸','同桌']});
BANK.push({id:'K245',t:'《校服背后那两个字》',g:'scene',d:'grow',c:'contest',e:'insight',idea:'校服背后印着班号，我那件洗得最旧，被人问起时我第一次说这是我们班最丑的一次比赛。',mat:['班服是大巴上统一订的，背后两个字是班级缩写，烫得很高','我那件袖口磨出毛边，领子后面有块洗不掉的印子','有人拍照时特意把我这件留着，说拍出来有年代感，我笑了笑','后来全班穿着同一件去拍，站了四十一张一样的照片'],how:['开头：先写烫得很高的那两个字，和我那件最旧的校服之间的差别','主体：写磨毛的袖口、洗不掉的印子、拍照那一下的反应','深化：穿同一件去拍的时候，丢脸变成了认领，这才是竞争里最实在的东西','结尾：收在四十一张一样的照片，只有一张我的袖子偏长'],trap:'别把校服矛盾写成同学之间的恶意，多数人只是随手一指，别上纲上线。',who:['同桌','后桌','摄影师']});
BANK.push({id:'K246',t:'《想象十年后我坐回这张课桌》',g:'imagine',d:'grow',c:'change',e:'curio',idea:'想象十年后的我坐回这张课桌，桌子矮了，人也换了，只有我还会下意识去摸那截断掉的铅笔。',mat:['想象里桌面上多了一层磨不掉的划痕，是新长出来的','我想象自己会先摸那个笔槽，右边的槽空了，左边还插着橡皮','想象里同桌的位子坐着一个不认得的人，我会看她三秒','想象里我先想到的居然是白菜又涨价了，和现在的比很蠢'],how:['开头：用想象把时间推得更远一些，语气要轻松些，不要感伤','主体：写桌面划痕、空掉的笔槽、陌生同桌这三个想象的细节','深化：真正被记住的是那些小动作，不是那天的排名和分数','结尾：收在摸断铅笔这个习惯上，想象结束，笔还在手里'],trap:'想象类容易写成二十年后的成功人士，留在教室里别离开，落点要小。',who:['同桌','班主任','自己']});
BANK.push({id:'K247',t:'《想象毕业那天的自行车棚》',g:'imagine',d:'grow',c:'journey',e:'admire',idea:'想象毕业那天的车棚，我推着车出来，她已经站在门口，我想象自己会先说一句我今天回家吃饭。',mat:['想象里车棚的锁换了一批，钥匙还是得用一根铁丝挑开','想象里她手里多了一个纸袋，装着我校服上掉的那颗扣子','想象里我到门口时头发已经剪短，我妈还站在校门外','想象里我说完那句话就骑上车，骑到路口才发现自己没回头'],how:['开头：用铁丝挑锁这个细节，把想象落到最具体的那个动作上','主体：写纸袋里的扣子、校门外的我妈、没说出口的回头','深化：羡慕的是她能收好一颗扣子，像把三年的事收起来放进口袋','结尾：收在骑到路口没回头这一下，克制比抒情更接近那天'],trap:'别把想象写成告白的场合，情感要压在扣子和回头这两个小动作里。',who:['同桌','妈妈','班主任']});
BANK.push({id:'K248',t:'《想象第一次上台，手里握着一颗糖》',g:'imagine',d:'grow',c:'first',e:'protect',idea:'想象第一次上台的那只手，我攥着一颗水果糖，糖被我捏化了，我全程不知道自己手心有湿意。',mat:['想象里那颗糖是硬的，含着能顶一会儿又不至于说糊','我把它放在外套右口袋，上台前才摸出来，糖纸皱得不成样','想象里灯光照下来，糖在掌心里是透明的，能看见里面发白','下台后同桌问我手心是不是出汗，我把手插进了兜里'],how:['开头：从想象里那颗糖写起，让这一件小道具承担全部紧张','主体：写口袋、皱掉的糖纸、掌心里的湿这三个连续的细节','深化：紧张要有个东西托着，托着它的东西不必让任何人知道','结尾：收在下台以后把手插进兜里，那颗糖其实早就化完了'],trap:'别写成勇敢上台的励志文，想象只解决一个具体问题：手心有东西可抓。',who:['同桌','语文老师','舞台边的同学']});
BANK.push({id:'K249',t:'《名次到底要不要看》',g:'argue',d:'grow',c:'contest',e:'insight',idea:'有人把成绩单贴了一整面墙，有人当没看见，我站中间想了很久，排名有用，但它不该排在最前面。',mat:['老师说是为了方便对照，压在公布栏最外层，一按就翘起来','有人在前面讨论谁掉了几名，声音不大也不小，都听得见','排在前面的那位说想换到后面去，被大家起哄着笑回去','我撕下来过一次，第二天它又被人端端正正贴了回去'],how:['开头：先摆出两种相反的做法，让读者自己去感到那种矛盾','主体：写墙上的纸、前面的人、撕下来又被贴回去这三段','深化：名次本来只是一个工具，挂在最外面就变成了压力来源','结尾：收在第二天那张纸被重新贴平，翘起的一角压得很实'],trap:'议论类最怕结论先行，论证要靠具体场景堆出来，别在开头就下结论',who:['班主任','前排同学','同桌']});
BANK.push({id:'K250',t:'《妈妈那句你看看人家》',g:'argue',d:'grow',c:'word',e:'protect',idea:'妈妈最常说的一句是你看看人家，我以前会顶回去，现在我换了说法，把她的话原样还给她。',mat:['她说这句话时通常在剥豆子，手上的活不停，头也不抬','被拿来比的是楼下那个女生，成绩比我好，人也瘦','以前我说烦不烦，现在我说我知道了，然后把她的话还回去','那次我说的是你看看隔壁楼的灯，不用比我，比比还亮不亮'],how:['开头：先让这句话单独出现一次，不带任何评价，也不作解释','主体：写剥豆子的动作、被拿来比的那个对象、我换说法的过程','深化：顶嘴没用，把对方的话用同一个句式还回去，反而让她停手','结尾：收在剥豆子的手停了一下，豆子掉回盆里，一声闷响'],trap:'议论类别写成一场辩论赛去赢父母，重点是写她手上的动作停住了那一下',who:['妈妈','爸爸','隔壁楼的邻居']});
BANK.push({id:'K251',t:'《我为什么要把手机交出去》',g:'argue',d:'grow',c:'crowd',e:'down',idea:'手机交出去那天，全班都觉得我没那么酷了，可我在校门外站了很久，没人知道那天晚上我又拿回来了。',mat:['交手机是在班主任办公室，四个人的一摞，最上面那只壳是我的','我妈把袋子拎回家，一路没说话，进门把袋子放在鞋柜上','那天晚上她加班，我垫了张凳子从鞋柜又把它取出来','第二天我照常交作业，没人看出来，只是屏幕没再亮过'],how:['开头：先写办公室那一摞手机的厚度，让交手机这个场面有分量','主体：写拎回家的沉默、鞋柜上的袋子、垫凳子取出来三段','深化：交出去的是被看着的自由，拿回来的是没人知道的两个小时','结尾：收在第二天照常交作业，没人看出屏幕有没有亮过'],trap:'别把偷拿手机写成违法或者惊险，真实里只剩一点尴尬和一点心虚。',who:['妈妈','班主任','后桌']});
BANK.push({id:'K252',t:'《零花钱怎么跟爸妈谈》',g:'apply',d:'grow',c:'promise',e:'plain',idea:'我列了一张表，把一个月要花的分成年表、电话、文具三栏，第一次跟爸妈谈这件事没吵成。',mat:['表是画在数学作业本背面的，格子和单位都自己补的','我先说文具，再说电话，把最大的那项留到最后才开口','爸爸问我早饭是不是可以在家吃，我把这句话抄在表下面','最后定的数字比我要的少，我签了名字，按了手印'],how:['开头：先拿出这张自己画的表格，让谈钱有实物而不是空话','主体：写谈的顺序、爸爸的反问、我答不上来的那个问题','深化：谈钱不是要钱，是把家里不方便讲的开销摆到桌面上','结尾：收在按下的那个手印上，印泥有点干，纹路只出来一半'],trap:'应用类别写成话术模板，每一步都要有家里人的真实反应，别替他们安排点头。',who:['妈妈','爸爸','同桌']});
BANK.push({id:'K253',t:'《被起了外号以后我该怎么接》',g:'apply',d:'grow',c:'moment',e:'insight',idea:'被起了外号以后我试过三种接法，最后留下的那种是笑一下再把话题接过去，名字就不会一直响。',mat:['外号是从一次读错字开始的，念了三次，第三次全班一起念','第一种是立刻说别叫我，没人听；第二种是跟着笑，笑声更响','第三种是我下次把那个字念对，念得很清楚，然后抬头看他们','现在他们叫得少了，偶尔叫一声，我抬头就停，两个人都停'],how:['开头：先写外号怎么被念起来的那三次，误会要有具体过程','主体：把这三种接法分开写，每种都要写它当场换来的后果','深化：把话题接走需要准备，我背了两周那个字的标准发音','结尾：收在叫的人和被叫的人同时停下来的那短短一秒里'],trap:'应用类别把方法写成胜利宣言，结尾要保留没解决的毛刺，别一次见效。',who:['同学','同桌','班主任']});
BANK.push({id:'K254',t:'《把骑车那二十分钟用起来》',g:'apply',d:'grow',c:'journey',e:'warm',idea:'放学骑车二十分钟，我以前一路戴耳机，现在把它分成两段，后一段放掉耳机，刚好背完四个单词。',mat:['第一段路两边都是店，招牌很吵，我从前一路听歌','过了第二个红灯就是河堤那段，路窄了，车也少了','我把手机塞进书包侧袋，塞进去要腾出一只手，容易摔','现在我在这段路上背单词，冷了就骑快点，耳机留在书包里'],how:['开头：先写第二段路的具体变化，店变少了，路也跟着变窄','主体：写塞手机、腾手、加速这三个动作带来的真实不便','深化：专注不是逼自己，是把工具收起来，给自己一段不能分神的路','结尾：收在耳机留在书包里，路过第二个红灯时我刚好背完一个词'],trap:'骑车类不要写危险操作，减速、靠右、不戴耳机这些安全常识要顺带写进去。',who:['同桌','妈妈','修车摊主']});
BANK.push({id:'K255',t:'《八百米只跑出第五名》',g:'rec',d:'setback',c:'contest',e:'down',idea:'校运会上我报了八百米，最后只跑出第五名；我没有把这件事写成励志，而是记住那天我在第六圈才开始加速，配速从一开始就错了。',mat:['报名表上我填了八百米，笔尖在四百米那一栏停了一下','起跑时鞋带系得太紧，第三圈脚后跟磨破了袜子','看台上{对手}一直举着我的号码布站在终点旁边','最后两百米呼吸乱掉，只能看着前面四人的背影'],how:['开头：先写起跑那声枪响和脚下的塑胶跑道，别急着说结果','主体：按第一圈、第二圈脚后跟、第三圈还剩六个人的顺序写','深化：真正的失误是前四圈跟着别人的速度跑，自己的配速没定下来','结尾：收在第二周早训时我把圈数写在手背上的那个动作上'],trap:'别把没拿名次写成失败让我懂得坚持这类结论，必须写清配速错在第几圈和下次怎么练。',who:['对手','体育老师','同桌']});
BANK.push({id:'K256',t:'《站在台上忘了词的那四十秒》',g:'rec',d:'setback',c:'moment',e:'guilt',idea:'班会上我准备了四天的发言，上台第四十秒忘了词，只能一句一句往外挤；那四十秒我一直在想台下有没有人在笑。',mat:['稿子被我折成八折，右下角已经起毛','讲到第二段时台下有人在传纸，声音很轻','我低头看稿，那一行被水笔涂过，认不全了','讲完时掌声很稀，我把手心的汗在裤缝上蹭了两下'],how:['开头：用那四十秒做开头，先写台下的安静和我的呼吸','主体：按忘词、低头、硬挤出三句话、掌声这四个动作走','深化：忘词不是意外，是我把稿子背成了一条不需要想的线','结尾：收在我把稿子重新抄一遍、抄到第二段停了很久'],trap:'别写成当众出丑的喜剧，落点要放在我不敢看第一排的具体动作上，删掉夸张心理描写。',who:['对手','语文老师','班长']});
BANK.push({id:'K257',t:'《说好替她值日，我去了操场》',g:'rec',d:'setback',c:'promise',e:'warm',idea:'我们说好用午休换她替我值日，那天她来替了，我却在操场练球；她替我值到第六节课，我在操场跑到天黑。',mat:['值日表上我的名字被她用铅笔轻轻描了一遍','中午她说没关系你去练吧，扫把在门后面','我在操场练到天黑，鞋里全是沙','回教室时她已经把地扫完，簸箕里的灰倒得很整齐'],how:['开头：先写那张被描过一遍的值日表，语气要轻','主体：按中午答应、我在操场、她值到第六节课的顺序','深化：她替的不是一次值日，是我怕被老师记名的那一点慌','结尾：收在她那句扫把在门后面，我第二周把扫把提前拿出来'],trap:'别让她一句抱怨都不发，她越轻描淡写，你越要在自己的动作里写出亏欠。',who:['同桌','值日班长','体育老师']});
BANK.push({id:'K258',t:'《第一次上台只讲了半篇》',g:'rec',d:'setback',c:'first',e:'plain',idea:'第一次在国旗下讲话，我写了六分钟，上台两分钟就下来了；那张稿子我到现在还留着，折痕在第四段，那里是我讲不下去的地方。',mat:['稿子是横格纸，第五段有一处被我划掉重写','站到升旗台边上时风很大，稿纸被吹翻过去一页','我讲到第二段就不记得后面了，只能说下面请听','下来时两级台阶我走得很慢，手扶着铁栏杆'],how:['开头：先写升旗台上的风和那张翻过去的稿纸','主体：按开口、卡住、说下面请听、下台阶四步还原','深化：不是稿子写坏了，是写的时候没想过要站在那里说出口','结尾：收在稿子第四段的折痕上，说明我为什么一直没扔'],trap:'别在结尾配一句老师的鼓励，真实的是六分钟里最浅的一层记忆。',who:['语文老师','后桌','国旗班班长']});
BANK.push({id:'K259',t:'《我把七十八分看成六十八分》',g:'rec',d:'setback',c:'mis',e:'insight',idea:'数学卷发下来我盯着分数看了三遍，才发现那是七十八不是六十八；我第一次知道粗心不是一个形容词，是一个具体动作。',mat:['分数写在右上角，那个数字的横杠被墨水糊掉一点','我把卷子对着窗户照，光正好落在那个数字上','错题是我算对了却抄错的，抄错的字迹比算式更清楚','我在旁边重算了一遍，结果和卷子上的一样'],how:['开头：先写分数那一角和窗户里的光，别急着认错','主体：按我误读、对着光再确认、找出抄错那题的顺序写','深化：真正的错不是分数，是我没把卷子从头到尾看完一遍','结尾：收在我用红笔把每一题重新对答案的那一晚上'],trap:'别写成粗心害了我的感慨，要落在那个数字被墨水糊掉一横的具体差别上。',who:['数学老师','同桌','值日生']});
BANK.push({id:'K260',t:'《退回三次的那篇作文》',g:'rec',d:'setback',c:'object',e:'warm',idea:'我的作文被老师退回来三次，每次只有一行批语没有细节；第四次我把这三次批语抄在草稿纸背面，照着改，才被当范文念了一段。',mat:['第一次退回，批语是没有细节，后面空着一片','第二次退回时纸角卷起来，我用订书机压了压','第三次批语变成了重写一遍，我加的那处细节留住了','第四次交上去，当天课间被念了一段'],how:['开头：从三次退回这个事实开场，把第一次放在最前面','主体：按退回、抄批语、照着改、第四次被念的顺序推进','深化：老师要的不是辞藻，是我把自己看见的东西写下来','结尾：收在那行没有细节被划掉的那一道线上'],trap:'别把三次退回写成刁难，重点是那行批语让我第一次知道该往哪里看。',who:['语文老师','同桌','班长']});
BANK.push({id:'K261',t:'《从第一稿数到第七稿》',g:'rec',d:'setback',c:'journey',e:'down',idea:'一篇八百字作文我写了七稿，第一稿最短，最后一稿最长；可我还是没拿到那个奖，第七稿是我最不满意的一篇。',mat:['草稿纸一共用了十一张，废掉的有四张','第一稿我只写了三百字，结尾是忽然想到的','第五稿开始抄好句子，整段都是别人的口气','第七稿写到夜里，窗台上还摊着前六稿'],how:['开头：先把十一张草稿纸摊开，让数量先说话','主体：按前三稿、第五稿、第七稿三段来分，不要平均用力','深化：越往后越像抄的，写到最后我已经不敢重读第一稿','结尾：收在我把第一稿重新抽出来读，只读到一半'],trap:'别用坚持了七稿当励志结论，结尾必须留一个没解决的遗憾。',who:['语文老师','同桌','家长']});
BANK.push({id:'K262',t:'《我把落选瞒了三天》',g:'rec',d:'setback',c:'secret',e:'guilt',idea:'校运会我报了四百米预赛就被刷下来，回家只说自己没去；三天后我在楼梯上碰见{对手}，她说恭喜你第一轮就过了。',mat:['手机里报名成功的截图我设成了收藏，列表里没放出来','妈妈问校运会哪天，我说下周三，其实已经过去了','楼梯上她手里拿着同一家超市的袋子','我说谢谢，然后转身下了一层楼又上来'],how:['开头：从那条被藏起来的截图开始，语气要藏着','主体：按我问、她答、楼梯上碰见、我逃开四步还原','深化：瞒的不是名次，是怕她知道我在初赛就被刷下来','结尾：收在说完谢谢又折回上一层楼的那个动作上'],trap:'别让真相当场揭开，也不要写成痛哭，写成两人各自知道都不点破更真。',who:['对手','妈妈','体育老师']});
BANK.push({id:'K263',t:'《那句你也可以不参加》',g:'rec',d:'setback',c:'word',e:'protect',idea:'名单差一个名额，班主任在班上说谁都可以不参加；我把这句话听成了可以把名额让给{对手}，之后一整周两个项目都没报名。',mat:['班主任说完那句话就去改作业，笔尖一直响着','我在名单最后一行下面画了一道，把自己的划掉了','她那天也听成了老师同意了，同样没有报名','直到体育课分组，她问我怎么两个项目都没去'],how:['开头：先把那句话原样引出来，位置放在自习课上','主体：按听错、划掉名字、两个人都没去、分组时她问四步','深化：我以为是在保护她，其实是替别人做了一个决定','结尾：收在名单发下去时那一栏空着，没有人知道空了两个'],trap:'别把那句客话解释成老师暗示，重点写我如何把它听成了许可。',who:['班主任','对手','体育委员']});
BANK.push({id:'K264',t:'《全班等答案，我答错了那道》',g:'rec',d:'setback',c:'crowd',e:'guilt',idea:'数学课上老师点了我的名，全班都在等我开口，我算对了却把答案说反；那句话我说得很流利，错得很彻底。',mat:['老师点名前我正在转笔，笔掉在桌上弹了两下','我站起来时膝盖撞到桌腿，粉笔灰掉了一地','我把分子和分母的位置全倒着说了一遍，说得很顺','坐下时前排没人回头，后排有人把课本翻到那一页'],how:['开头：定格在笔掉在桌上那一下，制造一段短暂停顿','主体：按站起来、说反、坐下、后排翻书四个动作写','深化：全班等答案的那几秒，比答错本身更难熬','结尾：收在放学前我把那道题在本子上重写了五遍'],trap:'别让同学当场笑场或老师接话，真实的课堂是很快翻页，谁也不提。',who:['数学老师','后桌','同桌']});
BANK.push({id:'K265',t:'《我的字从好看变难看的那个月》',g:'rec',d:'setback',c:'change',e:'down',idea:'初一我的字被老师当范字贴过，初二那年我写了一整页方格，字比原来大也难看；我撕过一次，又用胶布粘回去交了上去。',mat:['原来那张范字在书桌右上角贴了一整个学期','那个月我每行只写二十个字，纸右边总要留白','我把写满的一页撕下来，撕口是斜的','我用透明胶把两半粘回作业本，粘的时候压了很久'],how:['开头：先写书桌右上角那张范字还在，四周的胶带发黄','主体：按贴范字、写坏、撕纸、粘回去的顺序还原','深化：字变难看不是懒，是写得快了，笔画还没落稳就抬笔','结尾：收在交上去那一页，撕口朝里，看不出来'],trap:'别把字变难看归结为忙或累，要落到笔画顺序和写字的速度上。',who:['语文老师','家长','同桌']});
BANK.push({id:'K266',t:'《五十八分那张卷子的家长签字》',g:'rec',d:'setback',c:'object',e:'guilt',idea:'数学卷发下来那天我把卷子对折再对折，塞进书包最里层；晚上我还是把分数写在家长联系单上，字比平时小一半。',mat:['卷子对折两次刚好塞进笔袋后面那一层','联系单上我的字突然写得特别小，比平时小一半','爸爸在客厅看电视，我在他背后站着说完分数','他说了一句知道了，然后问我吃饭了没有'],how:['开头：先写对折两次这个动作，卷子始终没有被摊平','主体：按藏卷子、写小字、背后站着、那句吃饭了没有还原','深化：我说的是分数，躲的是后面那几道我真的不会做的题','结尾：收在他转身进厨房，我站在原地把书包背带理了理'],trap:'别写成家长发火，也别写成父母完全理解，重点写我不敢让他们看到卷子背面。',who:['爸爸','数学老师','同桌']});
BANK.push({id:'K267',t:'《第一次值日多关了一盏灯》',g:'rec',d:'setback',c:'first',e:'curio',idea:'第一次轮到我拿钥匙，教室只剩我一个人；我按顺序关灯，数到第五盏时整层楼都黑了，走廊尽头还亮着一盏。',mat:['灯的开关一排六个，我按顺序数到最后是五个','关掉第五盏时整层楼忽然很黑，只有楼梯口还有光','我又跑上去把第六盏关掉，下楼时扶手很凉','第二天第一盏灯是我开的，我多看了它一眼'],how:['开头：用多关的那盏灯做钩子，先写数灯这个动作','主体：按数开关、第五盏、黑、跑上去关第六盏的顺序','深化：我第一次发现值日不是把事做完，是知道自己漏了什么','结尾：收在第二天早上开第一盏灯时我多看它一眼'],trap:'别写成我养成了好习惯的总结，要留在那个没被关掉的第六盏灯上。',who:['班主任','同桌','值日班长']});
BANK.push({id:'K268',t:'《拔河输了，我一直以为是我没喊》',g:'rec',d:'setback',c:'mis',e:'protect',idea:'拔河输给隔壁班，我们班一直说是我没喊好；直到三个月后我在器材室听见{对手}说他们换了鞋，才知道我们输在别的地方。',mat:['我那天喊得声音都劈了，绳子还是一寸寸往过','我们班在第二局乱了一次队形，前面两个人踩在一起','三个月后器材室有人在说鞋底的事，我没有走开','他们穿的是平底布鞋，我们班穿的是新跑鞋'],how:['开头：先写我喊哑的那场拔河，不解释输的原因','主体：按我们的说法、器材室那句话、鞋子的对比三段写','深化：护住的是那一点不服气，也是我不愿再提那场比赛','结尾：收在我现在看见新跑鞋会先看鞋底这个小动作上'],trap:'别把重点全放在鞋子上，真相只占一小段，其余写我为什么护着这个说法。',who:['对手','体育委员','班主任']});
BANK.push({id:'K269',t:'《黑板报输给隔壁班那次》',g:'rec',d:'setback',c:'contest',e:'admire',idea:'班级黑板报评比我们输给隔壁班，差两分；他们把每个字的间距都量过，我到现在还记得那块黑板的样子。',mat:['我用粉笔打底，隔壁班先在草稿纸上画了格子','他们的报头用直尺比过，四个字一样高','我们班的粉笔用了三根，配色的罐子少了半瓶','评比那天我站在走廊上，看见他们班的人在擦字'],how:['开头：先写结果，再用两块黑板的样子对比进入','主体：按打底、量间距、粉笔颜色、擦字四个画面写','深化：输的不是才华，是有没有人愿意在纸上多花那半小时','结尾：收在隔壁班报头那四个字上，说明我从哪里看出来的'],trap:'别写成嫉妒隔壁班，结尾要落在佩服上，写他们擦字时的整齐。',who:['对手','宣传委员','语文老师']});
BANK.push({id:'K270',t:'《小船进水沉掉的那一秒》',g:'rec',d:'setback',c:'moment',e:'insight',idea:'纸做的小船放进水池，我松手它就沉了；从水面破开到全湿透大概只用一秒，那一秒里到底哪一步错了，我弄清了很多天。',mat:['船底是我糊的第二层，比第一层小了一圈','放手的位置太高，船头先吃进了水','沉下去时船翻了个面，帆掉在旁边的水面上','我用镊子把帆捞回来，纸已经软得拿不住'],how:['开头：定格在船头进水的那一秒，先写水面的凹进去','主体：按做船、放手、翻船、捞帆四个动作还原','深化：这一秒里出错的不是纸，是我放手时的那个高度','结尾：收在我用报纸把船重新糊一遍，让它在盆里浮着'],trap:'别把沉船写成沉重的失败瞬间，重点是那一秒里到底哪一步做错了。',who:['同桌','科学老师','家长']});
BANK.push({id:'K271',t:'《说好第二天交稿，我拖了三天》',g:'rec',d:'setback',c:'promise',e:'guilt',idea:'我答应{对手}帮她改校刊的稿子，第二天她说再给我一天；第三天她自己去交了，我到现在也没说我那三天在干什么。',mat:['她把稿子递过来时说了两次不着急，红笔圈都画好了','我那天在打球，回来看见手机上有两条未读消息','第三天中午她在教室门口跟编辑说稿子已经交了','我把手机扣在桌上，一整个下午没翻过来'],how:['开头：先写她递稿子那两次不着急，语气越轻越好','主体：按答应、拖、中午听见交稿、手机扣着四步走','深化：我不敢说的是，那三天我一直在等一个不用道歉的时机','结尾：收在后来她又给我机会，我先说了日期'],trap:'别写成我后来补偿了才算完整，重点是她没追问我为什么拖。',who:['对手','校刊老师','同桌']});
BANK.push({id:'K272',t:'《父亲修了一夜的旧座钟》',g:'rec',d:'setback',c:'secret',e:'admire',idea:'父亲从旧货市场买回一只座钟，摆了两天就不走了；他在工作台前修了一夜，第二天早上钟摆重新摆起来，声音比原来还响。',mat:['座钟外壳有一道裂纹，卖家说还能走','工具摊在餐桌上，螺丝刀、镊子、一个小磁铁','他把后盖拆下来摆在报纸上，报纸上印的日期很清楚','修完他先上了发条，钟摆在客厅里摆得很稳'],how:['开头：从座钟不走了写起，让那道裂纹成为一个小悬念','主体：按买回、拆后盖、报纸上排零件、上发条四段写','深化：他修的不是钟，是想让我相信坏掉的东西还有救','结尾：收在钟摆重新摆动那一下，以及我把它放在书柜上的位置'],trap:'别把结尾写成父爱主题的空话，收在钟摆的声音和它现在的位置更实。',who:['爸爸','同桌','邻居阿姨']});
BANK.push({id:'K273',t:'《他说他跑最后一名也没关系》',g:'rec',d:'setback',c:'crowd',e:'admire',idea:'一千米测试我跑了最后一名，前面的人陆续到终点，有人递给我一瓶水；他说他每次都跑最后一名，我才知道那不是没力气。',mat:['终点处有人拿着水瓶，一排排站在跑道外侧','他跑完最后一个弯道，脸不红，还在慢慢走','我说我跑得太慢了，他说那也挺好的','他把水瓶递过来时，瓶身上全是汗'],how:['开头：先写终点那一排拿着水瓶的人，别急着写结果','主体：按递水、他的回答、瓶身的汗、他又说一句还原','深化：佩服的不是他跑得慢，是他把慢跑当成一件正经事','结尾：收在第二天体育课他仍站在最后一排的那个位置'],trap:'别让他说出励志台词，只写他的平常和那句挺好的，越平常越可信。',who:['对手','体育老师','班长']});
BANK.push({id:'K274',t:'《被我折断的那把美术刀》',g:'rec',d:'setback',c:'object',e:'guilt',idea:'素描课要用美术刀，我这学期折断了两个刀尖；第三次我把它藏起来，谎称是别人拿错，那把折断的还夹在书包侧袋里。',mat:['刀刃折断的声音很轻，像指甲剪掉一小片塑料','我用胶布把刀柄缠了两圈，看起来像新的','工具箱里只剩两把完整的，被同学数出过一次','那把折断的我塞在笔袋最下面，尖端朝里'],how:['开头：先写那声很轻的断裂声，让物件承担叙事','主体：按折断、缠胶布、被数出、短了两把的顺序推进','深化：我藏的不是刀，是不想再交一次用坏的工具的心情','结尾：收在美术老师发新刀时我伸手接得很慢'],trap:'别让美术老师发现是谎话，重点写我为了不尴尬而做的三件小事。',who:['美术老师','同桌','家长']});
BANK.push({id:'K275',t:'《演讲比赛我报了三次》',g:'rec',d:'setback',c:'contest',e:'guilt',idea:'演讲比赛我报了三次，第三次还是没进复赛；最后一次我把稿子压得很短，只留了开头和结尾，还是差一点。',mat:['报名表上我的名字写了三次，后面两行是补填的','第一次我讲满了时间，被说内容太满','第二次我把稿子删到只剩一半，还是没进','第三次抽到的题目正好练过，可我讲得太快'],how:['开头：先写报名表上补填的两行字，让三次自然进来','主体：按第一次太满、第二次太短、第三次讲太快三条写','深化：三次的问题各不相同，我却在同一个毛病上翻了三次','结尾：收在我把稿子压短后第一次敢抬头的那一版上'],trap:'别把三次失利总结成一个原因，三条要各自独立才不套路。',who:['语文老师','对手','指导老师']});
BANK.push({id:'K276',t:'《我把她落在教室的书包守了一下午》',g:'rec',d:'setback',c:'change',e:'protect',idea:'她把书包落在教室里，我守了一下午；后来我才想明白，我不是好心，我是不想让那个包被当笑话。',mat:['书包塞在讲台下面，拉链开着，露出半截美术课本','放学铃响过两轮，走廊上的人越来越少','我坐在自己位置上没动，把凳子往讲台那边挪了挪','她回来时先说谢谢，我才发现自己手心全是汗'],how:['开头：先写讲台下的书包和拉链开着这个画面','主体：按铃响、挪凳子、手心出汗、她回来四步还原','深化：守东西其实是守住一个念头，不让人有机会说闲话','结尾：收在她那声谢谢之后，我把凳子推回原位'],trap:'别把结尾写成她看穿了我的好心，人情不要结算。',who:['对手','后桌','班主任']});
BANK.push({id:'K277',t:'《发卷子时那一列分数》',g:'scene',d:'setback',c:'moment',e:'down',idea:'老师把卷子从第一排往下传，纸一张张翻开；我盯着传到我手里的那一张，看见自己那一栏的数字比左边低一截。',mat:['卷子从第一排往后传，每传一张就翻过一个名字','{对手}的分数是九十多，卷角被她自己压着','传到我手里时纸还是热的，边角被前面的手捏出折痕','我把卷子对折了一次，才看清那个数字'],how:['开头：从卷子往后传这个动作写起，写一整个教室的等待','主体：按传卷、压角、传到我手里、对折看清四步推进','深化：分数只是纸上的一个数字，疼的是它和前面的差距','结尾：收在放学后我把卷子重新摊开，数字其实没有变'],trap:'别让同学当场比较分数，教室里那一刻大家都在装作没看。',who:['数学老师','对手','后桌']});
BANK.push({id:'K278',t:'《滑板小车停在半路的那次》',g:'scene',d:'setback',c:'object',e:'insight',idea:'物理课上我们做下坡实验，小车冲到斜坡中间就停住了；我后来才发现，是前轮的轴承里卡了一颗沙。',mat:['斜坡是木板加两块砖搭的，坡面上画了一道粉笔线','小车停在粉笔线上，前轮还在微微转','我把它倒过来抖，掉出两颗细沙和一小片纸屑','第二次它冲过了终点线，全组都叫了一声'],how:['开头：先写那个停住的画面和周围人的反应','主体：按停住、倒过来抖、找到沙、第二次冲线的顺序','深化：一颗沙决定成败不是运气，是没人想过小车会停下来','结尾：收在我把那两颗沙放在草稿纸上留着，到现在还在'],trap:'别把结尾写成努力就有回报的结论，重点是那颗沙和检查这一步。',who:['同桌','物理老师','科学老师']});
BANK.push({id:'K279',t:'《颁奖台边上看别人举牌》',g:'scene',d:'setback',c:'crowd',e:'plain',idea:'领奖那天我站在台下第三排，看前面的人举牌、拍照、握手；我的项目在前一天就被刷下来，位置我早知道。',mat:['台上的牌子是硬纸板做的，边角被手汗磨软了','主持人念名字的顺序我在台下先排了一遍','我口袋里那张号码纸一直没拿出来','拍完照人群散开，我在原地站着没动'],how:['开头：从硬纸板牌子这个细节进入，不急着写我的失落','主体：按念名字、看举牌、拍合影、人群散开四步写','深化：真正难受的不是没拿奖，是我在第三个位置就数清了流程','结尾：收在我把那张没拿出来的号码纸塞回口袋的动作'],trap:'别写羡慕别人，重点写我提前知道顺序这件事带来的钝感。',who:['对手','体育老师','同班同学']});
BANK.push({id:'K280',t:'《第二次上台时手心的汗》',g:'scene',d:'setback',c:'change',e:'warm',idea:'隔了两周我又站到同一个位置，手心全是汗，稿子被捏得发软；那一次我把稿子念完了，中间停了一次。',mat:['上台前我在后台擦了三遍手，纸巾都湿透了','稿子第四段有一处，我临时改了结尾','停的那一次大概有两秒，我听见自己的呼吸','念完台下有人举手，是{对手}第一个'],how:['开头：写后台擦手这个动作，让紧张有实物可抓','主体：按擦手、临时改结尾、停住、念完的顺序还原','深化：和第一次比，变的不是我，是我敢停那两秒','结尾：收在下台后{对手}递来的那张纸巾，我说了两次谢谢'],trap:'别让第二次变成圆满的成功，重点是中间停住的两秒和手心的汗。',who:['对手','语文老师','班长']});
BANK.push({id:'K281',t:'《如果那次我没有跑完八百米》',g:'imagine',d:'setback',c:'journey',e:'insight',idea:'我想过很多遍，如果第一圈就停下会怎样；八百米只有慢下来才跑得完，这个道理我是后来在别的场子里才懂的。',mat:['第一圈我按前一个人的速度跑，脚下发飘','跑到第四圈时我听见有人在终点按计时器','剩下两圈我改成跟着自己的呼吸','后来我在别的比赛里懂了同一件事，没写在成绩单上'],how:['开头：先把这个假设说清楚，说我没做过的那个选择','主体：按第一圈、第四圈、改呼吸、后来懂了四段写','深化：设想不是后悔，是把当时看不懂的东西放到今天重看一遍','结尾：收在今天有人问我快不快，我说我按自己的呼吸'],trap:'别让想象变成幻想，四个画面都要从那一场真比赛里取。',who:['对手','体育老师','同桌']});
BANK.push({id:'K282',t:'《十年后我还会想起那条塑胶跑道》',g:'imagine',d:'setback',c:'change',e:'plain',idea:'设想十年后我路过一个中学操场，红色塑胶还在；如果那时有人问我第一次跑步是什么，我大概只会说鞋带太紧。',mat:['现在的跑道一共四条，最外一条的红已经褪成粉','我想的是十年后这里的树会更高','那天的号码布是别人替我领的，我一直没还','现在跑道边上停的是共享单车，不再是自行车'],how:['开头：先站在现在的操场，把看到的写实','主体：按褪色的跑道、树、号码布、共享单车四样写','深化：想象的作用不是抒情，是看清今天哪样东西最容易消失','结尾：收在鞋带太紧这个还在的细节上，作为全部想象的落点'],trap:'别写成对未来的长叹，四样实物必须都在场。',who:null});
BANK.push({id:'K283',t:'《失败不该写成励志》',g:'argue',d:'setback',c:'contest',e:'insight',idea:'作文里写失败最容易滑向失败让我懂得坚持；我想说的是，一次失败要写清哪一步做错了、后来改了什么，没有这两句就是空话。',mat:['班里有不少作文都以失败开头，以坚持结尾','坚持这个词出现一次，具体的动作就少一层','一篇立得住的作文应该能看出时间、动作和代价','我自己的第一篇作文就是靠两句坚持撑起来的'],how:['开头：从班里的作文现象出发，指出问题出在哪','主体：按现象、原因、三个标准、我的例子四层推进','深化：写失败要写出可检验的部分，读者才能判断真假','结尾：收在一句可以操作的判断上，比如有没有改了什么'],trap:'别把这篇写成评论腔，每一段都要落回一个具体例子。',who:['语文老师','同桌','班长']});
BANK.push({id:'K284',t:'《那句下次吧怎么接》',g:'argue',d:'setback',c:'word',e:'curio',idea:'输了一场比赛，有人说下次吧；我以前会点点头，现在我想弄清楚这三个字到底是在安慰，还是真的还有下次。',mat:['说这话的是我们班长，他那次也只拿第三名','我把下次吧写在草稿本上，旁边画了一个问号','后来我真的报了同一个项目，还是第三名','他听说后什么也没说，只把成绩单递给我看'],how:['开头：先把那句下次吧单独引出来，放在它被说出的位置','主体：按说话的人、我的疑问、第二次参赛、递成绩单写','深化：同一句话对不同的人意思不一样，重点在它到底指什么','结尾：收在我把成绩单折起来放进抽屉这个动作上'],trap:'别急着给出答案，结尾要保留那三个字仍然含糊的状态。',who:['对手','班长','体育老师']});
BANK.push({id:'K285',t:'《把一次失败拆成三步改》',g:'apply',d:'setback',c:'object',e:'insight',idea:'一场失败要能变成下一次的动作，我把它拆成三步：写下哪一步错了、这次只改哪一个动作、下次用什么证据判断改好了。',mat:['第一步只看时间点，不看理由，理由每次都会变','第二步只许改一个动作，改三个等于没改','第三步的证据要能看见，比如跑表或卷面的批改','我用这个办法改过两次跳绳和一次默写'],how:['开头：先提出三步这个做法，说明它只适用于一次具体失败','主体：按三步分别解释，每一步配一句操作说明','深化：一次只改一个动作，是这套做法能用的关键','结尾：收在证据那一步，给出一个能自己判断的标准'],trap:'别把方法写成励志清单，每一步都必须能在纸面上做出来。',who:['体育老师','同桌','家长']});
BANK.push({id:'K286',t:'《被退回的稿子怎么改》',g:'apply',d:'setback',c:'promise',e:'curio',idea:'稿子被退回不要整篇重写，先照着批语只改一处；我按这个办法把三次退回改成了两次通过，改前改后两稿能对齐。',mat:['批语写没有细节，我先只加一处看得见的东西','第二次被退时批语变成了重写，我加的那处留下了','我把改前改后的稿子放在一起，纸边能对齐','现在我的草稿纸第一行先写这次只改哪一处'],how:['开头：先讲清为什么不整篇重写，再给出办法','主体：按只改一处、批语变化、两稿对照三步操作','深化：一次只改一处，才看得清哪一处真的有用','结尾：收在草稿纸第一行那句只改哪一处上'],trap:'别把办法写成通用写作技巧，必须和批语、退回的具体情况绑在一起。',who:['语文老师','同桌','校刊老师']});
BANK.push({id:'K287',t:'《窗台上那盆没开过花的文竹》',g:'rec',d:'nature',c:'object',e:'down',idea:'文竹养在窗台上两年，枝子长到四十厘米，一次花也没开过；今年三月新梢有点发黄，我把最长的那根剪了。',mat:['盆是去年春天换的旧陶盆，底下垫着两块碎瓦','枝子细得能绕住食指，向上分成好几股','三月里新梢发黄，我用指甲掐了一下还是软的','剪下的那根放在窗台上晒着，两天就干了'],how:['开头：从那盆两年没开花的文竹写起，先交代它的高度','主体：按换盆、掐新梢、剪掉最长的那根三步还原','深化：没开花不是养坏了，是它需要的光和我给的不一样','结尾：收在窗台上那根干掉的细枝上，说明我为什么留着'],trap:'别把它写成有意义的等待，重点是掐一下、晒两天这些能观察到的动作。',who:['妈妈','同桌','花店老板']});
BANK.push({id:'K288',t:'《梅雨停下来的那十分钟》',g:'rec',d:'nature',c:'moment',e:'curio',idea:'梅雨天最难缠的是停下来的那十分钟，屋里忽然安静，墙角的味道就冒出来；我每次都趁这十分钟去开窗。',mat:['雨停后阳台上的水滴顺着栏杆往下排，一条一条','楼下车声传上来，湿路面吸掉了喇叭的回声','墙角那块印子的颜色比周围深，边缘有点发软','窗推开后风是凉的，带着一股土和叶子的味'],how:['开头：先把梅雨天的声音写足，再让安静突然出现','主体：按滴水、车声、墙角印子、开窗四样顺序推进','深化：难的不是雨天，是雨停之后那段没有声音的时间','结尾：收在开窗后那股凉风上，落在能闻见的味道上'],trap:'别只写雨多，重点写停雨那十分钟里墙和声音的变化。',who:['妈妈','后桌','邻居阿姨']});
BANK.push({id:'K289',t:'《从菜场走到河边的那十分钟》',g:'rec',d:'nature',c:'journey',e:'admire',idea:'买完菜我不坐车，从小区外的菜场走到河边再折回来；那十分钟里有人遛狗，有人练琴，河边的柳条已经全绿了。',mat:['菜场出来要过一个红绿灯，路口修车的老李在打气','河边有一段石阶被晒得发烫，坐上去屁股烫','柳条垂到水面上，风一过就划开一道','折回来时菜袋里的豆腐晃了一路，袋底没有破'],how:['开头：先交代这条路有多短，短到不值得为它坐车','主体：按红绿灯、石阶、柳条三样写路上的停顿','深化：值得写的是路上那些别人的日常，不是河边风景本身','结尾：收在豆腐没破这个结尾，把日常拉回买菜这件事上'],trap:'别把这条路写成散文式漫步，路上的具体人和物要占主要篇幅。',who:['对手','邻居阿姨','修车的师傅']});
BANK.push({id:'K290',t:'《樟树在那一周里落了一地》',g:'rec',d:'nature',c:'change',e:'warm',idea:'小区那棵樟树半个月里从浓绿变成稀薄，落叶铺满花坛；我妈每天扫，我每天踩，最后我们都不扫了。',mat:['落叶是一层浅褐，踩上去没有一点声音','花坛边上积了厚厚一条，被风吹成一小堆','我妈扫完一圈，扫帚经过的地方露出红砖','最下面的枝上叶子还很密，颜色比上面深'],how:['开头：用落了一地这个数量开头，把地面写清楚','主体：按落叶颜色、我妈扫、我踩、楼上还绿四段推进','深化：落叶不是结束，树把最外层让出来，好让底下过冬','结尾：收在上个月同一棵树的两张照片上，前后各拍了一张'],trap:'别抒情写成告别，重点是颜色、厚度和扫帚露出的那块砖。',who:['妈妈','后桌','小区保安']});
BANK.push({id:'K291',t:'《蚂蚁搬家和下雨没有关系》',g:'rec',d:'nature',c:'mis',e:'insight',idea:'我一直以为蚂蚁搬家是要下雨，观察了三天；第四天大晴我才明白，它们搬的是晒得太干的粮食，和天气无关。',mat:['队伍沿着阳台砖缝走了半米，中间断了两次又接上','我在旁边撒了一小撮饼干屑，队伍拐了个弯','三天里我记了两次搬走的数量，一次四十几只','第四天上午是大太阳，蚂蚁反而搬得更急'],how:['开头：先写我从小听来的那句话，制造一个要验证的前提','主体：按观察、撒饼干屑、数数量、对照天气四步推进','深化：错的不只是说法，是我从来没有想过要验证它','结尾：收在那张记数量的本子上，现在翻出来看很有意思'],trap:'别把观察写成科普，重点是我数过的数量和被纠正的那一刻。',who:['同桌','科学老师','妈妈']});
BANK.push({id:'K292',t:'《母亲每天多浇的那半盆水》',g:'rec',d:'nature',c:'secret',e:'protect',idea:'阳台上有盆没人管的吊兰，我妈每天往里倒半盆水，说是顺手；其实那是父亲走之前留下的一盆。',mat:['吊兰的塑料盆沿裂了一道，水一直往外渗','她每次倒完把盆转半圈，让裂口朝墙那边','有一天下雨她还是倒了，站在阳台门口看了一会儿','我搬过一次这盆，她当天晚上又搬回原处'],how:['开头：从那半盆水写起，让这个动作显得毫无必要','主体：按倒水、转盆、下雨还倒、我搬被搬回四段写','深化：她浇的不是花，是一个谁也不肯先扔掉的东西','结尾：收在那盆吊兰现在长出的新条上'],trap:'别把父亲的事说破，秘密的重量就在于家里没有人挑明它。',who:['妈妈','后桌','奶奶']});
BANK.push({id:'K293',t:'《第一次在屋檐下看见一只蜜蜂》',g:'rec',d:'nature',c:'first',e:'curio',idea:'初二那年暑假我在屋檐下看见一只落在大豆花上的蜜蜂，看了两分钟它还在原地，后来才知道它是在采蜜。',mat:['大豆是外婆留的种，花只有指甲盖那么大','蜜蜂停住不动的时候翅膀在抖，我以为是坏了','我屏住呼吸站着，腿麻了也没敢动','隔壁的窗开了，有人喊我去写作业，我才想起过了两分钟'],how:['开头：直接切入我蹲在屋檐下的姿势，不要铺垫','主体：按看见、静止、屏息、被喊四步写完那两分钟','深化：第一次的收获只是知道静止不等于没在做事','结尾：收在第二天同一个位置它还在那里，把记忆延长一天'],trap:'别加大人式的感悟，结尾要停在蜜蜂第二天还在那里。',who:['妹妹','外婆','同桌']});
BANK.push({id:'K294',t:'《外婆说的那句蚂蚁搬家》',g:'rec',d:'nature',c:'word',e:'warm',idea:'外婆说蚂蚁搬家蛇过道，大雨就要到；我小时候信到画在本子上，现在我把这句话和奶奶晾衣服的姿势一起留着。',mat:['外婆说这句话时手里总在搓着竹扫帚','她判断下雨从来不看天，先看蚂蚁往高处搬','我在本子封面上抄过这句话，还画了一条虫','她晾衣服也看蚂蚁，晾之前先看一趟阳台地面'],how:['开头：先把外婆的原话一字不改地引出来','主体：按她说话时的动作、她的判断依据、我抄在本子上三段','深化：这句话准不准不重要，重要的是她有一整套看天气的办法','结尾：收在现在下雨前我也下意识看一眼阳台这个动作上'],trap:'别去论证这句话对不对，重点是外婆判断天气的那套动作。',who:['外婆','妈妈','同桌']});
BANK.push({id:'K295',t:'《早市的天光是从东边开始的》',g:'rec',d:'nature',c:'crowd',e:'plain',idea:'早市的天光是从东边一点点铺过来的，最早的一批摊主在光里先开工；我七点二十到的时候，整条街已经醒了。',mat:['第一个亮的是卖豆浆的摊，锅盖一掀全是白气','摊主把纸箱折平，塑料布抖开，抖出的水落在地上','买菜的人不多，但每个人都不着急，看得很细','我到的时候第一位阿姨已经挑完了一筐青菜'],how:['开头：把光线本身当主角，写它怎么一点点铺过街面','主体：按白气、抖塑料布、看菜、挑完一筐四段写','深化：写一个地方的早上靠的是活儿，不是风景','结尾：收在我离开时地上那摊还没干的水迹上'],trap:'别只写光线柔美，人和货的动作要占掉一半篇幅。',who:['菜场阿姨','对手','奶奶']});
BANK.push({id:'K296',t:'《被台风打翻的那盆薄荷》',g:'rec',d:'nature',c:'object',e:'protect',idea:'台风前一天我把薄荷搬进屋，忘了把花盆从阳台架上拿下来；风停后整盆土都倒在地上，根还活着。',mat:['阳台架是铁的，风大时整排盆栽一起晃','泥土从盆口流出来，在地板上堆成一小堆','断掉的枝只有两根，主干还是绿的，我把断口剪齐','后来它重新发了两棵，盆我换成了没有孔的塑料盒'],how:['开头：先写台风前的准备，把那份周全交代清楚','主体：按移盆、忘拿、倒土、剪断枝四步推进','深化：错的不是照顾，是照顾得太多而没记住最要紧的一件','结尾：收在换成塑料盒这个动作上，写我怎么想通的'],trap:'别把台风夜写得惊险，重点是准备和遗漏之间的那一点差别。',who:['妈妈','后桌','小区物业']});
BANK.push({id:'K297',t:'《日落前十分钟，墙先变黄》',g:'rec',d:'nature',c:'moment',e:'warm',idea:'日落前十分钟，对面那面楼墙会先变成很浅的黄；我们家阳台也一样，这个先后顺序我发现了很多年。',mat:['墙先黄，然后是晾衣杆的影子斜到防盗窗上','黄持续很短，几分钟后就成了一种偏灰的暗','隔壁阳台的花盆在黄光里只剩一个轮廓','那十分钟里我家不开灯，各做各的事'],how:['开头：直接写墙变黄这个变化，把时间卡在前十分钟','主体：按墙、晾衣杆、花盆、屋里不开灯四样写','深化：看得久了，最有意思的是先后顺序，不是颜色本身','结尾：收在今天我特意站在阳台把十分钟看完'],trap:'别把日落写成大场面，重点是颜色的先后和持续的时间。',who:['妈妈','同桌','邻居阿姨']});
BANK.push({id:'K298',t:'《塑料瓶从阳台到河边的七天》',g:'rec',d:'nature',c:'journey',e:'insight',idea:'我丢掉的塑料瓶走了七天：先滚到楼道，再被风带到河岸；第七天它挂在河边一棵树的枝上，瓶口朝下。',mat:['瓶子从阳台掉下去，在水泥地上弹了三下','第二天它在楼道口被风吹倒，风是朝河那边的','我在河边找它时，看见它在芦苇里换了位置','第七天它挂在离地两米的枝上，瓶口朝下'],how:['开头：先写瓶子掉下去那三下，声音要具体','主体：按弹落、楼道、芦苇、挂上枝四段串起这七天','深化：写路径不如写观察，逐日看它去了哪里比我捡走它有用','结尾：收在我把第七天的位置记进手机备忘录这个动作上'],trap:'别写成环保口号，路径要一天一段，读者跟着能走一遍。',who:['同桌','小区保洁阿姨','语文老师']});
BANK.push({id:'K299',t:'《隔壁小区砍掉的那棵樟树》',g:'rec',d:'nature',c:'change',e:'down',idea:'隔壁小区那棵樟树被砍了，树桩留在原地；第二年春天那里铺了新草坪，我路过时会下意识去找那团深绿。',mat:['砍之前他们先围了绳子，校服小孩趴在绳子外面看','砍倒时树冠压到一辆电瓶车，师傅挪了两次','树桩直径比课桌大，切面一圈一圈很干净','现在那里是平草坪，只剩一个圆形的浅坑'],how:['开头：从绳子围起来这件事写起，制造一种被拦在外面的感觉','主体：按围观、砍倒、切面、铺草四段推进','深化：难受的是树没了而草坪很好，所以更说不出口','结尾：收在我还在找那团深绿这个已经变成习惯的动作上'],trap:'别写成环保义愤，重点放在围观者和切面这类没人注意的细节。',who:['对手','小区保安','语文老师']});
BANK.push({id:'K300',t:'《麻雀的叫声不是要下雨》',g:'rec',d:'nature',c:'mis',e:'plain',idea:'我一直把麻雀连叫当作下雨的前兆，为它记过一年的笔记；后来发现那几天正是它们抢晒谷子的季节。',mat:['我把麻雀记在一张台历的背面，画着短线和箭头','叫得最凶的那几个中午，楼下正好在翻晒谷子','有一年台风天麻雀叫得更响，之后什么也没来','现在听到成片的叫声，我第一反应是先看楼下'],how:['开头：先写那本记在台历背面的笔记，交代我记了多久','主体：按叫声、翻晒谷子、台风天、现在四段对照','深化：错的不是观察，是我只记了现象没有比对别的事','结尾：收在台历背面那页笔记上，最后一行没有结论'],trap:'别急着宣布麻雀和天气无关，重点写我没做的那一次比对。',who:['同桌','奶奶','科学老师']});
BANK.push({id:'K301',t:'《父亲藏在杂物间的旧树桩》',g:'rec',d:'nature',c:'secret',e:'curio',idea:'杂物间最里面有一个用布包着的树桩，父亲说是老家院里的；我掀开布看了一角，又给它盖了回去。',mat:['布是旧床单改的，四角用尼龙绳扎着','树桩顶是一圈年轮，数得清的有十几圈','边缘凿掉了一小块，断面上有一点青苔的印子','杂物间还有他的旧锯子和半瓶桐油，都没扔'],how:['开头：先写布和绳子这个包装，别急着揭内容','主体：按掀布、看年轮、盖回去三步写完','深化：秘密的分量在于我只看了一角，就选择不再看','结尾：收在我把布角按回原样这个动作上'],trap:'别让父亲在场解释，树桩不说话，父亲也不说破。',who:['爸爸','妈妈','后桌']});
BANK.push({id:'K302',t:'《第一次在乡下淋一场竹林的雨》',g:'rec',d:'nature',c:'first',e:'admire',idea:'暑假第一次在乡下淋竹林里的雨，雨点打在叶子上是一层细响；我站着没动，等雨从后背走到肩膀。',mat:['竹林里没有伞，地面铺着去年的落叶，踩上去很软','雨点打在竹叶上是连成一片的沙声','衣服湿了一半，另一半还是干的，走动就感觉到那条线','山里的雨停得慢，停的时候先一滴一滴，然后整片竹子同时响'],how:['开头：先写林子里没有伞这件事，再让人站进去','主体：按落叶、沙声、湿到哪里、雨停的过程四段写','深化：值得佩服的不是雨，是等雨的人不着急走','结尾：收在我被淋透后外婆递来的那条干毛巾上'],trap:'别把雨当成抒情背景，重点是声音和湿与干的分界线。',who:['外婆','同桌','表哥']});
BANK.push({id:'K303',t:'《答应弟弟把花搬进来》',g:'rec',d:'nature',c:'promise',e:'guilt',idea:'台风前一天我答应弟弟把阳台的花全搬进屋，搬了三盆就去看球；第二天第四盆碎了，他没哭，只把碎片扫到角落。',mat:['四盆花摆在阳台的架子上，最高的那盆是薄荷','我搬到第三盆时球赛开始了，我把卷帘门拉下一半','碎片散在架子下面，最大的那片有巴掌那么大','他蹲下扫碎片时问我能不能留一片夹在书里'],how:['开头：先写那个承诺和我说得很随口的语气','主体：按搬三盆、去看球、碎片、他扫四步还原','深化：错不在忘搬，在我以为明天还来得及','结尾：收在他要那片碎片夹进书里的动作上'],trap:'别让弟弟哭着责怪，重点是他蹲下扫碎片和后来那句话。',who:['弟弟','对手','妈妈']});
BANK.push({id:'K304',t:'《菜场阿姨说的这条鱼刚到》',g:'rec',d:'nature',c:'word',e:'insight',idea:'阿姨说这条鱼刚到，鳞还亮着；我买回去清蒸，火开大了，端上桌时鱼肉是发柴的，我到现在还记得那句话。',mat:['鱼装在黑色塑料袋里，眼睛还有一点光','阿姨拍了一下鱼身，说刚到的时候声音是紧的','我清蒸时火开大了，鱼皮先焦了一小块','筷子一夹就散开，肉和刺分了家'],how:['开头：先把那句刚到放在买鱼的时候，位置要准','主体：按鱼的样子、拍的声响、火太大、肉发柴四步写','深化：识别新鲜要靠眼睛和手，不能只靠一句好话','结尾：收在下次买鱼我会先看鳞片这个具体改变上'],trap:'别把这篇写成被骗的抱怨，重点是那些本可以自己看的证据。',who:['菜场阿姨','妈妈','同桌']});
BANK.push({id:'K305',t:'《晒谷子的老人不赶麻雀》',g:'rec',d:'nature',c:'crowd',e:'admire',idea:'楼下老人在水泥地上晒谷子，麻雀落上去就啄，她扫一下它们散开，过一会儿又飞回来；她从不抬头去赶。',mat:['谷子摊成一个不规则的圆，中间厚、边上薄','她手里是竹扫帚，扫的幅度很小，不越过摊子中间','麻雀落下来时先在边缘试探，再往中间挤','她只是把扫帚横着慢慢扫，扫完接着坐回小凳上'],how:['开头：从谷子摊开的形状写起，让画面先立住','主体：按试探、啄、扫、散、再回来五个动作往复写','深化：她赶不动也不生气，这份从容比收走谷子更难得','结尾：收在第二次路过时她还是那个坐姿上'],trap:'别把人和鸟写成对抗，重点写扫帚幅度小和麻雀反复回来的耐心。',who:['奶奶','对手','小区保安']});
BANK.push({id:'K306',t:'《我折的那根河边柳枝》',g:'rec',d:'nature',c:'object',e:'guilt',idea:'河边那排柳树垂到栏杆上，我伸手折了一根好看的带回去；插在瓶里三天就全黄了，我把它扔了。',mat:['枝上叶子已经展开一半，是最嫩的那一段绿色','折的时候很轻，一下就下来了，没有声音','插进水笔筒里，第二天瓶口有一点黏','第三天我把它抽出来，叶子全朝下垂着'],how:['开头：先写河边那排柳树和垂到栏杆上的高度','主体：按折、插、变黄、扔掉四步写','深化：带走的那一刻很好看，插进水里的每一天都在失去','结尾：收在河边那根枝原来的位置已经补不上这个事实上'],trap:'别让旁边的人来指责，重点是我自己看着它一天天变黄。',who:['对手','奶奶','语文老师']});
BANK.push({id:'K307',t:'《阳台风铃响了三次》',g:'scene',d:'nature',c:'object',e:'curio',idea:'那只挂在阳台上的风铃一天里响了三次，分别是邻居收衣服、货车过桥和我关门；我开始记这三种声音的区别。',mat:['风铃是铝的，两片叶一撞，声音短得像敲了一下碗','第一次响时邻居在收被子，被子角甩到了晾衣绳外','第二次响是桥上过了一辆大车，声音跟着车身过去','第三次响是我自己关门，门轴有点响，风铃跟着抖了一下'],how:['开头：先把风铃这个物件拆开，写清它是怎么响的','主体：按三次响分别对应三个人和三件事来写','深化：好奇心落在一个小物件上，也需要长时间地记','结尾：收在今天它只响了一次，我没有找到对应的那件事'],trap:'三次要有三种不同的声音质感，混成一片就散了。',who:['对手','邻居阿姨','妈妈']});
BANK.push({id:'K308',t:'《台风夜窗玻璃上的水痕》',g:'scene',d:'nature',c:'moment',e:'insight',idea:'台风夜我没关严窗，玻璃外侧的水顺着往下走；水痕把外面的路灯拉成一条斜线，看了很久才发现它在动。',mat:['窗缝在右上方，风从那里挤进来，声音很细','水痕里的路灯被拉长，斜着挂到玻璃中间','每一阵风过，水就往下挪一截，路灯跟着变形','我把手掌贴在玻璃内侧，外面的水从手边绕过去'],how:['开头：先写水痕把灯拉成斜线这个画面，静止的','主体：按窗缝、斜线、每阵风挪一截、手掌隔开四步写','深化：真正让人记住的是发现它在动的那一下，不是台风多可怕','结尾：收在天亮后水痕已经干透，只剩一道白印'],trap:'别渲染台风的可怕，重点是光被水拉长和缓慢移动的观察。',who:['爸爸','妈妈','后桌']});
BANK.push({id:'K309',t:'《返潮天早上晾的衣服》',g:'scene',d:'nature',c:'crowd',e:'plain',idea:'返潮天的早上，阳台所有人都在抢位置：被子往里挪，衣服往里塞，最后一格永远抢不到。',mat:['阳台栏杆上挂的衣架一个挨一个，中间的缝已经没有了','靠墙那几件颜色深，摸上去是凉的','楼下有人在喊谁家的衣服收一下，滴到楼下了','中午我去看，那件深色的已经能拧出水'],how:['开头：从抢位置这个动作开场，一句话带出返潮','主体：按挤、摸凉、楼下喊、中午拧出水四步写','深化：返潮天晾衣服是无效劳动，这一点必须写出来','结尾：收在我把那一件收进来挂在门背后的选择上'],trap:'别写成抱怨天气，重点是位置怎么抢和衣服从凉到能拧出水。',who:['妈妈','后桌','邻居阿姨']});
BANK.push({id:'K310',t:'《最美人居评比那天的阳台》',g:'scene',d:'nature',c:'contest',e:'warm',idea:'居委会评最美人居，我们这幢楼的阳台挂了红花；那张贴在楼下的红纸贴在晾衣绳旁边，比花还显眼。',mat:['红纸用双面胶贴的，四角还卷着一点没压实','楼道墙上贴了七张，阳台按户算，露台另外加分','我们家的阳台上晾着床单，被子挡了一半','隔壁那户摆了三盆花，还挂了小风铃'],how:['开头：先写红纸贴在哪，别急着写得了奖','主体：按张贴方式、怎么算、我们家阳台、隔壁三盆花来写','深化：评比那天大家才第一次认真看彼此的阳台','结尾：收在红纸被雨泡糊、卷下来的那个早上'],trap:'别写成炫耀，重点是评比前后大家看阳台的态度变化。',who:['居委会阿姨','对手','妈妈']});
BANK.push({id:'K311',t:'《傍晚河边那排柳树的剪影》',g:'scene',d:'nature',c:'journey',e:'insight',idea:'从小区门口走到河边要十五分钟；傍晚那排柳树变成一排黑影，桥下的水比树先暗下来。',mat:['走到桥上时太阳正好在河对岸那栋楼后面','柳树的影子先落在水面上，是一排晃动的竖线','桥栏被晒了一整天，摸上去还是温的','回头看小区那一排路灯刚亮，还没有人在下面'],how:['开头：用十五分钟这个长度开头，说明这是常走的路','主体：按太阳、影子、桥栏、回头看路灯四步推进','深化：景物变化的顺序很重要，谁先暗说明光从哪边来','结尾：收在今天我提前十分钟出门看到的同一段河上'],trap:'别把傍晚写成一幅画，重点写光消失的先后顺序。',who:['对手','妈妈','奶奶']});
BANK.push({id:'K312',t:'《雨停后樟树叶上的水珠》',g:'scene',d:'nature',c:'moment',e:'curio',idea:'雨停之后樟树叶上的水珠会慢慢往叶尖挪；我盯着一颗看了大概半分钟，它一直没掉下来。',mat:['水珠不是圆的，是被叶脉压成扁扁的一小片','风一来，整片叶子上几十颗水珠同时晃','阳光一出来，水珠里出现一个很小的亮点','有一颗终于掉了，正好落在花坛的土上，没有声音'],how:['开头：先写水珠的形状，别急着写等待','主体：按形状、风、阳光、掉落四段写','深化：好奇心在小事上才成立，盯住半分钟就是全部动作','结尾：收在那颗掉进土里的水珠上，落在没有声音这个细节'],trap:'别写成比喻句的堆叠，观察要停在一个具体动作上。',who:['同桌','科学老师','妹妹']});
BANK.push({id:'K313',t:'《如果这棵樟树能说话》',g:'imagine',d:'nature',c:'journey',e:'insight',idea:'我设想这棵樟树在小区里活了三十年；如果它能说话，它大概只讲三件事：根、影子，还有被撞过的那一次。',mat:['它在这块地里的第三年，胸径就有碗口那么粗','树根顶起过两处地砖，物业又给它铺回去','它的影子在东墙上完整，在西墙上会缺一截','去年冬天有人在根部堆过盐，它掉了两圈树皮'],how:['开头：先把设想的边界说清，是这棵三十年的樟树','主体：按根、影子、伤三件事分开写，每件给一个实据','深化：想象要由实物长出来，不能凭空抒情','结尾：收在我今天抬头看了它一眼这个现实动作上'],trap:'每一件想象都要落到具体实物，否则就变成拟人作文套路。',who:['语文老师','对手','小区保安']});
BANK.push({id:'K314',t:'《假如梅雨季只有三天》',g:'imagine',d:'nature',c:'change',e:'down',idea:'我设想梅雨季只有三天，第三天早上必须出太阳；如果真这样，家里的霉味大概来不及长出来，墙也不用刷第二遍。',mat:['现在家里的除湿盒两个月换一个，一个明显不够用','墙角那块印子去年刷过两次，今年又发软','衣服三天不能干，只能靠电扇和空调轮着吹','我把这三天按小时排了一遍，哪天晾哪件都写好了'],how:['开头：先把三天这个限制说清楚，它让一切变得紧张','主体：按除湿盒、墙、晾衣、我的安排四段写','深化：设定越具体，想象越有用，虚泛的天气会拖垮全文','结尾：收在最后一行写着明天几点开窗的那张纸上'],trap:'别让设定漏掉现实细节，梅雨天真正卡人的是湿度和晾衣。',who:['妈妈','语文老师','同桌']});
BANK.push({id:'K315',t:'《桂花该留还是该砍》',g:'argue',d:'nature',c:'object',e:'insight',idea:'小区门口两棵桂花，秋天香气能飘到马路对面；也有人说该砍，理由是掉下来的花会让人打喷嚏。',mat:['花期大概十天，最浓的是夜里和清早','树下是等校车的地方，家长都集中在那一块','掉下来的花混在香樟叶里，扫的时候根本看不出','学校围墙那一侧香气更淡，因为隔着一面砖墙'],how:['开头：从味道的传播范围这个事实进入，不用情绪开头','主体：按花期、树下、落叶、围墙两侧四层写','深化：两种说法各自有依据，先把依据分清再谈留不留','结尾：收在我给出的那个具体条件上，比如只砍靠人行道那一棵'],trap:'别把讨论写成投票，每一边都要有一条能核对的理由。',who:['校门保安','居委会阿姨','对手']});
BANK.push({id:'K316',t:'《小区里该不该继续晒谷子》',g:'argue',d:'nature',c:'contest',e:'curio',idea:'老人们习惯在楼下空地晒谷子，物业说不允许；从粮食那边看是天经地义，从安全那边看也确实有风险。',mat:['空地大概十几平方米，铺的是塑料布和编织袋','晒的时候有人专门坐在旁边看着，也有人不在','下过雨要抢着收，最怕的是没收完就下大了','有一次我帮一位爷爷收谷子，扫出来半簸箕砂'],how:['开头：先把两种立场原样摆出来，不提前判谁对','主体：按面积、看着与否、抢收、砂砾四层给依据','深化：争议的真正地方是那块地的归属，以及安全该怎么管','结尾：收在那半簸箕砂上，说明安全不是空话'],trap:'别急着站队，四条依据里必须有一条是站在反对那一面的。',who:['物业','爷爷','居委会阿姨']});
BANK.push({id:'K317',t:'《梅雨天书柜里的霉味怎么去掉》',g:'apply',d:'nature',c:'secret',e:'protect',idea:'书柜返潮有味道，我用过的办法只有三样：开门柜、风扇对着吹、书之间留缝；最有效的还是把书拿出来晒一次。',mat:['打开柜门时味道最重，是那种潮纸板的味','我把书按高度排了一遍，最下面一层改成竖放','风扇对着吹两天，柜门内侧还是有一层湿印','最后一天太阳出来，我抱了三十多本到走廊晒'],how:['开头：先承认前两个办法不够用，再给出最后那一个','主体：按味道、排书、风扇、晒书四步写清操作','深化：最费力气的一步往往最有效，别把方法写成省力的','结尾：收在抱书时数出的那三十多本上'],trap:'别把办法写成万能妙招，每一步都要写清条件和代价。',who:['语文老师','后桌','妈妈']});
BANK.push({id:'K318',t:'《台风前两天做的阳台清单》',g:'apply',d:'nature',c:'promise',e:'guilt',idea:'我现在有一张台风前的清单，写着收花、收衣、关窗、充电宝四件事；上一次做漏了第四件，插线板泡过水。',mat:['清单写在冰箱门上，字是用磁贴拼起来的','第一项收花要分两次，高的在里侧，外侧先搬','第二项收衣最容易忘，因为有网和被单两批','第四项其实只是把充电宝充满，第四天早上才发现忘了'],how:['开头：先把清单原文列出来，四项一项不漏','主体：按四项分别说明为什么这么排、哪里最容易做漏','深化：清单的作用是把担心变成动作，不是让人安心','结尾：收在这次台风前我把清单念了一遍给家里人听'],trap:'别写成注意事项合集，每项要有可执行的判断标准。',who:['妈妈','对手','物业师傅']});
BANK.push({id:'K319',t:'《驿站门口那只比我高的纸箱》',g:'rec',d:'society',c:'object',e:'warm',idea:'一只高过我的纸箱让我第一次盯住一个陌生人的活法——他量尺寸、压边角、把自己的腰当尺子，比我还认真。',mat:['驿站小哥拿卷尺横着量纸箱宽，量完用记号笔在侧面写下尺寸','他压边角用鞋底来回蹭七下，蹭到纸箱发出脆响才松手','一个破了角的箱他舍不得扔，剪成两只垫在秤脚下面','我问他一天拆多少件，他说两百件，别给我弄错了耽误人家'],how:['开头：写驿站门口那只立着比我高的纸箱，从它在太阳底下慢慢歪下去写起','主体：跟着小哥写量尺寸、压边角、划掉写错的数字三件手上的活','深化：写我原以为这是轻松活，直到看见他剪开破箱当秤脚，还在替别人省东西','结尾：回到那只纸箱，它第二天被拆平压扁，收进三轮车后斗，压出一层薄响'],trap:'容易写成快递行业辛苦的赞歌，通篇夸小哥认真；必须留一处他算错的尺寸和一处他被我问烦了的停顿。',who:['驿站小哥','我','取快递的阿姨']});
