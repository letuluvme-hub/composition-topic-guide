BANK.push({id:'K320',t:'《雨里他把最后一把好伞塞给了我》',g:'rec',d:'society',c:'moment',e:'guilt',idea:'雨里两把伞，三个人都湿了半边肩。我回家路上才明白，被淋湿的不是我，是那句没说出口的谢谢。',mat:['便利店门口的伞架只剩两把，其中一把的伞骨断了一根','那个外卖员把好伞递给我，自己拿断骨伞推车走了两条街','我在车站口看他把塑料袋顶在头上，袋里是带给孩子的一盒饭','晚上我翻出聊天记录，那句路上小心打了三行又删掉'],how:['开头：从雨里伞架只剩两把写起，用数量开场，不写雨大不大','主体：写他把好伞递过来、自己撑断骨伞离开的三十秒，手和雨声分开写','深化：写我当晚三次打字又删除，羞的不是淋湿，是不敢当面说谢谢','结尾：写第二天雨停，伞架重新摆满，那把断骨伞不见了，我绕路去看了一眼'],trap:'容易写成互帮互爱的暖心故事，把外套、名字、热汤全加上去；只准写两把伞和一次没说出口的话。',who:['外卖员','我','便利店店员']});
BANK.push({id:'K321',t:'《取件通知里最短的那句已被替你改好》',g:'rec',d:'society',c:'word',e:'plain',idea:'到货通知最短的那句被所有人改成放驿站，听着是服务，其实是很多人替另一些人做的决定。',mat:['快递柜发来取件码，紧跟着一条提醒说已为您保存至驿站','同桌的爸爸从不看通知，只回两个字放驿站，连取件码都不点','我们班家长群里二十几个人全部只回收到，没有一个人问东西','我妈看到取件码会先看是不是她的鞋，再转发给我外婆'],how:['开头：写手机屏幕弹出的那条取件通知，先抄下原话，再写我改了什么','主体：写家里三个人各自的回法，只回放驿站、先看鞋、再转发','深化：写我翻出母亲转发给外婆那条记录，一家人在同一条通知上各取所需','结尾：写我给外婆回了句收到了，她语音只有三秒，因为她在楼下找纸箱'],trap:'容易变成批评快递员或快递公司的段子；落点必须落在一家三个人对同一条通知的不同处理上。',who:['我','同桌的爸爸','外婆']});
BANK.push({id:'K322',t:'《我随口一句别压扁，他当了三个月》',g:'rec',d:'society',c:'promise',e:'insight',idea:'我随口说过一句别压扁，他当真了三个月，每次把最软的纸箱留给我；承诺原来会悄悄改变一个人的工作顺序。',mat:['我在驿站门口说过一句我拿不动的东西您帮忙留一下，说完就走了','他真给我留了三个月，纸箱拆到底没格子，其它人只能拿带格子的','有一回他为一箱书和一个软纸箱争位置，最后把纸箱搬到自己座位下面','我第三个月才发现这事，一直没敢当面问他是不是还记着'],how:['开头：写我随口说的那句话和当时的语气，强调我一点没当回事','主体：写小哥的执行方式：留最软的、拆到底的、抢座位下面的位置','深化：写我察觉后的犹豫，我怕玩笑让他为难，也怕他觉得我真放在心上','结尾：写他只回一句反正要回站点，然后转身去封另一箱，胶带贴得有点歪'],trap:'容易写成一个快递小哥的暖心故事，人物太完美；必须写出他自己也嫌麻烦的那一瞬间。',who:['驿站小哥','我','等快递的人']});
BANK.push({id:'K323',t:'《工具箱最底下那把没拆过的扳手》',g:'rec',d:'society',c:'secret',e:'curio',idea:'一把崭新的扳手压在工具箱最底层，油纸还没拆。他的手艺全在旧工具上，这把留给现在还没来的手。',mat:['工具箱底层躺着一把新扳手，油纸包着，边角一点磨痕都没有','街坊都说他攒了十几把工具，我数了数，有五把从没派上用场','他只解释过一次，这把留着手小的客人，我们这儿暂时用不上','那把扳手后来被一个学徒借走三天，他每天问一次用完没'],how:['开头：写我蹲在摊前看工具箱，翻到最底层那把还包着油纸的扳手','主体：写数工具、数磨痕、听他解释一次，细节全用数字，不用形容词','深化：写我原以为他舍不得扔旧东西，后来才懂他给手小的人留了一把','结尾：写学徒把扳手还回来，油纸被重新包了一圈，压回最底下的原位'],trap:'容易把老伯写成收藏癖或匠人情怀，抒情过多；落点要落在那把油纸包着的手小专用工具上。',who:['修车老伯','我','借工具的学徒']});
BANK.push({id:'K324',t:'《腾空第三天，那杆秤还挂在空摊位上方》',g:'rec',d:'society',c:'change',e:'plain',idea:'菜场搬走留下碎冰、案板和一杆没人再用的秤。市场搬走不是搬走货架，是搬走几万次称重的手感。',mat:['搬走第三天地上还有没化完的碎冰，化了三天也没人去扫','案板被推在墙角没人要，锯出的痕已经发黑','那杆秤挂在空摊位上方，绳子还在，人却不用它称任何东西','收废品的人把秤当晾衣绳使，秤砣晃在过道中间'],how:['开头：写第三天空菜场的味道，没有鱼腥，只剩冰化完的那点潮气','主体：按碎冰、案板、秤三样写，每样写清它原来的用处和现在的位置','深化：写我站在空摊位前，第一次觉得称重不是用秤，是用了太多年的手','结尾：写我查了新地址，那杆秤的新主人还在用，我这边它挂着，风一吹自己晃'],trap:'容易写成怀旧散文堆老物件，或者干脆痛骂拆改；三个物件各写一句具体用途才不空。',who:['我','收废品的人','卖鱼阿姨']});
BANK.push({id:'K325',t:'《七个人从早坐到天黑，谁也不说算了》',g:'rec',d:'society',c:'crowd',e:'admire',idea:'棋摊上七个人从上午坐到天黑，谁都不肯先认输。他们争的不是输赢，是一整天有人陪着坐的资格。',mat:['早上八点占位的是拄拐的老头，他自带紫砂杯和一块擦棋盘的抹布','一步臭棋惹来三个人研究，谁先动手摆子谁就输了面子','中午没人去买饭，盒饭是家属送来的，放在马扎上凉了没人催','天黑收摊前他们把局面拍照，说是留给明天接着下'],how:['开头：从马扎的摆法写起，四角加正中各一把，先写位置不写人','主体：写八点、十二点、下午四点三个时点，各记一组动作和一句原话','深化：写我以为他们在赌气，直到听见一句留给明天，我才懂那不是输赢','结尾：写第二天他们真的接着下了，棋盘上的局面和照片里一模一样'],trap:'容易写成老有所乐或邻里和睦，把棋摊写成棋牌室；抓住那句留给明天，其余都是陪衬。',who:['拄拐的老头','下棋的人','我']});
BANK.push({id:'K326',t:'《绿灯早变了，那辆车还停着》',g:'rec',d:'society',c:'moment',e:'warm',idea:'一个绿灯只有十几秒，后车一直没按喇叭。喇叭没响，我反而第一次看清了这个路口的人。',mat:['我推车要过斑马线，绿灯剩十几秒，身后那辆车一点没往前动','驾驶座的人把车窗摇下来一点，问我走稳了没有，声音很轻','他身后排了四辆车，没有一辆按喇叭，全挂在空挡上等着','我过完马路回头看，绿灯早就变了，那辆车还停在原位'],how:['开头：写绿灯读秒和我迈不出去的那一步，秒数只出现一次','主体：写车窗摇下来的一角、那句问话、后面四辆车的空挡，不写议论','深化：写我后来明白他不是在等我，是把每一个过街的人都当成人过一下','结尾：写我走回人行道再回头数，那个绿灯没有第二个观众'],trap:'容易写成司机让位的赞歌，把司机夸成好人；重点写等待里发生的具体动作，一句抒情都不要。',who:['司机','我','等红灯的人']});
BANK.push({id:'K327',t:'《小票背面那行铅笔字换了三次》',g:'rec',d:'society',c:'word',e:'curio',idea:'小票背面一行铅笔字写了三年没人擦。他把最要紧的话写在最不起眼的地方，一擦就没了。',mat:['找零的小票背面有铅笔字：这回的芫荽下次别买了，字写得很轻','同一行字换过内容，从缺货写到涨价，字迹一直压得很低','我把这张小票夹进书里半年，没告诉任何人，自己翻过很多遍','后来那行字变成明天要早来，后面还画了一个歪着的惊叹号'],how:['开头：写我拿到小票随手要扔，看见背面有铅笔字，于是翻了过来','主体：按三次找零写三次背面内容的变化，每次只抄一句原话','深化：写我为什么一直留着这张纸，那行字从没写我的名字，也从没要回报','结尾：写我再去买菜，小票上换了一行新字，那张旧的还夹在我书里'],trap:'容易把小票的字解释成店员和我的故事；这行字写的是货和价格，落点必须在货上。',who:['我','收银的店员']});
BANK.push({id:'K328',t:'《陪床第三天我才学会排队》',g:'rec',d:'society',c:'journey',e:'down',idea:'排队不是礼貌，是把最急的事让给别人。我在走廊坐了三天，看见的耐心全写在别人手边那张纸上。',mat:['挂号窗口七点发号，八点队伍已经拐过楼梯口，我排了九十分钟','大爷把号码纸对折再对折，边角磨出毛刺，还按顺序捏在手里','护士台前有人插队，被后面一位阿姨只说了一句他就退了回去','我那次站错了队，白等两小时，把号码纸撕成了四条'],how:['开头：写我排到九十分钟时的脚和手机电量，两样都用数字，不写心情','主体：写四个人各一个动作：对折的纸、被劝退的人、撕纸的患者、站错队的我','深化：写我第三天才懂，排队里的耐心是替别人攒的，不是给自己看的','结尾：写最后一天我把号码纸留在椅背上，下一个人捡起来看了一眼'],trap:'容易把医院写成磨人的地方，抱怨医护或批评管理；只写手上的动作，病和钱一个字都不提。',who:['我','大爷','护士']});
BANK.push({id:'K329',t:'《第一次把伞让出去，我算错了账》',g:'rec',d:'society',c:'first',e:'plain',idea:'第一次让伞我算错了账——到学校才发现两个人都湿了，可我不后悔，只是从此不敢随口说不用。',mat:['那天雨大我只有一把折叠伞，同学在站台上只用书包顶在头上挡','我把伞塞过去就跑了，跑过三棵梧桐才发现自己在大雨里笑','第二天他回我一把新伞，比我原来那把大，伞柄上还贴着价签','两把伞后来同时坏掉，我们谁都没提过那天的事'],how:['开头：从公交站台上的雨和书包顶上那块塑料布写起，只写雨声','主体：写塞伞、跑开、三棵梧桐、雨里笑，四个动作全用短句','深化：写第二天那把带价签的新伞，让出去的东西会变形，会比原来的大','结尾：写两把伞坏在同一个月，我们再没提，只在楼梯口站着等雨停'],trap:'容易把让伞写成套路化的好人好事；落点在那张没撕的价签和两个人都不提这件事上。',who:['我','同学']});
BANK.push({id:'K330',t:'《我举起了手机，以为他偷东西》',g:'rec',d:'society',c:'mis',e:'guilt',idea:'我以为他来偷东西，后来才知道他每晚收的是别人扔掉的旧电池。我那一下差点砸掉一个人的营生。',mat:['我看见一个老头翻我家的快递箱，以为他在拿别人丢掉的东西','我把手机举起来拍他，他没跑，把手里的东西摊开给我看','摊开的是一袋旧电池，还有两卷电线，电池上都起了白霜','后来我在小区门口看见他，摊位上摆着一块写着称重的旧牌子'],how:['开头：写我举起手机那一刻，快要按下去又收住，用动作代替心理','主体：写他摊开手掌那一幕：几节电池、一卷电线、他手上的口子','深化：写我道了歉，他只说下次别拍，我很久才补上一句真正的对不起','结尾：写我后来把废电池单独装袋再投，他接过袋子，先掂了一下重量'],trap:'容易写成被误会后感动落泪的老套路；必须写出我确实举起了手机这件事，不能一笔带过。',who:['我','收废品的老人']});
BANK.push({id:'K331',t:'《鱼摊前两个人比谁记得住菜价》',g:'rec',d:'society',c:'contest',e:'admire',idea:'两位老人把每天菜价记在本子上，比了二十年没分出过胜负，直到有一天其中一本停在三年前。',mat:['东头老陆的本子记的是月、日、价钱，三栏，字挤得像蚂蚁','西头那位记的是一句话：昨天番茄三块六，好过前天这个价','他们常在鱼摊前各念一遍，谁的数字小谁就算赢这一局','有一年冬天西头的本子没带来，他的本子停在三年前的腊月'],how:['开头：写两位老人在鱼摊前各念本子的场面，先写念的动作再写数字','主体：写比价的三个回合，每回合只写两个数字和一句输赢的话','深化：写我翻开西头那本的最后一行，停笔那天和他手腕上的日期对得上','结尾：写今年春天他们又遇上，西头的本子上多了一行，是别人替他写的'],trap:'容易把老人的较真写成固执或不通人情；不评判，只写两个本子上记的东西不一样。',who:['东头老陆','西头老人','我']});
BANK.push({id:'K332',t:'《二十七把钥匙挂在一根横档上》',g:'rec',d:'society',c:'change',e:'admire',idea:'一把剪刀柄上一个名字被磨掉了，另一个新刻上去。老手艺人把顾客的手写在自己的工具上，工具比人记得久。',mat:['剪刀柄上一侧有个名字磨得只剩右半边，右边是新刻的，刻得很深','街坊说这把剪以前是修拉链的老周头的，后来他不做这门生意了','现在拿剪的是他徒弟，每接一单就在柄上刻一个姓，一天刻好几个','刻满以后他把最旧那把挂在店里，位置正好在灯管下面'],how:['开头：写灯管下那把剪刀柄上的两个名字，一个看不清，一个刻得深','主体：写老周头、徒弟、刻名字三件事，每件给一个手上的动作','深化：写我问他为什么刻，他说怕哪天我找不到人，不知道这把剪是谁的','结尾：写最旧那把还挂在原处，柄上的名字已经磨成一道浅浅的坑'],trap:'容易写成匠人精神的抒情，宏大叙事太多；只写刻、摸、挂这三个动作，句子压短。',who:['老周头','徒弟','我']});
BANK.push({id:'K333',t:'《她称旧电池的秤，旁边摆着一块公秤牌》',g:'rec',d:'society',c:'object',e:'insight',idea:'她按重量记旧电池，一个数字都不差。我原以为这行没人在意，后来发现整栋楼的人都在悄悄配合她。',mat:['她的本子上写四号电池单价、日期和重量，字全用拼音缩写','有个住户为了凑够两斤，把家里小闹钟的电池也倒了出来','她觉得秤不准就不估计，拿着袋子去街口公共秤复称一遍','本子最后一页夹着一张纸条，上面写着下次带旧鼠标'],how:['开头：写她称电池时把本子摊在膝盖上的样子，先写本子再写秤','主体：写四个动作：记、凑、复称、留条，每条都带一个具体数字','深化：写我以为她在做小生意，后来发现她把回收的东西按月交给楼里的老人','结尾：写那张纸条还在本子里，字被描过三遍，纸背写满了正字'],trap:'容易把垃圾分类写成环保口号，或者把她写成奉献者；只用数字说话，重量和单价是主角。',who:['垃圾分类的阿姨','四楼住户','我']});
BANK.push({id:'K334',t:'《贴在墙上一百天没人撕的那张通知》',g:'rec',d:'society',c:'word',e:'protect',idea:'一张贴了三个月没人撕的通知，是物业省下的力气，也是整栋楼默认的规矩。没人改，就等于所有人都同意。',mat:['通知说晚上十点后请勿使用洗衣机，贴上去的时候纸还是新的','三个月过去纸边卷了，字没糊，也没人撕下来重新贴平','有个租客在下面贴了纸条，问洗衣机坏了该怎么办，第二天没人回','物业换过一次保安，通知还在那面墙上，谁经过都没去碰它'],how:['开头：写我每天出门都看见这张通知，只写它变了的样子，纸卷边胶带发黄','主体：写三件与它相关的事：没人撕、有人留言、保安换了人','深化：写我想起自己第一次听见楼上洗衣机响时，什么都没说也去反映了','结尾：写上个月那张通知终于被撕掉，撕的人没留名，墙面留下一块浅色'],trap:'容易把物业和业主写成对立面互相指责；只写一张纸和它周围的人，不给谁下结论。',who:['我','贴纸条的租客','保安']});
BANK.push({id:'K335',t:'《我说每月来一次，来成了外婆的眼睛》',g:'rec',d:'society',c:'promise',e:'warm',idea:'每月去一次旧街是我给外婆的承诺，一年后我发现真正变的是我——我开始一眼认出哪块砖被换过。',mat:['第一次去我拍了十几张照片，外婆嫌我拍的是招牌不是走在路上的人','第三次去我发现一家裁缝铺变成了奶茶店，门脸宽了，卷帘门高了一截','第六次下大雨，我在屋檐下站了二十分钟，听见里面有人用方言讲价','第十二次去我没带相机，外婆问我记不住了吗，我说记得住'],how:['开头：写我在旧街路口跟外婆说的那句话，一字不差地引出来','主体：按第一、三、六、十二次四次去写，每次只写一处路面或门脸变化','深化：写外婆问我记不住了吗，我说记得住，记得住说明我开始真的在看','结尾：写最近一次去我认出一块换了颜色的地砖，外婆说这个你也看得出，她笑了很久'],trap:'容易写成探亲日记，每段都是见到谁说了什么；四次去各写一处具体的路面或门脸变化。',who:['我','外婆']});
BANK.push({id:'K336',t:'《路口那三拨人各有各的守法》',g:'rec',d:'society',c:'crowd',e:'protect',idea:'同一个路口，三拨人各有各的守法：家长看表，老师看车，便利店的人看学生。二十几双眼睛把放学这件事守住了。',mat:['家长站成一排，书包举过头顶当视线用，谁先到谁抢前排位置','老师站在斑马线中间，挥手一次放过来五个人，节奏像打拍子','便利店的人把门口的凳子往里挪，腾出的地方正好站两个我们班学生','我们班最后一个人过线时，路灯刚亮，三拨人同时松了口气'],how:['开头：写放学前五分钟路口的三种站位，先写位置不写人','主体：写家长挪凳子、老师挥手放人、老板让地方的三个动作','深化：写我数了一下一共二十七双眼睛在路口，没有一双在看手机','结尾：写最后一个人过完线，路灯亮起，三拨人各自散开，路口空下来'],trap:'容易把家长和老师拿来对比着批评；只写各自的动作，写完不评价谁更负责。',who:['班主任','便利店老板','等学生的家长']});
BANK.push({id:'K337',t:'《第一次坐末班车，我看了一车人的下法》',g:'rec',d:'society',c:'first',e:'curio',idea:'第一次独自坐末班车，我一路盯着报站屏，学会了看一整排陌生人在哪一站下车——车上的人比终点更早决定回家。',mat:['末班车十一点二十，我在终点站前的椅子上等了二十分钟，车来得准','车上十一个人，八个在看手机，两个在打盹，只有一个在看窗外','过了第五站那个看窗外的先生站起来，把座位让给拎菜的阿姨','到终点我数了数，剩下的三个人全都坐到了最后一站'],how:['开头：从候车那把椅子有多凉写起，用触觉开场，不写害怕两个字','主体：写报站屏、下车人数、让座那一下、终点前剩下的三个人','深化：写我第一次发现看站牌比看手机有用，站牌替我记住了别人要去哪','结尾：写我下车时司机按铃说了一句到了，那是我第一次听见这三个字是冲我说的'],trap:'容易写成独自出行的心理成长，抒情占满篇幅；用数字和动作代替心情，一句都不许怕。',who:['我','让座的先生','末班车司机']});
BANK.push({id:'K338',t:'《七百二十步，中间有六个必须慢下来的地方》',g:'rec',d:'society',c:'journey',e:'insight',idea:'我用步数app数过从家到菜场的路，六百七十二步里有六处要停下来听一听。这条路是我和一座城市最早的关系。',mat:['第九十二步是那段永远在修的地面，走过去要绕开半步才不踩空','第四百步是一家开在门口的理发店，吹风机声隔着门帘一直漏出来','第五百一十步的报刊亭改成了卖豆浆，早点时间人挤到马路牙子上','最后一段有棵歪脖子树，花坛边沿被坐出一个凹，凹里积着落叶'],how:['开头：写我第一次打开步数app的原因和起点终点，一句话交代清楚','主体：按六个节点各写一处，每处给声音或温度，不写心情','深化：写我意识到我记住的不是路本身，是这一路上我停下来听了多少次','结尾：写现在我不数步了，可每到那几个点还是会慢一下，脚步自己记得'],trap:'容易写成散文式的迷路随笔；六个点必须各自具体，一个都不许只写这里很安静。',who:['我','豆浆店的老板','理发店的学徒']});
BANK.push({id:'K339',t:'《我扔掉的那捆报纸，让一户人家断了补贴》',g:'rec',d:'society',c:'object',e:'guilt',idea:'楼道口堆着等收的那捆旧报纸，我嫌挡路扔了。后来才知道，整层楼的门垫和鞋垫都是从里面来的。',mat:['报纸捆在楼梯拐角，压着一张写了日期的便条，字是别人的笔迹','我嫌它挡路，先搬到门外，再丢进干垃圾桶，第二天门卫在桶边找','保安说这捆是三楼一个住户攒的，卖给收废品的，补贴他一周的菜钱','那张便条后来又出现在门口，换了日期，字比上一次写得更歪'],how:['开头：从楼梯拐角那捆报纸的绳结和压着的便条写起，先写物','主体：写我扔报纸的三个步骤：嫌挡路、搬到门外、丢进干垃圾桶','深化：写门卫讲的一周菜钱，让我想起家里那捆也一直堆在门口没人管','结尾：写第二天门口又出现一捆，便条换了日期，字比上次更歪'],trap:'容易把环保和节约挂在嘴上变成空议论；只写报纸、绳子、便条和门卫的那一句话。',who:['我','门卫','三楼的住户']});
BANK.push({id:'K340',t:'《她说少算了五毛，把钱塞进一只旧铁盒》',g:'rec',d:'society',c:'mis',e:'insight',idea:'我以为摊主少算了五毛，后来才发现她把五毛塞进一只旧铁盒。盒子里的钱全是别人找零差的一分五毛。',mat:['我买了三样东西，她找的钱比计算器上的少五毛，我当场就说了','她没争辩，把那五毛放进摊子底下的铁盒，盖子合得很轻','盒边用圆珠笔写着一行小字，几分几厘，日期从去年开始记','后来我故意少给一块硬币，她一样放进铁盒，头都没抬'],how:['开头：写我算错账那一刻，把计算器屏幕和手上的钱一起写出来','主体：写少算五毛的争执、她放进铁盒的动作、盒盖合上的轻响','深化：写盒边那行字和日期，让我觉得账面上她比我认真得多','结尾：写我走时回头看，铁盒被她的脚挡着，谁也别想看见里面有多少钱'],trap:'容易把她写成圣人，把我写成不懂事的孩子；只写那只铁盒和我说出口的那句话。',who:['我','菜场摊主']});
BANK.push({id:'K341',t:'《她俩比赛谁的瓜化得慢》',g:'rec',d:'society',c:'contest',e:'warm',idea:'两个阿姨搬西瓜，比了一下午谁搬得快，后来比的是谁的瓜化得慢。一场没有奖的较劲，撑住了整个下午。',mat:['上午是她俩各搬一箱，箱子一样重，落地的声音一样闷','中午开始比冰，看谁的瓜先不化，箱子底下各垫一条毛巾','有一箱裂了缝，两人同时蹲下用手去接，接完互相看了一眼','天黑收摊，剩下的瓜按大小被分了，谁也没说该怎么分'],how:['开头：写两只手抬箱子的动作，用左右区分两人，全段不写名字','主体：写上午比速度、中午比冰、傍晚分瓜的三个回合和三个动作','深化：写接住瓜汁那一下的对视，比谁都说明白她们这一天的关系','结尾：写收摊后空地上留了半个瓜皮，被人捡走，两个阿姨谁也没管'],trap:'容易写成邻里和睦的暖场戏；抓住比冰和接瓜汁这两处，其余一律不铺陈。',who:['搬西瓜的阿姨','买瓜的人','我']});
BANK.push({id:'K342',t:'《三轮车上铺着的那张床单》',g:'rec',d:'society',c:'secret',e:'plain',idea:'收废品的三轮车上铺着一张旧床单，四个角用夹子固定。车上什么都能压坏，唯独这张没被压过。',mat:['三轮车铁架上铺着洗到发白的床单，四角用木夹子一只只夹紧','上面压着纸板、旧风扇、两捆报纸，中间特意留出一块空','有一次下小雨，他先把床单抽出来抱在雨棚下面，纸板淋湿了','我问他留着床单做什么，他说晚上当个盖的，别的什么也不干'],how:['开头：写那张床单铺在铁架上的样子，先写四个角的木夹子','主体：写三件事：压东西时留出的空、下雨先抱床单、晚上当盖的','深化：写我原以为他留床单是舍不得，其实是他给自己留的一小块完整','结尾：写他收车时把床单叠成四折，塞进车座底下那块地方'],trap:'容易滑向同情穷人的煽情，把人物写得很可怜；只写夹子、留空、叠法这三个动作。',who:['收废品的人','我']});
BANK.push({id:'K343',t:'《越修越小的摊子，从四个马扎缩到一只》',g:'rec',d:'society',c:'change',e:'admire',idea:'修锁师傅把摊位从四个人那么宽缩到一只马扎。不是生意少了，是他主动退到了不挡路的地方。',mat:['三年前他的摊子占四个人那么宽，晚上还挂一排钥匙在灯泡下','现在只剩一只马扎和一个小木箱，箱子打开就是全部家当','二十七把钥匙串挂在马扎的一根横档上，一把不多，一把不少','我问他怎么不摆开一点，他说路窄，摊子小了才有人敢停下来'],how:['开头：用摊位大小的变化开头，写出三年里宽窄的差别，最好给具体尺寸','主体：写钥匙串、马扎、木箱三样东西，怎么从大处一点点缩到小处','深化：写他那句摊子小了才有人敢停下来，说明让出地方也是一种本事','结尾：写我路过时他正给一把伞换锁，工具摊在地上，不到半块砖'],trap:'容易把这写成小贩退场的悲情；落点在他主动让路的逻辑上，别去感慨时代。',who:['修锁的师傅','我']});
BANK.push({id:'K344',t:'《他每天先擦一遍空调外机再开门》',g:'rec',d:'society',c:'moment',e:'curio',idea:'他每天开门先擦空调外机，动作重复了七年。他从没向谁收过这一次的钱，也从没算过这笔账。',mat:['他店门口有一架空调外机，铝片上的灰一年比一年厚','每天七点开门第一件事是拿毛巾擦，从上往下正好擦三遍','有客人问擦它干嘛，说外机脏了费电，他回一句我也没省到哪去','上个月外机被拆走换新，他站在原地愣了一会儿，第二天照样去擦墙面'],how:['开头：写七点开门时他擦外机的动作，从毛巾在铝片上的声音写起','主体：写擦外机三遍、客人问他那句话、他答的那句我也没省到哪去','深化：写我想问那七年的电费，后来问不出口，因为他的理由不算在账本里','结尾：写外机拆走那天他在留下的墙面上又擦了一遍，墙比原来干净'],trap:'容易写成无名奉献者的赞美；必须写出这个动作毫无收益，不许夸他境界高。',who:['开店的店主','问他的客人','我']});
BANK.push({id:'K345',t:'《收据背面那句不用谢》',g:'rec',d:'society',c:'word',e:'admire',idea:'一句不用谢写在收据背面而不是嘴上。他们店的谢字永远落在纸上，因为纸比人耐用。',mat:['修鞋的师傅把找零压在鞋盒盖上，收据背面写着一行小字','同行小摊上白找的那一块他也要写下来，怕人家不好意思','我问他为什么不直接说，他说自己嘴笨，写下来的谁都能带走','那张收据现在夹在我书里，纸上的字比他的脸我记得清楚'],how:['开头：写修鞋摊上纸片背面朝上，那行字比鞋先被我看见','主体：写三张收据背面各写什么，每张只抄一句原话，一个字不改','深化：写他解释嘴笨那句话，说明在他的世界里纸替嘴完成了一件事','结尾：写那张收据夹在书里，纸已经脆了，字还在，翻页的时候会响'],trap:'容易把这点小事拔高成店家人文关怀；只写三张纸上的原话，句号都不要多。',who:['修鞋的师傅','我']});
BANK.push({id:'K346',t:'《夜里十点的便利店，只剩三个人》',g:'scene',d:'society',c:'moment',e:'down',idea:'深夜的便利店把灯关掉一半，剩下的光正好照着最后三个人。谁也没说话，只有空调和关东煮的水声。',mat:['十点整店员把门口的关东煮锅端进后厨，锅底还在冒小泡','收银台只剩一排饮料冰柜亮着，冰柜顶上落了一层水汽','一个外卖员把手机架在糖罐上等取餐提示，屏幕一直是黑的','我坐在最里面那排，把同一瓶水推远了一点又拉回来'],how:['开头：从十点那一刻店员关掉一半灯写起，用光的变化带出人的减少','主体：写三个人的三个动作：端锅、架手机、把水瓶推远又拉回','深化：写我没等到关店就走了，出门时回头看，那个外卖员还在糖罐边上','结尾：写第二天中午我再路过，那锅关东煮重新在门口冒着热气'],trap:'容易写成深夜的孤独或城市疲惫的套话；只写灯、水声和三个人的手，别写心情。',who:['我','店员','等取餐的外卖员']});
BANK.push({id:'K347',t:'《打烊前五分钟，排队的人没一个催收银员》',g:'scene',d:'society',c:'crowd',e:'protect',idea:'打烊前五分钟队伍还剩七个人，没有一个催。四十多分钟里，收银员数错了两次钱，没有人走。',mat:['快到十点队伍排到了门口，最后一个进来的人手里拎着一袋速冻饺子','收银员扫错了两次码，两次都是自己发现的，抬头时脸有点红','队伍里有个拎菜篮的阿姨往里挪了半步，让后面的人能进店','九点五十七最后一个人付完钱，出去时塑料袋上结了一层水珠'],how:['开头：从队伍排到门口写起，用最后一位顾客手里的东西交代他为什么这么晚','主体：写五分钟里的三个细节：扫错码、挪半步、塑料袋上的水珠','深化：写我数了数那五分钟里没人开口催，说明队伍里有一种默契在','结尾：写卷帘门落下之后，地上留着一个被踩扁的饺子盒的一角'],trap:'容易写成小店的温情广告；抓住那两次扫错码和没人催，其余都别加。',who:['收银员','拎菜篮的阿姨','我']});
BANK.push({id:'K348',t:'《假如全城的路灯都交给人来点》',g:'imagine',d:'society',c:'journey',e:'insight',idea:'假如全城的路灯都交给人来点，天黑的速度就会变慢——人不再只是被照亮，而是决定什么时候开始走。',mat:['天黑以后由住在街口的人按一下开关，谁值班写在一块小木牌上','第一晚有人在灯下等同伴，等到十一点也没有人来按那个开关','有人提议按下的时间写进本子里，谁多点晚一点，下个月他来补','半年后木牌换成了电子的，所有人反而记住了自己按过的那个数'],how:['开头：写天黑后路口那盏灯没人管，最后一个下班的工人自己伸手按了开关','主体：按时间写四个夜晚，每晚写一个人的动作和一个没说出口的想法','深化：写我想的是灯不重要，重要的是谁在黑里替别人先走了一步','结尾：写半年后开关换成了电子的，木牌被挂在值班室墙上，还有人在上面补名字'],trap:'容易写成科幻想象，落点飘到未来城市；想象只到一个月后，结尾必须回到一盏灯和一个开关。',who:['我','街口住着的工人','值班的人']});
BANK.push({id:'K349',t:'《老修车摊该留还是该走》',g:'argue',d:'society',c:'change',e:'plain',idea:'修车摊该不该留，不该用整齐来判。它的用处是把坏掉的东西当场修好，这件事在手机里搜不到。',mat:['赞成留下的理由是这条弄堂口没有第二个修车点，老人不会用软件','反对的理由是路口不能长期占道，还常常积水打滑','我数过一周，路过修车摊的有一百二十人，真正停下问价的十九个','我自己的判断是位置可以变，工具不能丢，人可以搬，摊子可以进店'],how:['开头：从同一件事的两面说起，先摆出支持和反对各自最硬的一条理由','主体：两边各给两个具体依据，不用名人名言，不用情绪化的举例','深化：写出我自己的判断标准：能不能当场修好，占没占住公共通道','结尾：结尾不宣布输赢，只给一个可执行的折中办法，比如让摊子进店三尺'],trap:'容易写成一边倒的评论文章，情绪词多于事实；两边依据必须对称，最后必须落到可执行的办法。',who:['修车师傅','占道的车','人行道的宽度']});
BANK.push({id:'K350',t:'《我给师傅写了一封关于那把扳手的信》',g:'apply',d:'society',c:'secret',e:'down',idea:'给修车老伯写信，不是为了劝他收徒，而是替那把油纸包着的扳手问一句：手小的人到底该不该有一把自己的工具。',mat:['他工具箱里有五把没拆封的新扳手，油纸发黄，编号还是原厂','他解释过一次，这把留着手小的客人，我们这儿暂时用不上','学徒借走一把修车链，他三天问了四次用完没有，问到学徒躲','我数过他摊上修过的车，最细的那条链子配的是一个上三年级的孩子'],how:['开头：写清写信的原因，我看见五把没拆封的工具，想问它们去哪儿','主体：一条一条列我看见的：新工具不拆、专留手小的客人、学徒借走要问三次','深化：第三条我认错，我以为他藏私，其实我只看见工具没看见借工具的人','结尾：请他回一句就行，回不回都可以，信封口我没封死'],trap:'容易写成感谢信或建议信，通篇夸师傅手艺；必须有一条是承认我自己想错了。',who:['修车老伯','借工具的学徒','我']});
BANK.push({id:'K351',t:'《弹棉花的老伯，把竹弓拉到最满》',g:'scene',d:'hometown',c:'object',e:'warm',idea:'弹棉花的竹弓声从弄堂口一路响到河浜。那声音不吵人，它提醒这条街上还有人在做慢活。',mat:['老伯把竹弓的绳子绷到最满，用膝盖顶住弓背，棉花在弓下跳','他左手托着棉胎，右手的小锤一下一下敲在弓弦上，节拍稳得像数拍','竹弓上下三十多次，棉花就松开成一张厚的白毡，边缘还带毛','弹好的棉胎他搭在自行车后架上，用绳子绑三圈，怕风吹走'],how:['开头：从竹弓被拉开的第一声写起，用声音带出老伯的位置和动作','主体：按绑弦、敲弓、松棉三步写，每步只写手上的动作和声音的粗细','深化：写我数了他敲的次数，一次不多一次不少，才敢说这活计还没被机器替掉','结尾：写棉胎被绑上后架推走，车轮压过石板缝，那声音跟着他拐出弄堂'],trap:'容易写成怀旧抒情的乡愁，或者把弹棉花写成绝技；只写竹弓、锤子、绳子和次数，不许感慨传统消亡。',who:['弹棉花的老伯','我','推棉胎的学徒']});
BANK.push({id:'K352',t:'《老式理发店那把转椅，能躺平也能坐直》',g:'rec',d:'hometown',c:'object',e:'curio',idea:'转椅能躺平能坐直，靠背后面那块补丁比皮面还结实。这把椅子记得这条街上所有低头和抬头的姿势。',mat:['转椅的皮面裂开一道缝，内衬是补上去的蓝布，针脚密得看不出起头','椅背后面钉着一块木片，客人后仰时正好卡住，不至于躺过头','理发师推一把剪下来的头发扫进簸箕，那动作和十年前一模一样','镜子右上角贴着价目表，最下面一行写着刮脸五元，字压了三层'],how:['开头：从推门时转椅转半圈的声音写起，先写椅子再写人','主体：写皮面的补丁、木卡片的用处、扫头发的动作，三件各给一个细节','深化：写我小时候躺在这把椅子上理发，如今自己坐在旁边，看它转的方向和从前一样','结尾：写价目表最下面那行刮脸五元已经过时，师傅说懒得撕，怕人看着慌'],trap:'容易写成理发店怀旧或写父辈的年代感；只用转椅这一件实物撑起全文，别罗列旧物。',who:['老式理发师','我','理发店的学徒']});
BANK.push({id:'K353',t:'《桥洞下的船，每天从同一根木桩边过》',g:'scene',d:'hometown',c:'moment',e:'curio',idea:'桥下的船没有名字也没有航线，每天两次从同一根木桩边过。我第一次数它，是想确认它真的是同一条。',mat:['船头比船身宽，吃水浅，贴着桥洞的石壁滑过去，水声被桥压得很低','船上竖着两根竹竿，竿头各挂一只塑料桶，装的是水和柴油','每次过桥洞我都听见一声短哨，不是给谁听的，是提醒上面的人让开','第三个月我再去看，桥洞下的木桩少了一根，船还是那个时间过'],how:['开头：从船进桥洞那一瞬写起，先写水声被桥压低，再写船的形状','主体：写竹竿、塑料桶、短哨三样东西，只写它们在船上的位置和作用','深化：写我数了两个月才确定是同一条船，理由是竹竿上那道缠绳的位置没变','结尾：写木桩少了一根，我站了很久，船过桥的时间倒一点没晚'],trap:'容易写成桥的怀旧或水乡风情；只写桥下的船和一两个月里的观察，别抒情。',who:['我','开船的人','桥上的行人']});
BANK.push({id:'K354',t:'《早点摊从五张桌子变成两张》',g:'rec',d:'hometown',c:'change',e:'plain',idea:'同一条街，早点摊从五张桌子变成两张。留下来的是最早出摊的那一家，收走的是离它最近的。',mat:['第一家是四点四十出摊的，蒸笼第一层揭盖时整条街都是面味，我爸闻着味起床','后来陆续开过三家，都是七八点才出，油条用大锅炸，比蒸的慢十分钟','最靠近桥头那家先撑不住，他把桌子搬进自家饭厅，摆一张就少一张','现在剩两张桌子，一张属于第一家，一张属于那个把桌子搬进饭厅的人'],how:['开头：从四点四十的蒸笼揭盖写起，用时间和气味带出这条街的作息','主体：按五张桌子到两张的变化写，每一张桌子的主人和出摊时间各写一句','深化：写我算过一条街的人并没有少，少的是让人站在街边吃早饭的那几步路','结尾：写现在两张桌子还在，一张四点四十，一张七点半，中间隔着两个小时'],trap:'容易写成商业兴衰的议论，落点飘到经济发展；只写桌子的数量、去向和出摊时间。',who:['第一家早点摊主','搬桌子的老板','我']});
BANK.push({id:'K355',t:'《防火墙外的声音，十年里换了三种》',g:'scene',d:'hometown',c:'change',e:'insight',idea:'同一堵墙，以外是车流，以前能听清轮胎碾过接缝，现在只剩一片闷响。声音变粗的地方，正好是新楼起来的地方。',mat:['十年前从二楼窗口能听清每辆车的轮胎压过接缝，咔、咔，两下一组','后来加了高架，车底的闷响把咔咔盖住，只剩一层连续的嗡嗡','前年塔吊开始转，吊臂在头顶画圈，风一大就把车声切得更碎','现在我关上窗反而能听见弄堂里修鞋的敲击，一下一下，很清楚'],how:['开头：从二楼窗口听轮胎压接缝的声音写起，用两个具体的音开场','主体：按以前、加高架、起塔吊三个时段各写一种声音，只写耳朵里的变化','深化：写我发现声音越来越粗的地方，正是窗外新楼挡住视线的地方，两件事是同一件','结尾：写关上窗之后重新听见的修鞋声，我分不清那是安静了还是习惯变了'],trap:'容易写成城市化进程的感慨；只写声音三段变化，不评价发展和牺牲。',who:['我','修鞋的人','塔吊的司机']});
BANK.push({id:'K356',t:'《电话亭里那本记着号码的本子》',g:'rec',d:'hometown',c:'secret',e:'curio',idea:'公用电话亭里的小本子记着号码，记的都是别人托他拨的。最后一页夹着一张只写了一个门牌号的纸。',mat:['亭子里那本薄册子摊在台面上，每页印着二十行格子，谁用谁画一道竖','有一页的号码被划掉重写三次，最后写对了，旁边画了个小箭头','有人拨不通就留在纸上等人再拨，来找的人站在亭外探头看格子','最后那页只写了一个门牌号，没有号码，画的人也没写日期'],how:['开头：从亭子里那本摊开的薄册子写起，先写格子，不写打电话的人','主体：写划掉重写的号码、探头找格子的陌生人、最后那页只写的门牌','深化：写我猜那页纸是留给会回来的人的，所以没有日期，写的人只在等，不在等多久','结尾：写我下次经过时本子还在，最后那页多了一行字，字迹不是原来那个人的'],trap:'容易把公用电话亭写成时代眼泪的怀旧符号；只写本子上的格子、划掉的字和那张没写完的纸。',who:['用电话亭的人','写门牌号的人','我']});
BANK.push({id:'K357',t:'《外婆家天井里，那根竹竿从早到晚都有人看着》',g:'scene',d:'hometown',c:'object',e:'protect',idea:'天井不大，一根竹竿占了半边，衣裳在上面转圈。外婆说太阳今天偏西，竿子要往东挪半寸。',mat:['竹竿是晾衣用的，两头各用一团旧布缠住，缠法是外婆教给我妈的','上午竿子影在青砖上，影子往东一寸，衣裳就干得慢一点','中午我看见外婆把竿子往东挪了半寸，理由是西边被隔壁楼挡着','下午影子转过来，衣裳开始有太阳的味道，那味道要收在天黑之前'],how:['开头：从竹竿在青砖上的影子写起，用影子的位置带出一天的次序','主体：按上午、中午、下午三个时段写影子和挪竿子那半寸的动作','深化：写那半寸不是讲究，是外婆用一整个下午的观察换来的，谁也看不出差别','结尾：写收衣服的顺序，裤子、抹布、最后才是我的校服，理由是校服要晒到太阳落下'],trap:'容易写成外婆勤俭或温情抒发；只写竹竿、影子和那半寸，不要一句怀念。',who:['外婆','我','隔壁楼的住户']});
BANK.push({id:'K358',t:'《从弄堂口走到河浜埠头，一共两百零八步》',g:'rec',d:'hometown',c:'journey',e:'warm',idea:'两百零八步，是从修脚床前到洗菜石阶的距离。这条路我走了十年，走的是别人一天的生意。',mat:['前五十步在理发店门前，玻璃门每推开一次，镜子里的我就要重新梳一次头','一百步是早点摊，收摊的时候地面湿一大片，鞋底踩上去有声音','一百五十步开始有竹屑落在地上，是上一个做竹器的摊子留下的','最后几十步下坡，坡度很缓，走到一半就能看见河浜的水'],how:['开头：从弄堂口的理发店玻璃门写起，用玻璃门开合的次数起头','主体：按五十步、一百步、一百五十步、最后几十步写四种经过','深化：写我这才明白这条路上每一样生意都落在别人一天的起止上，我只是路过','结尾：写我如今仍走这条路，却不再数步子，走到坡顶就知道快到埠头了'],trap:'容易写成怀念老街的情散文；只写路面、声音和坡度，不要抒发告别。',who:['我','理发店的学徒','做竹器的老人']});
BANK.push({id:'K359',t:'《傍晚六点，那声吆喝从窗前准时过去》',g:'scene',d:'hometown',c:'moment',e:'warm',idea:'同一句吆喝，傍晚六点从窗前过。从前是三轮车，现在是小电瓶车，尾音却一样地往上挑。',mat:['从前是三轮车，链条哗啦哗啦，吆喝压过链条声，只剩最后两个字的尾音','后来三轮车换成了电动车，链条没了，吆喝反而清楚，一句能听全六个字','前年那条路封了施工，吆声断了两天，我到点才发现窗前少了个声音','现在是电动三轮，声音更闷，但尾音还是往上挑，像一定要让人回头'],how:['开头：从傍晚六点窗前准时响起的声音写起，先写声不写车','主体：按三轮车、电动车、施工停两天、现在四段写声音本身的变化','深化：写我在意的不是车，是那句尾音往上挑的调子，它负责让人记得买点什么','结尾：写昨天我又听见了那声吆喝，尾音往上挑，我隔着窗应了一声，路上没人回头'],trap:'容易写成时代变迁或市井怀旧；只写同一句吆喝在四种车声里的样子。',who:['推车的人','我','窗下的住户']});
BANK.push({id:'K360',t:'《第一次走到埠头，水泥已经盖到台阶第三格》',g:'rec',d:'hometown',c:'first',e:'down',idea:'我小时候数到二百零八步是下坡，大了才知道那不是坡，是被盖住的水泥。台阶第三格以下还在水里，第一格已经干了十年。',mat:['埠头原来是十几级石阶，最下面三级常年泡在水里，苔藓绿得发黑','我七岁那年再去，最下面一级还在水下，摸得到的石头凉了半边手','十二岁再去，水泥盖到第三级，台阶从石头的变成了水泥的，边缘齐整','今年我蹲下用手抹了抹第一级，干的，缝里卡着一枚去年的树叶'],how:['开头：从我最后一次走到埠头蹲下抹第一级台阶写起，用手的触感开场','主体：按七岁、十二岁、现在三次写水位和台阶的差别，每处给一个触感','深化：写我难过的不是水少了，是我一直以为它会在原地等我一个人去认','结尾：写我把手收回来，看第一级上那枚叶子，它是被水推上来还是被风吹来的我说不清'],trap:'容易写成怀念河浜和逝去的童年；只写台阶、水位和手摸到的温度，不抒情。',who:['我','洗菜的人','停在岸上的电瓶车']});
BANK.push({id:'K361',t:'《弹棉花的弓声与修车的打气声，谁都不肯让》',g:'scene',d:'hometown',c:'contest',e:'admire',idea:'一条弄堂两头，弹棉花的弓声和修车的打气声轮流占着上午。两条街坊互相听了几十年，谁也没赢过。',mat:['弹棉花的弓声一起就是连着三十几下，节拍稳，中间的停顿比前面还响','修车的打气筒是一长一短两口气，长的是打气，短的是松脚踩','两边像在接龙：弓声收尾那一秒，打气声正好顶上来，中间没有缝','有个夏天的中午两边同时响，弓声和气声混在一起，响到整条弄堂没人说话'],how:['开头：从弄堂两头两种声音一前一后写起，用声音的顺序做文章','主体：写弓声和打气声各自的节奏，各写两个细节，不比较优劣','深化：写我在中间站过一次，两种声音叠起来谁也不让，最后是收摊的人先停','结尾：写那年中午的混响后来再没有过，两边都说是对方先停的'],trap:'容易写成邻里和睦的温情，或写成噪音扰民的抱怨；只写两种节奏和它们如何叠加。',who:['弹棉花的老伯','修车的师傅','我']});
BANK.push({id:'K362',t:'《答应奶奶把门牌号贴回原处》',g:'rec',d:'hometown',c:'promise',e:'guilt',idea:'我把门牌从新楼的白瓷砖上撕下来，贴回旧墙。奶奶说不用贴了，我反而更不敢交差。',mat:['旧门牌是搪瓷的，字是手写的，白底黑边，边角磕掉一块瓷','新楼的门牌是统一喷的，字小，贴在白瓷砖上，晚上反光看不清','我撕下来那天没跟奶奶说，贴回去时她正在剥豆，说这有什么用','那天下午我蹲在墙根贴了两次，第一次歪了，第二次才对齐'],how:['开头：从我撕下新门牌那一刻写起，先写新旧两块的样子差别','主体：写撕、贴、贴歪了重来三次的动作，每处只写手上的细节','深化：写奶奶那句话说有什么用，我却把这当成了她给我留的一件正经事','结尾：写门牌贴回去的位置比原来低了半寸，路过的人照旧抬头找，反而更好认'],trap:'容易写成怀旧或对老屋的凭吊；只写两块门牌和贴牌的三次动作，不评价新旧。',who:['奶奶','我','搬进新楼的邻居']});
BANK.push({id:'K363',t:'《楼道里，晒被子的地方从二楼挪到六楼》',g:'scene',d:'hometown',c:'change',e:'warm',idea:'晒被子的位置从二楼平台挪到六楼，绳子还是那根绳子，人却多了两倍。楼高了，晒一床被子要多爬四层。',mat:['从前二楼平台是晒被子的地方，绳子横拉过去，被子一挂就是一整面墙','后来新楼盖起来，二楼平台的太阳被对面楼挡了三点到四点','绳子挪到六楼，风大晒得干，就是每个人得多爬四层','现在六楼绳子上一排被子，颜色不一样，风一过全朝一个方向倒'],how:['开头：从二楼平台那根横拉的绳子写起，用被子的颜色数量交代时间','主体：按二楼、三点后的阴影、六楼三段写位置和干燥时间的变化','深化：写多爬四层这件事让晒被子变成一件要约人的事，而不是顺手做的','结尾：写去年有天没人肯爬，就有人把被子铺在小区石凳上晒了一下午，凳子后来烫手'],trap:'容易写成居住条件变差的抱怨；只写绳子、楼层和晒的时间，不下结论。',who:['晒被子的邻居','收被子的阿姨','我']});
BANK.push({id:'K364',t:'《我把修脚床前的人当成了收旧货的》',g:'rec',d:'hometown',c:'mis',e:'insight',idea:'我以为修脚的师傅是收旧货的，因为他的工具箱里也有秤。他的秤称的是脚，重量写在纸片上。',mat:['他门槛边的工具箱锈了一层，里面除了刀片还摆着一把小弹簧秤','我想他是收旧货的，就站着看了一会儿，看他给一位大爷捏脚','捏完他把一张写好的纸片递过去，上面写着重量和下次来的时间','他做完一个人就把纸片按顺序夹在箱子盖内侧，一叠一叠越来越厚'],how:['开头：我误认的瞬间写起，从门槛边那只锈工具箱和里面的秤写起','主体：写他捏脚、递纸片、夹纸片三个动作，各给一个手上的细节','深化：写我后来才明白他称脚是随口一句闲话，纸片上的重量是他用来记的旧习惯','结尾：写他箱盖内侧那叠纸片，日期排得整整齐齐，最早一张是八年前'],trap:'容易写成对手艺人的赞美；只写工具箱、秤和纸片这三样，不要对手艺说三句评价。',who:['修脚师傅','大爷','我']});
BANK.push({id:'K365',t:'《弄堂口那只绿邮筒，投信口磨出了亮》',g:'scene',d:'hometown',c:'object',e:'plain',idea:'绿色邮筒立在弄堂口，投信口的边被手指磨出一圈亮。信是别人的，我只在投的时候听见响一声。',mat:['邮筒比人高半个头，漆绿得发暗，底部一圈绿漆掉光了','投信口的铁边被磨得发亮，那一圈亮比别的地方高出半指','我投信要踮一下脚，信落下去才响，闷的，说明底下积着旧的信','有一回我投完没走，听见里面有人也在投，两声闷响前后差了半秒'],how:['开头：从邮筒绿漆掉光的那一圈写起，先写颜色，不写用途','主体：写投信口被磨亮的那一圈、踮脚的动作、落进筒里的闷响','深化：写我第一次听见两声闷响前后差半秒，才知道这条弄堂里的信是连着的','结尾：写第二天路过，投信口边上多了一个新的亮，是有人刚才又投了一封'],trap:'容易写成怀旧或感慨人情；只写邮筒的颜色、亮边和声音，不解释它代表什么。',who:['我','投信的人','收信的邮递员']});
BANK.push({id:'K366',t:'《玻璃罐里最后一颗水果糖》',g:'rec',d:'hometown',c:'word',e:'curio',idea:'小卖部玻璃罐里只剩一颗水果糖，标签还贴在罐上，写着五角。那颗糖的价钱十年没变过。',mat:['玻璃罐一共装了十几颗糖，糖纸褪成粉红色，罐子擦得能照见人影','最后一颗是橘子味的，糖纸角上印的日期要对着光才看得出是几几年','柜台后面贴着价目表，最下面一行手写补上去：水果糖五角一颗','那天我买走它，老板在铁盒里翻了两分钟，找出一枚硬币拍在柜台上'],how:['开头：从玻璃罐里糖纸褪色写起，用颜色变化交代年头','主体：写糖纸的日期、要对着光看、价目表上补写的五角三处细节','深化：写我买走那颗糖不是嘴馋，是我第一次把一件十年前的东西拿到今天','结尾：写我把糖纸夹进书里没吃，后来它化在口袋里，纸粘在了内页上'],trap:'容易写成怀旧糖果或童年回忆；只写糖、罐子、价目表和找硬币，别感叹时光。',who:['小卖部老板','我','来买酱油的老太太']});
BANK.push({id:'K367',t:'《理发店的镜子里，装着整条弄堂》',g:'scene',d:'hometown',c:'moment',e:'curio',idea:'老式理发店的镜子斜挂在墙上，镜子不照人，照的是门口的弄堂。我在里面剪头发，看见的却是外面下雨。',mat:['镜子挂在墙上靠斜，镜面上有一道裂，从左上角一直走到右下角','裂的那条缝把镜面分成两块，看过去的人会在中间断开一下','我剪头发时盯着镜子看雨，雨水顺着门帘的下摆滴在地砖上','雨停以后镜子里的人多了一个，两个人的头都朝同一个方向偏'],how:['开头：从镜面那道裂写起，用镜子把画面切开的办法起头','主体：写镜子里门帘、地砖上的水点、雨停后多出的那个人','深化：写我在这面镜子里看过太多次弄堂，比站在门口看得还久','结尾：写我把剪下来的头发理好出门，镜子里的人还在那儿看着门帘'],trap:'容易写成理发店的故事或怀旧抒情；只写镜子、裂缝和雨水，不解释象征。',who:['理发师','我','门外的行人']});
BANK.push({id:'K368',t:'《窗外的塔吊，和已经住人的新楼》',g:'rec',d:'hometown',c:'object',e:'down',idea:'塔吊在窗外转了三年，第三年的某个夜里它走了。那晚新楼的灯亮着，比塔吊的探照灯多得多。',mat:['塔吊第一次来的时候比楼高，吊臂扫过我家窗口，正午要拉窗帘才不刺眼','后来它固定在两栋楼之间，一台吊臂两台钩子，一天的响声分早中晚三种','第三年秋天它被拆走，拆的时候没打吊车，是几节一节从顶上退下来的','塔吊走后那栋新楼住进了人，晚上一格一格亮灯，比探照灯多得多'],how:['开头：从塔吊第一次出现在窗口写起，用窗帘和刺眼两处细节起头','主体：按三种响声、拆走、退下的次序写，最后写新楼亮灯','深化：写我难受的不是它吵，是它在那儿的三年，我习惯用它的响声判断几点钟了','结尾：写昨天夜里窗外安静，我醒了一下才想起来那东西已经不在了'],trap:'容易写成城市化进程的感慨或抱怨工地的作文；只写吊臂、响声和灯，不下判断。',who:['我','塔吊的司机','新楼的住户']});
BANK.push({id:'K369',t:'《搬家那天，门牌以外的东西没法装箱》',g:'scene',d:'hometown',c:'journey',e:'insight',idea:'搬走时能装箱的是家具和书，装不走的是门槛的高度、墙皮的裂纹和楼下那家的味道。这些没法登记。',mat:['门框上的旧漆剥落的形状我描在纸上，搬走那天对照了一遍，一模一样','门槛被踩出一个凹，凹的深浅说明这户人家进出了多少年','窗台下面那块墙皮鼓起来，摸上去像一张绷紧的纸','最后清点的是钥匙，两把，第三把是我小学时自己去配的，配钱八角'],how:['开头：从搬家那天的对照写起，先写描在纸上的一张纸，不写情绪','主体：写门框漆、门槛凹、墙皮鼓、钥匙四样，各写一个手感或数字','深化：写我发现能搬的都装了，剩下这些没法装箱，也就没人来登记','结尾：写纸折好塞进抽屉第一层，钥匙留了一把在老房子门垫底下'],trap:'容易写成对老房拆除的感慨或政策议论；只写可摸可数的细节，不评论去向。',who:['我','搬家的人','留下看门的老邻居']});
BANK.push({id:'K370',t:'《从前小卖部门口的那张板凳，坐过整条街》',g:'rec',d:'hometown',c:'crowd',e:'warm',idea:'一张长板凳放在小卖部门口，夜里坐满人。它不算座位，是这条街把板凳从屋里搬出来的一段路。',mat:['板凳有六个人的长度，木条拼的，中间那块被坐出一个圆窝','夏天夜里坐满了人，谁都往前挪一点，挪成一个更紧的圈','卖烟的老太太不赶人，她在门槛上放一只搪瓷盆，收脚边扔的烟头','十一点半她会拍三下板凳面，说不早了，最后走的一定是她'],how:['开头：从板凳放的位置写起，用坐满了人和凳面那个圆窝起头','主体：写挪位置、收烟头、拍板凳三件事，各写一个手上的动作','深化：写我在板凳边长大，以为大家坐在一起是因为凳子长，其实是因为彼此都肯挪一点','结尾：写板凳后来被搬进店里靠墙放，晚上门口空着，只有烟头的味道还在'],trap:'容易写成弄堂温情或怀旧散文；只写板凳、烟头盆和拍凳面三样，别抒情。',who:['卖烟的老太太','我','坐在板凳上的人']});
BANK.push({id:'K371',t:'《弄堂的雨，分成三种声音》',g:'scene',d:'hometown',c:'moment',e:'protect',idea:'弄堂里下雨有三种声音：水缸接的、棚布接的、地面接的。三种声音合起来，才是这条街完整的一个下雨天。',mat:['水缸接的那一种最闷，落在缸里只有一个圆点，四周都不响','棚布接的是连绵的一片，鼓起来的布面把雨摊开了，声音是软的','地面积水的最响，脚步一踩就溅开，水花打在水表上啪啪地响','三种声音我从小听分得出哪天下雨大，只凭声音就能决定穿不穿鞋'],how:['开头：从雨落在水缸里的那一声写起，用三种声音依次排出先后','主体：写水缸、棚布、积水三种落雨的声音，各写一个听感的细节','深化：写三种声音合起来才是一条街完整的一个下雨天，拆开我反而认不出','结尾：写去年水缸破了，那一种声音消失了大半年，雨天我还是会先找它'],trap:'容易写成弄堂的诗意描写；只写声音，不写雨里的情绪和回忆。',who:['我','撑伞的邻居','收衣服的母亲']});
BANK.push({id:'K372',t:'《第一次独自坐渡船，我数错了下船的靠岸次数》',g:'rec',d:'hometown',c:'first',e:'guilt',idea:'第一次自己坐渡船，我一路数着靠岸的次数，数到第五次才发现终点不是大人说的那一站，船上没人提醒我。',mat:['大人说过到第三站下的，我上船就盯着船头的站牌，牌上有站名和站数','前两站人下得少，第三站下去大半，船上一下子亮了','第四站上来两个挑担的人，担子里的桶一路晃，没有水洒','第五站过了，我还坐着，船工回头看我一眼，手指了指前头的站牌'],how:['开头：写我上船就盯着船头站牌这件事，用我记下的站数起头','主体：按前三站、第四站、第五站写人怎么上下船，各写一个动作','深化：写那一刻我不敢问下一站在哪，只好把手里的袋口又系了一遍','结尾：写到站下船时人只剩四个，我在船上多坐了十分钟，多坐的账没人给我算'],trap:'容易写成独自出行的心理成长或童年冒险；只写下船次数和船上的动作，别抒情。',who:['我','挑担的人','船工']});
BANK.push({id:'K373',t:'《电话亭拆了，位置换成了一排共享单车》',g:'scene',d:'hometown',c:'change',e:'plain',idea:'电话亭拆掉的位置没有留白，停了一排单车。有人天天从那里出发，去的地方比电话亭里说过的更远。',mat:['亭子拆那天是周一，玻璃门先卸下来，框子后两天才走，地上一小块水泥还湿着','原来的位置划了两个黄框，一个月后框里停满了车，竖着的把手朝着马路','我从前在这个亭子里打过七次电话，现在一次也没打过','现在我在那儿扫码开一辆车，骑去一公里外的图书馆，只需一个数字'],how:['开头：从拆电话亭那天是周一开始写，先写卸玻璃门这个具体步骤','主体：按拆亭、划黄框、停满车、扫码四步写同一块地的变化','深化：写这块地没有变空，只是接住了另一种出门，方式从说话变成了骑走','结尾：写我昨天在那里站了一会儿，亭子的位置现在要靠两排车把手的朝向认出来'],trap:'容易写成时代变迁的感慨；只写同一块地的四次变化，不评价快慢好坏。',who:['我','拆亭子的工人','扫码骑车的人']});
BANK.push({id:'K374',t:'《修车摊那只铁罐，里面全是旧铃铛》',g:'rec',d:'hometown',c:'secret',e:'plain',idea:'修车摊的铁罐装着拆下来的旧铃铛，一个都不扔。摊主说坏了的还能响，只是不再装到车上。',mat:['铁罐放在工具箱脚边，罐口用一块布盖着，布上压着一颗螺母','里面的铃铛大小不一，最大的一只有拳头大，柄上刻着一个字','我问他留着做什么，他说有人车坏了会回来找，找不到原样的就换一个','有一只铃铛被他单独放在罐口布上，擦得发亮，跟别的不是一路货色'],how:['开头：从铁罐和盖在罐口的那块布写起，先写压着布的螺母','主体：写罐里大小不一的铃铛、那只单独擦亮的、摊主的解释三处','深化：写我原以为他舍不得扔，听完才懂这些铃铛上还挂着别人的车','结尾：写那只被单独放的铃铛，后来真有人来问过，摊主没卖，指了指后面'],trap:'容易写成修车师傅的收藏癖或怀旧；只写铁罐、铃铛和他的三句话，不夸手艺。',who:['修车师傅','我','来换铃铛的车主']});
BANK.push({id:'K375',t:'《小区石凳上的六点半，比路灯早十分钟》',g:'scene',d:'hometown',c:'object',e:'down',idea:'石凳上六点半就坐满了人，比路灯早十分钟。看不清脸，先看见一排竹扇在动。搬凳子、挪位置、算日子，坐的人从没换过。',mat:['石凳有四条，正对着一排香樟，正午整条凳子都在树影里','六点半人就来齐了，坐的位置固定，东头先到的是带收音机的那位','太阳落到树冠以下，凳子上的光被切成一块一块，人跟着挪位置','路灯亮起以后大家才起身，起身的顺序正好是坐下顺序的倒过来'],how:['开头：从石凳上的竹扇动写起，用看不见脸写人物出场','主体：按位置、日光变化、起身顺序三段写，写出人多的那一面','深化：写我数过这排竹扇的总数是十把，和凳子的长度刚好，不多一把','结尾：写路灯亮起以后空下来的石凳还留着坐过的印子，要等热气散完才平'],trap:'容易写成小区黄昏的温馨速写；只写竹扇、石凳和人的位置，不写邻里和睦。',who:['带收音机的那位','我','坐石凳的人']});
BANK.push({id:'K376',t:'《两家小店比谁家的灯关得晚》',g:'rec',d:'hometown',c:'contest',e:'admire',idea:'街尾两家小店比谁家的灯关得晚，谁也没赢过。最后决定胜负的不是老板，是那晚谁先接到一个回头客。',mat:['卖杂货的关灯在九点半，修表的要等到十点，两家中间只隔一堵薄墙','关灯这件事两家都在等，谁先关，下楼倒垃圾路过的人就看谁的灯已经黑','有天晚上修表的先接到一个回头客，来取一只早答应好的表，只开了半盏灯','第二天杂货铺照旧九点半关灯，路过的人照旧从修表的窗子下走过去'],how:['开头：从两家关灯时间不同这件事写起，先给两个具体钟点','主体：写比关灯的三个细节：等人经过、回头客、倒垃圾的人会从谁的窗下走','深化：写这场比试谁都没提过，比的是被需要，不是早睡，也不是勤快','结尾：写去年两家一起换了营业时间，一个是九点，一个是九点半，还是没分出先后'],trap:'容易写成小店之间的竞争或人情世故；只写关灯时间和回头客，别总结道理。',who:['杂货铺老板','修表的师傅','回头客']});
BANK.push({id:'K377',t:'《假如弄堂里的声音排成一张清单》',g:'imagine',d:'hometown',c:'object',e:'warm',idea:'假如弄堂里的声音能排成一张清单，我愿意第一个写的是修脚刀在盆里淘三下。这是假设，却让我第一次数清我家附近有多少声音。',mat:['清单第一行是早上六点的垃圾车，倒车两次，一次长一次短','第二行是弹棉花的弓声，只在周三和周六，响四十分钟就没了','第三行是修脚刀在温水里淘三下，老人说过水不热不出屑','最后一行留给我自己家门响的那一声，我永远听不见，所以先写上'],how:['开头：从假设成立的那天写起，说清我手里真有一张纸，第一行先写什么','主体：按清单四条各写一种声音的来源和时间，写清它多久消失一次','深化：写我数完才发现自己记不住的比记得住的多，这些都是我每天经过的','结尾：写我把清单贴在门背后，最后一行留给我家门响的那一声，等哪天有人替我听'],trap:'容易写成想象作文，落点飘到未来；想象只到一张纸的清单，结尾必须回到今天能做的事。',who:['我','修脚的师傅','收垃圾的车']});
BANK.push({id:'K378',t:'《假如这条街回到十年前，谁会先不习惯》',g:'imagine',d:'hometown',c:'change',e:'insight',idea:'假如这条街回到十前，电动车换回三轮，早点摊多三张桌，第一个不习惯的是我——我认不出这些该出现在哪儿的人。',mat:['回到十年前的第一件事是早上，路口的电动车少了一半，三轮车重新占满','小卖部门口那只玻璃罐又摆出来，水果糖五角一颗，罐里是满的','然后是修脚师傅的工具箱，箱盖内侧不用夹纸片，因为还没有纸片','我站在路口数了三分钟，发现不习惯的不是他们变老，是我认不出他们年轻时的样子'],how:['开头：从假设成立的第一天早上写起，用路口的车和摊子的数量开场','主体：按三轮车、玻璃罐、修脚师傅三样各写一句改变，落点都落在同一个人身上','深化：写我想回去的不是那十年，是想看看我现在追着跑的人二十年前在做什么','结尾：写想象做完我还是站在现在的路口，只是下次路过会多看一会儿玻璃罐'],trap:'容易写成纯怀旧或批判现实；想象要有一个具体场景加一个自我发现，不许感慨。',who:['我','杂货铺老板','修脚的师傅']});
BANK.push({id:'K379',t:'《假如那口井还在，我要在井边站十分钟》',g:'imagine',d:'hometown',c:'moment',e:'curio',idea:'假如弄堂中间那口井还在，我要做一件没用的事：在井边站十分钟，看打水的人摇辘轳。看，看桶里的绳一圈一圈缩短。',mat:['井口是一块方石，边上磨出一道凹，是绳子长年勒出来的','辘轳摇起来有固定的节奏，快一下慢一下，像有人在数数','打上来的水先倒掉半桶，说是压桶里的浮泥，再倒一次就清了','我在想象里数过，一桶水摇二十七下就满了，桶底离水面只剩一尺'],how:['开头：从假设那口井还在写起，第一句就说我只做一件事，站在井边看','主体：写井沿的凹、辘轳的节奏、倒掉的半桶水三处，每处给一个数字或动作','深化：写我在井边站了十分钟，什么也没想通，只是记住了二十七下这个数','结尾：写从想象里出来，我在原地站了一会儿，脚下是铺平的地砖，没有井也没有数'],trap:'容易写成对旧生活方式的向往；想象必须落地在手上动作和数字上，不许抒情。',who:['我','打水的人','摇辘轳的手']});
BANK.push({id:'K380',t:'《老房子该不该拆，先看门里那盏灯还亮不亮》',g:'argue',d:'hometown',c:'change',e:'plain',idea:'拆与留不该按房子新旧来分。该看的是门里那盏灯还亮不亮——有人住，拆掉的是家；没人住，拆的是壳。',mat:['留下的理由很硬：这栋楼里还住着十一户，最老的住了三十四年，行动不便','拆的理由也很硬：楼道灯坏了半年没人修，下雨渗水从三楼漏到一楼','我数过楼里还在用的东西：十一口锅、两副拐杖、一只缝到一半的靠垫','所以我的判断是修楼而不是拆楼，先修灯和管道，暂缓整栋的安排'],how:['开头：从同一件事的两面说起，先给支持和反对各自最硬的一条理由','主体：两边各给两个依据，数字和实物都要有，不用名人名言','深化：写出我自己的判断标准，看门里有没有人住，不看楼新旧和价格','结尾：不宣布输赢，只给一个顺序，先修灯和管道，再谈整栋的去留'],trap:'容易写成一边倒的评论，用情绪代替依据；两边依据必须对称，最后必须落到可执行的第一步。',who:['住十一户的老邻居','管弄的街道','我']});
BANK.push({id:'K381',t:'《小区里该不该留一块专门晾被子的地方》',g:'argue',d:'hometown',c:'crowd',e:'insight',idea:'晒被子的地方该不该留在小区里，可以先问一句：现在还有多少被子真的铺在阳台上晒，剩下的去了哪。',mat:['留下的理由是六楼有绳，但每户要爬四层，老人搬不动一床湿的被子','反对的理由是要用这块地停车，车位比被子更贵，这个理由也站得住','我数过一次，三天里共晒出十一床被子，其中六床是电吹风机烘的','我的判断是留，但位置从六楼挪到地下一层入口旁，那儿有风，不占车位'],how:['开头：从同一件事的两面说起，先给支持和反对各自最硬的一条理由','主体：两边各给两个依据，数字和实物都要有，不靠情绪','深化：写我自己的判断标准是这块地除了晒和停还有什么用，别只算谁更需要','结尾：不宣布输赢，只给一个位置建议和一条验证办法，先试一个月看有多少人用'],trap:'容易写成社区服务的空议论；两边依据要对称，最后必须给一个能试的方案。',who:['住六楼的老人','找车位的住户','我']});
BANK.push({id:'K382',t:'《给街道写的一份弄堂声音地图》',g:'apply',d:'hometown',c:'journey',e:'protect',idea:'给街道写一份弄堂声音地图，不是为了保留什么，是为了先听清楚再决定改哪里、拆哪里。',mat:['弄堂里的声音我数出九种，其中四种一个月里至少消失过一回','弹棉花的弓声只在周三和周六响，修脚刀淘水的声音全弄堂只有一处','我把每一种标在图上：位置用红点，时段用铅笔写在点旁边','画到第九种的时候我才发现，图纸上标得最密的一段是上下班的时间'],how:['开头：写清为什么写这份东西，那条弄堂以后什么样我问过三次没人答得出','主体：一条一条列声音，每条写位置、时段和会不会消失，不作评价','深化：第三条我认错，我把施工的敲击写成装卸，第二天去听果然是装卸','结尾：请他们回一句就行，收不收都行，图纸我留在传达室可取走'],trap:'容易写成建议信里堆形容词，或者变成对拆迁的抱怨；必须有一条是承认自己记错并去核对。',who:['街道办事的人','弄堂里的邻居','我']});
BANK.push({id:'K383',t:'《弄堂里那声修伞的吆喝》',g:'scene',d:'culture',c:'moment',e:'warm',idea:'那声修伞的吆喝先是声音，后来才成了我认人的办法：听见拖足的三秒，我就知道今天他出摊了。',mat:['老师傅把摊子摊在梧桐树荫下，油布伞骨朝天摆成半圈，他吆喝一次要拖足三秒','前两秒听着像咳嗽，第三秒才成一句完整的话','我在三楼背单词，听见他拖到第三秒，就知道今天用不着下楼买伞','有一天下大雨他没出摊，我在窗口把那句吆喝默背了三遍'],how:['开头：从三楼窗口背单词写起，让吆喝声先出现，人最后才出现','主体：写三次听见的差别，第三次楼下有人应了一声，声音就拖得更长','深化：写他没出摊的那天，缺席反过来让那声音在屋里留了一整天','结尾：落在我在别处听见同样拖长的尾音，写我当时愣住的那一下'],trap:'容易写成怀旧散文，把吆喝声当配乐；必须写清音量、时间点和一次我没下楼的经过，只写声音就飘了。',who:['我','修伞的老师傅','外婆']});
BANK.push({id:'K384',t:'《庙会上锣鼓停下来的那一秒》',g:'scene',d:'culture',c:'crowd',e:'plain',idea:'庙会最热闹的不是锣鼓，是锣鼓停下来换气的那一秒，所有人的声音一起露了出来。',mat:['锣鼓队过去之后要停三秒换气，这三秒里叫卖声、拖鞋声、小孩哭声全冒了出来','卖糖画的把勺子往石板上一磕，磕出一声脆的，比锣还响','我在人堆里被挤得转了半圈，正好看见两个摊位的布篷挂反了','队伍再来时节奏慢了半拍，说明刚才有人偷过懒'],how:['开头：从被挤得转了半圈写起，人群的动作用一个动词交代','主体：写三秒换气里依次冒出来的三种声音，出现的顺序不能乱','深化：写两个布篷挂反了这种只有走不动的时候才看得见的细节','结尾：落在我记住的不是锣鼓而是那三秒，收笔要短'],trap:'容易写成热闹词罗列的开场；必须靠一个停顿时序来组织，三种声音要按出现的先后排。',who:['我','外婆','卖糖画的师傅']});
BANK.push({id:'K385',t:'《龙舟从我窗前过的那一年》',g:'scene',d:'culture',c:'change',e:'down',idea:'那年的龙舟从我窗前过，鼓声比往年慢半拍，我第一次听出热闹里有人在赶。',mat:['往年六点不到就鼓响，那天到七点十分才听见第一声鼓','外婆把电视音量拧到最大，说晚了就是晚了，不用替他们解释','我趴在窗上看队尾那条船，桨手换得很勤，节奏乱','第二天早上江边剩下六只空瓶子和一串被踩扁的鼓槌'],how:['开头：从七点十分那声迟到的鼓写起，用一个时间点交代全篇','主体：写窗前能看见的三样东西：鼓、桨、换人，动词要落在手上','深化：写外婆说晚了就是晚了那句，说明她去年也在等这个点','结尾：落在第二天江边的空瓶上，写热闹过去以后留下的具体东西'],trap:'容易写成节日气氛散文，温度会飘；必须有一个迟到的时间和一件第二天早上看得见的残留物。',who:['我','外婆','隔壁那条船']});
BANK.push({id:'K386',t:'《春联摊前那支秃了的毛笔》',g:'scene',d:'culture',c:'word',e:'protect',idea:'他一天写不满一条街，我坚持每年先去排队，把当年的第一张春联交到他手上。',mat:['他的毛笔尖只剩三根毛，写到第二十张开始分叉，他就用指甲把岔口掐掉','红纸裁得整整齐齐压在砖头下面，写完一张就往旁边一推','我在旁边站了半小时，他问我要不要写一幅，我说我不会写楷书','他给我裁了最窄的一条，让我写四个字，我写坏了两张'],how:['开头：从那支秃笔的毛尖写起，细节要能看见他掐毛的动作','主体：写摊前的动作：裁纸、蘸墨、推纸，每一步配一句人物的动作','深化：写我那两张写坏的纸，他没扔，把它们卷起来夹在摊子底下','结尾：落在我带回家的那张窄红纸，写上面四个字我至今不敢贴在门上'],trap:'容易写成对联知识的介绍加书法赞美；要有写坏两张纸的难堪场面，抒情一句都不要加。',who:['我','写春联的老先生','买春联的邻居']});
BANK.push({id:'K387',t:'《竹匾在太阳下翻面时的那声响》',g:'scene',d:'culture',c:'object',e:'curio',idea:'晾干货的竹匾全靠人翻，翻的时候竹篾相刮，那声音在整条弄堂是同一个时间的报点。',mat:['竹匾里晒的是虾皮，摊在二楼窗口的竹架上，一天要翻三四次','翻匾要用两手端住边沿抬起来侧过去，不能直接翻，虾皮会撒','竹篾相刮的声音很干，像指甲划过的纸，可是每户都是这个调','我试着自己翻，第一次洒了一半虾皮，那天下楼捡虾皮的人比收虾皮的多'],how:['开头：从二楼窗口那排竹匾写起，先给一个俯视的角度','主体：写翻匾的四个动作顺序，每一步都要写手上的劲道和分寸','深化：写我自己洒了那一次，以及楼下阿姨替我捡起来时说的那句话','结尾：落在那声竹篾相刮上，写它比家里任何一只闹钟都准'],trap:'容易把竹匾写成静物描写；必须有手上的动作和一次洒掉的失败，否则就只剩好看。',who:['我','楼下阿姨','外婆']});
BANK.push({id:'K388',t:'《清明扫墓路上那把只撑住一个人的黑伞》',g:'scene',d:'culture',c:'journey',e:'insight',idea:'从地铁站到墓园要转两趟车，那把黑伞一路只撑住一个人，它一直在等第二个人进来。',mat:['那天没下雨，父亲还是带了那把黑伞，伞面有一块补过，补得很密','从地铁站到墓园转两趟车，单程一小时十分钟，我一路上都在算时间','上坡时路窄，父亲把伞整个倾过来，我半边身子在伞外，肩上湿了一路','走到墓园的坡上他停了一下，把伞收起来，说前面不用撑了，那句他说得很轻'],how:['开头：从地铁口那把补过的黑伞写起，先交代明明没有下雨','主体：写转两趟车和一小时十分钟的路线，用站名和钟表标时间','深化：写上坡时伞倾过来的角度，还有我半边肩湿掉的体感','结尾：落在墓园坡上他收伞那句不用撑了，写我当时没有接话'],trap:'容易写成缅怀父亲的煽情路线，会假；全篇不写想念两个字，情感只能从伞的倾角里出来。',who:['我','父亲','扫墓的邻居']});
BANK.push({id:'K389',t:'《祭灶那晚糖瓜放在灶台的哪个位置》',g:'scene',d:'culture',c:'secret',e:'curio',idea:'祭灶有规矩：糖瓜要放在灶王爷嘴朝的那一侧，放反了，整年的甜都到不了人嘴里。',mat:['腊月二十三夜里外婆把糖瓜粘在灶台的右上角，那是灶王爷嘴朝的方向','她先拿一块试粘，粘歪了用刀背敲下来重来，第二块才粘上','灶台上还摆了三样：清水一碟、糨草一把、糖瓜两块','我问她为什么摆清水，她说不是送他，是让他看清我们喝什么'],how:['开头：从右上角这个位置写起，像在教一件真规矩，方位要说清','主体：写贴糖瓜的两块和贴坏的那一块，动词落在敲和粘上','深化：写清水和糨草各自的理由，把外婆那句解释原样引一次','结尾：落在我后来每次祭灶都摆清水这件事，写我至今说不清为了什么'],trap:'容易写成祭灶的民俗介绍和知识科普；理由必须来自外婆的原话，不要自己补解释。',who:['我','外婆','搬凳子帮我的弟弟']});
BANK.push({id:'K390',t:'《晒鱼干的下午，弄堂的绳子是一口钟》',g:'scene',d:'culture',c:'moment',e:'protect',idea:'整条弄堂的绳子只剩三根，我坚持每年在自家阳台留一个位置，让它还像一条弄堂。',mat:['阳台上和二楼窗口都伸出竹竿，绳子一根根横过弄堂，像过道上的线','晒鱼干的下午三点最香，咸味混着鱼腥味，比菜场还冲','楼下有人打麻将，麻将声和竹竿敲墙声混在一起，节奏居然对上了','一场雨来的时候，几十条绳子一起往回收，邻居们互相喊，收完再比谁晾得多'],how:['开头：从弄堂上空那些横着的绳子写起，给一个仰视的角度','主体：写下午三点的四种气味和四种声音，气味在前声音在后','深化：写收绳那场雨，喊的人和被喊的人要能对上','结尾：落在麻将声和竹竿敲墙对上节奏这件事上，写我站着听了一会儿'],trap:'容易写成弄堂风情散文，气味和声音会互相盖掉；气味写四种、声音写四种，顺序不能乱。',who:['我','楼下打麻将的爷爷','收绳子的邻居']});
BANK.push({id:'K391',t:'《我扔掉了奶奶织了一半的毛衣》',g:'rec',d:'culture',c:'object',e:'guilt',idea:'那件织了一半的毛衣我一直嫌土，后来才明白奶奶织的不是毛衣，是给我预留的一个位置。',mat:['毛线还剩两团，藏在蓝布袋最底下，织到领口第三行就停了','针还插在第三行上，插了半年没拔，我每次开抽屉都绕开它','她说过一句，说天冷了你别嫌它土，我一直当她没说完','我把它扔进垃圾袋那天是因为搬桌子腾地方，不是因为嫌它，可我当时就是那么说的'],how:['开头：从垃圾袋被我重新翻出来写起，织到第三行的针还插在上面','主体：写我扔它的真实原因，只写腾地方，不把嫌弃当成动机','深化：写我重新认识那两团毛线的分量，它不是衣服，是一个没织完的位置','结尾：落在我把那半件毛衣折好放回她的针线笸箩，别的什么都不说'],trap:'容易把自己写成懂事了、感动了；真实动机是腾地方这一点要留着，后半段的不舍不许提前露。',who:['我','奶奶','收废品的阿姨']});
BANK.push({id:'K392',t:'《第一次看清腌酱缸上那层白霜》',g:'rec',d:'culture',c:'first',e:'admire',idea:'外婆说缸口那层白是酱在长，我第一次不信，第一次照着她的话等了四十天。',mat:['缸口结了一层白霜，外婆用筷子挑给我看，说这不是脏，是活着的酱在长','她让我每天开盖透气两次，一次五分钟，我说来不及，她就把闹钟定在我上学前','四十天里我有一周没管，第41天开盖时香味从后门一直飘到楼梯口','缸沿上有一圈深色的印，比现在水面高出不少，那是旧水位留下的'],how:['开头：写第一眼看到白霜时的嫌弃，以及外婆挑起筷子的那个动作','主体：写四十天里我漏掉的和坚持下来的各几件，用闹钟和开盖时间记','深化：写开盖那天的香味路径，从后门到楼梯口，路线要具体','结尾：落在缸沿那道深色印上，写我第一次信了她说的长'],trap:'容易写成科普，介绍酱的制作工序；重点是四十天里我的怀疑和让步，工序一句都不要写。',who:['我','外婆','收酱的邻居阿姨']});
BANK.push({id:'K393',t:'《我把修伞的老师傅认成了收废品的》',g:'rec',d:'culture',c:'mis',e:'insight',idea:'我凭一个纸箱认定一个人是收废品的，后来才知道纸箱里装的是他儿子的画。',mat:['他在楼下摆摊，我看见他脚边有纸箱，就认定这是收废品的','我下楼问他修不修伞，他没抬头，只说了句伞骨断了几根','我嫌他爱理不理，转身走了，那把伞继续在雨里淋着','后来我在他纸箱里看到一叠素描，画的是这栋楼的天窗，一张一张夹着'],how:['开头：从我认定他是收废品的那个理由写起，理由越具体越好','主体：写我那天的两句对话和他的三个动作，态度差要从动作里出来','深化：写我在纸箱里看见画的那一秒，前面所有的判断都要在这里翻一次','结尾：落在那叠画上，写我后来当面道过一次歉，他只提了画没有提伞'],trap:'容易写成知错就改的模板；必须把误判的理由写实，画这件事要放到最后才出现。',who:['我','修伞的老师傅','收废品的真老板']});
BANK.push({id:'K394',t:'《端午和邻居比赛包粽子，我输了三个》',g:'rec',d:'culture',c:'contest',e:'plain',idea:'比赛我输了三个粽子，赢回来的是一句我到现在也没弄明白的话：包得快的是心急。',mat:['我和对门的{邻居奶奶}比赛包粽子，两家各摆一张桌子，在楼道口比','我包得紧、用线多，她包得松，只用一根线，说这样煮出来不硬','我包得快却漏了三个，她慢悠悠一个没漏，最后数下来我少三个','她收摊时说了一句慢不是因为手笨，是因为等它凉得下来，句尾还有半句我没记住'],how:['开头：从楼道口两张桌子摆开写起，把比赛范围缩到只比包法','主体：写两种包法各怎么包，用线数、松紧和漏的数量做对比','深化：写输三个这件事我嘴上不服，最后承认输在她的慢，不在我的快','结尾：落在那句没记住的半句话上，写我后来一直没想明白她为什么笑'],trap:'容易写成比赛的输赢报告加一句鸡汤；输的原因要落在手艺差异上，结尾那句没记住的话要留着。',who:['我','邻居奶奶','外婆']});
BANK.push({id:'K395',t:'《晒鱼干的人家从三户变成一户》',g:'rec',d:'culture',c:'change',e:'insight',idea:'弄堂里晒鱼干的从三户减到一户，不是没人爱吃了，是其中两户人家搬走了。',mat:['三年前二楼、三楼和对门各有一面竹架，今年只剩对门那一面','我小时候把鱼干当零食，被允许直接从绳上拿一条咬着吃','那两户搬走的时候没送鱼干，只在门口贴了一张纸，写的是新地址','今年对门晒的量比三年前多一倍，绳子换了新的，我阳台上那两根旧的还插着'],how:['开头：从今年只剩一面竹架写起，用数量的减少开篇，不加议论','主体：写三年前和今年各自的实况，把变化列成具体的物品','深化：写那张贴地址的纸条，和我阳台上两根没人收的旧绳子','结尾：落在旧绳子上，写我家阳台现在还插着它们'],trap:'容易写成怀旧控诉式的老弄堂感慨；数量和物品要精确，不许用很多都变了这类空判断。',who:['我','对门的阿姨','搬走那户的小孩']});
BANK.push({id:'K396',t:'《跟外婆坐一趟船去她出嫁的那个镇》',g:'rec',d:'culture',c:'journey',e:'warm',idea:'外婆带我去她出嫁的那趟船不是为了怀旧，是想让我看清她离开家那天带了几样东西。',mat:['我们坐的是从十六铺开出去的短途船，晃了两个半小时，她一路没晕','她指着水面说当年是往那边走的，我看见的是货船和货船','她在家只带了四样东西出门：两身衣服、一只针线笸箩、一把梳子、一小块姜','我问她为什么记得这么清楚，她说那天东西分两次运，第二次只剩姜和梳子'],how:['开头：从十六铺开出的船写起，先写船怎么晃和我扶栏杆的动作','主体：写她一路上指的三处地方，每一处都要配上我的误读','深化：写四样东西那一段，让她自己说，我只记她说的顺序','结尾：落在返程的船票上，写我把票根夹进了她那本旧字典里'],trap:'容易把外婆的过去写成苦难叙事；四样东西要写得具体，情感只从我问问题的方式里露出来。',who:['我','外婆','开船的师傅']});
BANK.push({id:'K397',t:'《外婆竹匾底下压着一张看不懂的字条》',g:'rec',d:'culture',c:'word',e:'admire',idea:'竹匾底下那张纸上是我的名字和三个我不认识的字，最服人的是她从来没有解释过。',mat:['翻竹匾找剪刀时纸片掉了出来，字是蓝黑墨水写的，边角被虫啃了一小块','上面是我的出生年月日，还有一行三个字，最后一笔拖得很长','我问外婆，她说是随手写的，让我别看，我等她出门又看了一遍','我把纸片夹进语文书，后来被我不小心当书签撕掉了一角'],how:['开头：从翻竹匾找剪刀写起，让纸片在一个具体动作里掉出来，不铺陈','主体：写纸上的字迹、能看清的字和虫啃的那一角，看不清的就说看不清','深化：写我问外婆那一次和她出门后我又看一遍那一次，两次的动作要对上','结尾：落在我把纸片当书签撕掉一角，写我懊悔的是没敢问她'],trap:'容易写成祖孙情深的温情戏，把字条当成谜底揭；三个字不必解开，不许编一个漂亮的答案。',who:['我','外婆','语文老师']});
BANK.push({id:'K398',t:'《重阳那天整条弄堂一起插茱香》',g:'rec',d:'culture',c:'crowd',e:'warm',idea:'重阳插茱香本来是一家的事，可我记事里那整条弄堂都在往自己的门上插。',mat:['早上八点，外婆把一小把茱香递给我，说插门框左上角，要插成一排','对面阿婆插了三枝，我们家插两枝，我嫌少，外婆说够用就行','到中午弄堂里每扇门上都有一枝，有的深有的浅，像统一发的又不像','下午有人挨户问插了没有，答一声算过，问到我家时外婆替我答了'],how:['开头：从递给我一把茱香写起，先写数量和位置这两个规矩','主体：写从二楼到一楼挨家看茱香的样子，每户插几枝要写得不一样','深化：写那声挨户问插了没有，写外婆替我回答的那一嗓子','结尾：落在我晚上开门闻到茱香的干味，写这件小事我记到现在'],trap:'容易写成节日习俗介绍加民俗感叹；数量和位置要真实，感叹一句都不要写。',who:['我','外婆','对面阿婆']});
BANK.push({id:'K399',t:'《写春联那天下午外婆写坏了七张纸》',g:'rec',d:'culture',c:'moment',e:'plain',idea:'她一下午写废七张纸，其中六张是因为我一直在旁边问东问西。',mat:['红纸裁了二十张，墨磨干了两次，中途添过一次水','第七张废纸被她揉成团扔进废纸篓，我在里面认出上面是我催的字','她说写春联不能被人盯着，写到一半分神，字就会散架子','那天最后她只贴了两扇门，剩下的一直没贴，去年才贴上去'],how:['开头：从废纸篓里那个纸团写起，先写我怎么认出那张纸','主体：写一下午的过程，用纸数和水数做记号','深化：写她那句不能被人盯着，并把我的追问一条条列出来','结尾：落在去年才贴上的那扇门上，写这件事拖了一年多'],trap:'容易写成温馨的手艺传承加外孙女的感动；七张纸的原因要落在我身上，感动不许提前。',who:['我','外婆','在门口贴联的爸爸']});
BANK.push({id:'K400',t:'《老式月饼的豆沙馅我一口吃成了枣泥》',g:'rec',d:'culture',c:'mis',e:'curio',idea:'我一直以为老式月饼里那团白是豆沙，咬开才知道它是整个家里一年的秋天。',mat:['我咬开一块双黄莲蓉，里面那团白的味道和楼下点心铺的完全不一样','我脱口说出这是豆沙，外婆说这是枣泥，枣泥要三斤鲜枣才做得出一斤','她说做枣泥得等一场秋天的太阳，不晒足就不甜，晒过头就发酸','我在窗台上找到一小块去年的枣泥，硬得像石头，边上还留着筛网的印'],how:['开头：从我脱口而出那三个字写起，写清我当时正在吃的是什么','主体：写外婆讲的三斤换一斤和那场秋天的太阳，数字要准','深化：写窗台上那块硬得像石头的枣泥，还有它上面的筛网印','结尾：落在我尝了一小口没敢嚼这件事上，写我记住的是它的硬'],trap:'容易写成风味介绍加抒情；数字和工序只留外婆原话一句，抒情一句不加。',who:['我','外婆','楼下点心铺的师傅']});
BANK.push({id:'K401',t:'《第一次自己蒸月饼，面糊从模具里爬出来了》',g:'rec',d:'culture',c:'first',e:'down',idea:'第一次蒸月饼我把面糊调得太稀，出模的时候爬了一案板，那是我第一次尝到失败的形状。',mat:['面糊调稀是我自己改的水量，模具还是外婆用过的那只铁的','上笼前看着没问题，蒸好揭盖时面糊从四个角同时溢出来，铺了一案板','外婆没说话，先关火，再拿刀把案板上的一块一块铲起来','那块溢出来的月饼后来她自己吃了，说皮太软不成形，我吃的是边上那几块'],how:['开头：从揭盖那一刻写起，面糊从四个角同时出来，动作要写清','主体：写我错在哪一步，只写水量那一处，不写别的工序','深化：写外婆关火、铲饼、自己吃软皮这三步，每步一句话','结尾：落在她吃下去那句皮太软上，写我在旁边站着没出声'],trap:'容易写成失败后痛哭加长辈安慰，太套路；外婆的三步动作要写得冷静，她一句安慰都不说。',who:['我','外婆','在厨房门口看的爸爸']});
BANK.push({id:'K402',t:'《答应中秋送一盒月饼，我迟了两年》',g:'rec',d:'culture',c:'promise',e:'warm',idea:'我答应过每年中秋给外婆送一盒月饼，第一年送了，第二年忘了，第三年补上时她只问了一句。',mat:['第一年我挑的是奶黄的，盒子是学校门口那家店买的，我提前三天去过','第二年我在准备月考，忘了这件事，她那天一个人在楼下坐着吃了一块','第三年我补送的时候，她拆开只看了一眼就问，说你今年考得怎么样','那盒月饼最后是她分给楼下两个小孩的，我自己一块也没吃到'],how:['开头：从第三年我拎着盒子进门写起，她第一句话不是问月饼','主体：写三年里的三件事，第一年写细，第二年写短，第三年写动作','深化：写她拆开只看一眼这个动作，以及楼下那两个小孩','结尾：落在我一块也没吃到这件事上，写我心里想的却是别的'],trap:'容易写成愧疚痛哭加外婆原谅，煽情过重；第二年那件事越短越好，重点在她今年的第一句话。',who:['我','外婆','楼下的两个小孩']});
BANK.push({id:'K403',t:'《答应冬至前腌一缸酱，我拖了两个冬天》',g:'rec',d:'culture',c:'promise',e:'guilt',idea:'答应过的事在日历上都有一个日期，我的那两个日期是去年十二月二十三和今年十二月二十三。',mat:['第一年我准备买瓶子，钱不够，把这件事推到了下一年','第二年瓶子买好了，可那周我在补考，只打了电话说等两天','酱是外婆自己腌的，她从不提，只有缸沿上的水痕比去年高了一点','今年我买了五斤枣，结果枣放到第二周就软了，问我怎么办'],how:['开头：从两个日期写起，只写日历上的日子，不写心情','主体：写两年前后的四次搁置，每次都是一件具体的事','深化：写缸沿上高出来的那一点水痕，不加一句感慨','结尾：落在那五斤软掉的枣上，写我这次打算自己动手'],trap:'容易写成拖延的自我检讨报告；四次搁置要各带一件实物，检讨的话一句都不写。',who:['我','外婆','卖枣的摊主']});
BANK.push({id:'K404',t:'《我把老式收音机搬进了自己房间》',g:'rec',d:'culture',c:'object',e:'protect',idea:'我把它搬进房间不是为了听，是为了让它别在客厅里被人当家具搬来搬去。',mat:['收音机是{外婆}的，木壳，边上贴着一张手写的频率表，纸已经黄了','原来它放在客厅矮柜上，电视一来它就被推到最里面，两年没人动过','搬那天我用手托着底座挪的，怕的是磕掉漆，我数了七步路','搬完后我给频率表描了一遍线，那张纸上最清楚的一格是96'],how:['开头：从它被电视挤到最里面那件事写起，用位置的变化开篇','主体：写搬的七个步骤，动词落在托和挪上，路上写一次差点磕到','深化：写描频率表这件事，写那格96和纸上其他字迹的模糊','结尾：落在我现在每天开一次它写我听到什么，不写感想'],trap:'容易写成怀旧散文加保护文物的正义感；搬家要一步一步写，结尾只写听到的节目名。',who:['我','外婆','矮柜原来的主人']});
BANK.push({id:'K405',t:'《那面镜子被送出去以后，还藏在纸箱后面》',g:'rec',d:'culture',c:'change',e:'curio',idea:'剃头摊收走那天他把镜子送了人，我却在对面杂货店的纸箱后面又见到了它。',mat:['镜子系在树上六年，风一吹就跟着晃，镜面有一块用胶带补过的裂','收摊那天他把它送给对面杂货店，说店里放面镜子显亮','后来我在杂货店纸箱堆后面又看到那面镜子，边上还夹着价目表','价目表上的剪发价格还是六年前的数字，我没敢拿出来问'],how:['开头：从树上那面镜子写起，用它给那个位置定位','主体：写收摊、送镜子、我又见到它三件事，按时间顺序排','深化：写镜面那块用胶带补过的裂，和还夹着的旧价目表','结尾：落在我没敢拿出来问这件事上，写我今天路过还会往纸箱后面看'],trap:'容易写成怀旧感慨或者替理发手艺宣传；镜子只是普通旧物，不许写成象征，评价不要写。',who:['我','理发师傅','杂货店老板']});
BANK.push({id:'K406',t:'《我以为补锅只在白天出摊，直到在弄堂尽头撞见他》',g:'rec',d:'culture',c:'secret',e:'curio',idea:'我以为补锅只在白天出摊，直到在弄堂尽头撞见他夜里在修一只豁口的奶锅，才知道这条弄堂还有一半是活的。',mat:['那天我跟着炒货的叫卖声走到弄堂最里头，墙根蹲着一个人，面前一只炭炉','他手里不是锅，是一只豁了口的奶锅，锅底薄得能看见炭火的红','他修的都是别人不要的东西，价谈得很低，接钱用一只旧铁皮盒','他说这条弄堂的规矩是白天的活归白天，夜里十点以后接私活，不挂招牌'],how:['开头：从我跟着叫卖声拐进弄堂最里头写起，交代我为什么往里走','主体：写我看见的三样东西：炭炉、奶锅、旧铁皮盒，按出现先后','深化：写他夜里十点以后接私活不挂招牌这条规矩，把我问和他的答对上','结尾：落在修好的奶锅被拎走时锅底反了一下光这件事上，写我站了一会儿'],trap:'容易写成市井奇闻，重点落在补锅手艺的奇观上；规矩和价钱的细节要写清，怀旧感叹一句不加。',who:['我','夜里补锅的人','奶锅的主人']});
BANK.push({id:'K407',t:'《元宵比背灯谜，我输给了一张旧报纸》',g:'rec',d:'culture',c:'contest',e:'admire',idea:'和爸爸比背灯谜我背出七个，他一个没背出来，却从一张旧报纸上读出了答案。',mat:['比赛规则是各背五个，我准备了纸条，爸爸什么也没准备','我背到第五个卡住了，纸条在口袋里被攥成一团','他不背，走到书架边翻出一张旧报纸，指着上面的字说这个谜面是十二年前的','旧报纸是1998年的，谜底那一栏印得很淡，答案是三个字'],how:['开头：从比赛前我藏纸条这个动作写起，写出我的得意','主体：写我背到第五个卡住和爸爸不背而去翻报纸两个动作对照','深化：写旧报纸上那行淡字和三个字答案，报纸要具体到年份','结尾：落在他那句话上，写我当时没回嘴，现在想想他是对的'],trap:'容易写成父女温情再加金句结尾；输赢要落在两种准备方式上，报纸上的字要抄准。',who:['我','爸爸','旧报纸']});
BANK.push({id:'K408',t:'《我抄了一整本字帖，只学会了两个字》',g:'rec',d:'culture',c:'word',e:'warm',idea:'一整本字帖抄下来，我到现在只在自家春联上认出两个字：平安。',mat:['字帖是硬纸的，第一页讲换墨讲得比字还多，我抄了三十七个字','三十七页里有四页是同一个字：福，写法各不相同，右上那一撇越来越短','我抄满那一本花了两个月，最后一页没抄完，因为要中考了','我家门口贴的那张里，我能一眼认出来的只有平安两个字，写得很一般'],how:['开头：从硬纸字帖和第一页讲换墨写起，语气带一点自嘲','主体：写三十七页里同一页的四次不同写法，用笔画长短说明','深化：写两个月和没抄完的最后一页，时间线要清','结尾：落在门口春联上那两个认得出的字，写我看见时的停顿'],trap:'容易变成励志学书法的文章；只写笔画和时间，不写坚持啊努力这类词。',who:['我','同桌','买字帖的爸爸']});
BANK.push({id:'K409',t:'《我漏掉了外婆晒鱼干的那天》',g:'rec',d:'culture',c:'moment',e:'guilt',idea:'她说收网在下午三点半，我那天在球场，回来时竹竿已经空了，绳子上什么都没剩。',mat:['她上午就摆好架子，说三点半收，中途要翻两次；我出门看了一眼，说三点半我不在','我那天打球拖到五点，回来竹竿还挂着，匾里的鱼干已经收进纸箱','她没提这件事，只问我球打得好不好，后来我自己翻她相册才发现那天下午她拍了七张照片'],how:['开头：从空竹竿写起，不解释我为什么不在，让缺口自己说话','主体：写我出门前那一句承诺、球场的两小时和回来时的空竹竿','深化：写她只问我球打得好不好，以及后来相册里的七张照片','结尾：落在那第七张照片上，写那一秒我坐在床沿没动'],trap:'容易写成愧疚痛哭加外婆体谅；她的反应一句指责都没有，照片这个细节必须放在后面。',who:['我','外婆','一起打球的同学']});
BANK.push({id:'K410',t:'《第一次没去成庙会，我在门房等了一整天》',g:'rec',d:'culture',c:'first',e:'guilt',idea:'外婆答应带我去庙会，那天她临时没去成，我却把一整天过成了一场等待。',mat:['她前一晚把票钱和零钱都装进我口袋，说九点在门房等，晚了就不等','那天早上她发烧去了医院，走之前只说了一句，说今天不去了','我八点五十就坐在门房石墩上，零钱数了三遍，九点十分才走开','庙会十点才开集，我后来自己去了一趟，一个人看了一上午的摊，人多得走不动'],how:['开头：从口袋里那把数了三遍的零钱写起，先写她前一晚的动作','主体：写等待的三段时间：八点五十、九点十分、十点开集，只写我做的动作','深化：写她打电话只说一句今天不去了，写我不肯先挂','结尾：落在那一个人的庙会上，写那天的摊我一个也没记住'],trap:'容易写成一老一小互相体谅的温情戏；三段时间要具体，别让外婆提前安慰我。',who:['我','外婆','门房的大爷']});
BANK.push({id:'K411',t:'《灯谜摊上那个说不清的规矩》',g:'argue',d:'culture',c:'contest',e:'down',idea:'灯谜摊的规矩本身没问题，问题是我想赢，却不肯按规矩先把那一元钱付出去。',mat:['摊主说猜中给二元猜错不退，每人先交一元，我交到一半就收了回去','我第一题猜中，第二题是拆字谜，我猜了三次错在笔画上','错题摊主不解释，只把谜面翻过来，背面写着他自己的答案','摊主一天收三十来块钱，遇上小学生猜中了他还多讲一遍为什么'],how:['开头：从我少交的那五毛钱写起，用一件小事带出整套规矩','主体：写交钱、猜两次、摊主翻谜面三个动作，规矩在动作里','辨析：写我原本以为摊主小气，其实是我不守前半条规矩，位置要摆正','收束：结尾写我现在每次先付够再猜，只写我的做法，不劝别人'],trap:'容易写成批评摊主贪小利，把人物写成反面;误会的来源必须写在我自己身上，不许怪摊主一句。',who:['我','灯谜摊主','外婆']});
BANK.push({id:'K412',t:'《春联上那个好字到底该不该多一横》',g:'argue',d:'culture',c:'word',e:'insight',idea:'多一横是外公那辈人的讲究，我赞成把字写好，不赞成为了守规矩把字写得难看。',mat:['外公写好字时把竖笔往上多带一小横，像戴了一顶帽子，写了四十年','我八岁照着写，被他说少了一笔不像样，我那时以为他嫌我笨','去年他手抖，那一横写成了两个小点，贴在门上没人说不好','今年他没到，{爸爸}照着旧联描，那一横描成了长长的一竖，也没人返工'],how:['开头：从多出来的那一横写起，先只写这一笔，不作解释','主体：写练字本、手抖那年、描字今年三件事，按年份排','辨析：分清把字写好和照着规矩描，落在好不好看这个具体问题上','收束：结尾写我今年怎么处理那一笔，只写我自己的做法，不号召别人'],trap:'容易把一字之差拔高成家族美德；只写这一笔和三次落笔，解释留给读者。',who:['我','外公','爸爸']});
BANK.push({id:'K413',t:'《所有闹钟在同一个早上同时失效》',g:'imagine',d:'future',c:'moment',e:'curio',idea:'全城十六个闹钟一起停摆那天，我第一次发现没有闹钟也能醒，只是每个人醒得不一样。',mat:['我们家三个闹钟加楼上五户一共十六个，那天早上没有一个响','我是被楼下铁门响醒的，比平时早了十二分钟','街上早餐铺的蒸笼照常冒气，没人抬头看天，也没人提这事','晚上九点它们又同时响起来，像刚想起来自己该上班'],how:['开头：从十六个闹钟一起不响写起，先写躺着等它响的那几秒','主体：写我自己醒来的时间和当天三件事的时间点，逐个落到钟点','深化：写早餐铺和街坊的反应，他们全当没发生，只有一句轻声的抱怨','结尾：落在晚上九点它们同时又响起来，写那一晚我们谁都没有去关'],trap:'容易写成城市崩坏或灾难片；时间点要写准，生活细节优先，不许出现混乱和惊慌。',who:['我','爸爸','楼上五户']});
BANK.push({id:'K414',t:'《我的影子开始自己排日程》',g:'imagine',d:'future',c:'change',e:'insight',idea:'我的影子从那天起有自己的一天：它比我早到学校，午休时独自站在走廊尽头。',mat:['早上七点十分影子已经在校门口的公示栏前站着，好像在看通知','第一节课它在教室后面，我在讲台边，两者隔了整个班','中午它一个人走进图书馆，我在食堂，它比我晚回来十分钟','傍晚我在操场找它，看见它排在小卖部门口，跟三个人的影子一起'],how:['开头：从我发现影子没跟着我到校门口写起，先写发现的那一刻','主体：写一整天里影子四处去过的四个地方，按时间顺序排','深化：写我追问它和它不回应的沉默，重点写我不再追这件事','结尾：落在我不再找它，它自己回来了这件事上，写我松了哪一口气'],trap:'容易写成恐怖故事或怪力乱神；设定只当作行程表，落点必须在关系的改变上。',who:['我','我的影子','班主任']});
BANK.push({id:'K415',t:'《洗手间那面镜子只照出昨天》',g:'imagine',d:'future',c:'object',e:'curio',idea:'那面镜子只肯照出昨天的我，我花了三天才接受，并且开始靠它补上迟到的一天。',mat:['第一次照出来我穿着校服，我说我今天穿的是那件灰的','镜子里的我手上没有创可贴，我的创可贴是昨天贴的','第二天我特意把手贴在镜面，镜里的手慢了一拍才跟上','第三天我站在镜前不动，镜里的我先抬手理了一下头发'],how:['开头：从我第一次照出昨天的那天写起，先写我照完立刻又照了一遍','主体：写三处细节：衣服、创可贴、慢一拍的手，按出现次序','深化：写我第三天故意不动，镜子里的我反而先动，这个反转要交代清楚','结尾：落在那天我开始相信它能照到明天的傍晚，写我在镜前多站了一会儿'],trap:'容易写成恐怖镜像设定；只做时间差这一个玩法，不加血、不加伤害、不加巧合惊吓。',who:['我','值日生','镜子']});
BANK.push({id:'K416',t:'《课桌记住了我昨天写下的每一个字》',g:'imagine',d:'future',c:'object',e:'warm',idea:'课桌从上周起会把我写过的句子记在抽屉里，字迹比我写得整齐得多。',mat:['我上周写的三句读书摘抄，周一早上在抽屉里又出现了，字变圆了','字不是原句，标点被挪了位置，逗号跑到了引号后面','课桌只记写在它身上的，写在纸上的它不记，我试过三次','有一次它记了我的名字，笔画比我平时多一笔，我描了半天才抹掉'],how:['开头：从我在抽屉里看见自己的摘抄又出现写起，先写我以为看错','主体：写三处变化：字形、标点、只认写在桌面上的字','深化：写它记下我名字多一笔那一次，我描了很久才抹掉','结尾：落在我开始把想记的话先写在桌面上这件事上，写这半个月我说了多少话'],trap:'容易把设定当成超能力滥用；只保留记忆功能，规矩必须有限度，不许变成万能。',who:['我','课桌','同桌']});
BANK.push({id:'K417',t:'《学校食堂的菜单印着明天的菜》',g:'imagine',d:'future',c:'crowd',e:'plain',idea:'食堂菜单提前一天印出来，全校提前知道明天吃什么，于是第二天没人再问。',mat:['周一贴出周二的菜单，红烧肉、番茄蛋汤、炒青菜，三样都不贵','有人周一中午就来打听过，问周二有没有排骨，被窗口师傅赶走','周三菜单上印着糖醋排骨，周三中午十分钟卖完，师傅加了两次','到了周五没人再抬头看菜单，大家已经知道周五吃面'],how:['开头：从周一贴出周二菜单写起，先写公告板前围了多少人','主体：写一周里三天的三件事：打听、加菜、没人再看菜单','深化：写打听过的那个人被赶走的对话，让他自己的话最好笑','结尾：落在周五没人抬头那一幕上，写我们已经不再问了'],trap:'容易写成对食堂的抱怨；菜名和人数要具体，落点在习惯的变化而不是批评食堂。',who:['我','窗口师傅','班主任']});
BANK.push({id:'K418',t:'《地铁在两点十七分多停了一站：博物馆站》',g:'imagine',d:'future',c:'journey',e:'curio',idea:'两点十七分地铁总会多停一站，站台空得像刚被清空，那里只有我可以下。',mat:['它多停的那一站叫博物馆，扶梯口贴着一张旧纸，纸上的日期停在十年前','站台上没有人也没有风灯，报站的女声把这一站念得特别轻','车门开着时能看见对面墙上挂着一排校服，全是我们这一届的尺码','我试过不下车，车就开走，下一天同一时间它还来'],how:['开头：从我被多停的那一下写起，先写车厢里所有人的反应','主体：写这一站的四样东西：旧纸、空站台、轻声音、校服尺码','深化：写我没下车那次，车开走时所有人的表情，比下车那部分更重要','结尾：落在第二天它还来这件事上，写我连续三天都在门边站着'],trap:'容易写成闯进另一个世界的探险；站点不许出现奇怪的人或危险，重点写克制和好奇。',who:['我','同桌','报站的女声']});
BANK.push({id:'K419',t:'《我写下的字第二天会自己排队等校稿》',g:'imagine',d:'future',c:'word',e:'plain',idea:'我在草稿本上写的句子第二天会自己排成队列，等着被印成铅字，等不到就退回。',mat:['我写的一句吐槽第二天排在第三位，前面两句我不认识，也没写过','它们旁边都盖了一个小方印，方印越靠后颜色越淡，我算了算','我第一周没理它们，第三周我抄下三句，作者栏写的是我的名字','第四周我故意写得难看，退回的稿子里有一张背面写着：请重写一次'],how:['开头：从我第一周在草稿本上乱写的那天写起，先写纸是怎么用旧的','主体：写三周里我看到的排队和方印，说明颜色变淡这个细节','深化：写那三句被我抄下来的句子和作者栏，重点写我的犹豫','结尾：落在那张背面写着请重写一次的稿子上，写我第二天真的重写了'],trap:'容易写成文字成精的奇观；只写排队这个玩法，人物心里怎么想才是重心。',who:['我','语文老师','草稿本']});
BANK.push({id:'K420',t:'《每个人手机里都有一个只记录犹豫的相册》',g:'imagine',d:'future',c:'secret',e:'insight',idea:'我的相册里有一个锁着的文件夹，里面全是我看了很久没点的东西。',mat:['里面是三百多张截图：查了一半的火车票、写好又删掉的消息、点开就退出的外卖页','最上面那张是我妈说要不要报补习班，我打字打了六行删了六行','相册会自己按日期整理，还会给我一个数字，写着你今天犹豫了二十三次','我有一次想全删，手指停在确认键上，最后点了收藏'],how:['开头：从我发现这个被锁住的文件夹写起，先写我第一次解锁的那个晚上','主体：写三类截图：票、消息、外卖，每类举一个具体例子','深化：写那个六行字打了又删的消息，以及相册给出的犹豫次数','结尾：落在我的手指停在确认键上，写我最后做了什么选择'],trap:'容易写成焦虑症自白或者隐私窥探；不批评任何人，落在克制这个动作上。',who:['我','妈妈','手机']});
BANK.push({id:'K421',t:'《第一次有一支笔替我把作业写完了》',g:'imagine',d:'future',c:'first',e:'down',idea:'那支笔第一次自己写完作业时，字比我好看，我的第一反应是把它扔了。',mat:['写完的作业一共三道大题，最后一道有六步，它写出来的步骤比我少两步','步骤少的部分是对的，我用草稿纸重算了一遍才敢承认','老师说这次写得清楚，还问我最近是不是想了很久，我什么也没答','我把那支笔放进了笔袋最里层，一整个学期没有再用它'],how:['开头：从作业本上出现陌生笔迹那天写起，先写我第一眼看到时的反应','主体：写三处：少两步的解答、被老师问、被我藏起来','深化：写我重算那一遍的过程，用算式说话，不用形容词','结尾：落在那支笔在笔袋里躺了一学期这件事上，写我最后怎么处理它'],trap:'容易写成作弊的猎奇故事；不追究责任，落点在我自己的复杂心情上。',who:['我','那支笔','语文老师']});
BANK.push({id:'K422',t:'《天气预报可以预约，那天我真的点了晴》',g:'imagine',d:'future',c:'contest',e:'plain',idea:'气象服务推出预约功能，我第一次给周末点了晴，代价是那个周末全城都不能下雨。',mat:['界面上有一个圆钮，按下去能选未来七天的任何一天，写上理由','我给周六点了晴，理由写了三个字：要看比赛','周五夜里下了一阵雨，四十分钟就停，周六一早云散了','周日我一整天都在看天，心里清楚那不是我挣来的，所以不敢说'],how:['开头：从我第一次打开预约界面的那个晚上写起，先写那三个字的理由','主体：写周五夜里那四十分钟的雨和周六早上的云，写得客观','深化：写我不敢跟别人说的那层原因，重点写我知道那不是我的功劳','结尾：落在周日我一整天都在看天这件事上，写我的心情很复杂'],trap:'容易写成呼风唤雨的得意；代价要写得清楚，重点是那份不敢说出口的心虚。',who:['我','爸爸','界面上的那个圆钮']});
BANK.push({id:'K423',t:'《我给我自己发消息，回复的人比我大两岁》',g:'imagine',d:'future',c:'mis',e:'warm',idea:'我给一年后的自己发了条消息，回复的人比现在的我大两岁，口气像已经很熟了。',mat:['我写的是明年中考完想干什么，他回的是：你会先睡三天，别安排事','第二条我问他还记不记得{同桌}，他回了一句在，却加了个括号','括号里写着我现在不敢看的四个字，我读了三遍才读出来','临了他说了一句别给别人看这条消息，然后这个账号就再没上线过'],how:['开头：从我按下发送的那一刻写起，先写我发的是什么和为什么发','主体：写三条回复，尤其是第二条那个括号，重点在括号里的字','深化：写他为什么要加括号，以及我读到第三遍的心情','结尾：落在这个账号再没上线这件事上，写我后来把它置顶了'],trap:'容易写成跨越时空的抒情故事；回复内容要短、要具体，抒情交给读者。',who:['我','一年后的我','同桌']});
BANK.push({id:'K424',t:'《我答应把那道难题留到明天，可明天被人改掉了》',g:'imagine',d:'future',c:'promise',e:'guilt',idea:'我把不会的题抄在便签上答应第二天再看，第二天便签上的字变了答案。',mat:['我抄的那道题有一步用了另一种方法，我在旁边写问号','第二天便签上的答案填上了，而我那一栏还空着','那行新字写得比我小一点，末尾多了一个句号，我平时不写句号','我后来还是自己重做了一遍，做完才发现两种解法都对'],how:['开头：从我把便签贴在书桌前写起，先写那天为什么答应自己','主体：写便签上多出来的那行字，重点写句号这个小差别','深化：写我后来自己重做一遍的过程，两种解法都对这个结果要交代清楚','结尾：落在两种解法都对这件事上，写我决定还是用自己那一版'],trap:'容易写成自我怀疑的独白；重点是那道题两种解法都成立，愧疚要落到实处。',who:['我','数学老师','便签']});
BANK.push({id:'K425',t:'《电梯多了一层，只有我一个人能按那个钮》',g:'imagine',d:'future',c:'change',e:'plain',idea:'老楼加装电梯后多出一层楼，物业说从来没有这一层，可我按住过那个钮。',mat:['按钮在负一和二楼之间，长得比别的窄，我第一次按以为是自己看错','它亮了，门开，里面是空的，只有一扇窗，窗外是我的小学','我在那层站了两分钟，灯是亮的，能听见楼下有人说话','第三次我再去按，钮已经按不动了，物业说可能是错觉'],how:['开头：从我第一次按错位置说起，先写那个钮看起来怎么不对','主体：写那一层里的三样东西：空的、窗、楼下的人声','深化：写我第二次特意去找它却没有这一层的落差','结尾：落在物业那句可能是错觉上，写我至今没跟他们争过'],trap:'容易写成灵异故事或恐怖氛围；不写鬼，不写危险，重点写那种不敢说出口的怀疑。',who:['我','物业','妈妈']});
BANK.push({id:'K426',t:'《每次说谎，教室墙上就会多一块砖》',g:'imagine',d:'future',c:'moment',e:'admire',idea:'我们班后墙上多出的砖都对应一件没被说出口的真话，所以那面墙越来越像一本账。',mat:['第一次是{同桌}说没事，他手背上贴着的创可贴出卖了他，那天多一块砖','砖的颜色比旧墙浅，位置在窗子左边，从地面一直排上来','我数过，学期末有二十九块，减去被擦掉的三块，剩二十六','擦掉的那三块是我自己的，我说了实话，砖就自己淡下去'],how:['开头：从后墙上第一块新砖被同学发现写起，先写它出现的那个课间','主体：写三件事：创可贴、砖的颜色、擦掉的那三块，按时间排','深化：写我擦掉自己那三块的过程和心里的犹豫，别写成英雄行为','结尾：落在学期末的二十九块这个数字上，写我回家路上还在算'],trap:'容易写成道德寓言或惩罚机制说明；重点在同学之间的细节，不写惩罚人的恐惧。',who:['我','同桌','班主任']});
BANK.push({id:'K427',t:'《我回到昨天待了四十分钟，学会了怎么道别》',g:'imagine',d:'future',c:'journey',e:'insight',idea:'我能回到昨天，但只有四十分钟，代价是我多长了一天，所以我学会的道别很短。',mat:['第一次回到昨天我站在自家楼下，楼下有个穿校服的自己在等车，那个人看不见我','我跟着{妈妈}进了家门，听见她在厨房跟人说今天累不累，说的是我自己没听过的语气','四十分钟到的时候我站在原地，看见那个自己抬起头，像是知道我在这儿','我在第二天早上醒来，什么都没做，只是把早饭多摆了一副筷子'],how:['开头：从我发现能回到昨天那天写起，先写我第一天去了哪儿','主体：写那四十分钟里的四样东西：等车的自己、厨房、语气、抬头的自己','深化：写我为什么明白不该多说四十分钟，重点在多长一天这个代价','结尾：落在第二天早上多摆的那副筷子上，写我一句话没说'],trap:'容易写成弥补遗憾的万能机会；不许用回来改变大事，重点写克制和一顿早饭。',who:['我','妈妈','那个看不见我的自己']});
BANK.push({id:'K428',t:'《十点整，我的影子会去厨房喝一杯水》',g:'imagine',d:'future',c:'first',e:'curio',idea:'每天晚上十点，我的影子会自己走到厨房喝水，喝完回去，像替我做一件我忘的事。',mat:['第一次是我起来上厕所，撞见影子在倒水，杯子是响的，我不敢出声','它喝完把杯子放回原位，动作和我妈放杯子的样子一模一样','第二天我故意晚睡，看着它去，影子回头看了一下，那是我第一次见它犹豫','我在心里说了一句你要喝就喝吧，第二天我自己在十点去了厨房'],how:['开头：从我半夜撞见影子在倒水写起，先写那声响和我的不敢出声','主体：写三处细节：杯子的响、放回原位的动作、回头那一下','深化：写我说你要喝就喝吧那句话，写我为什么那样说','结尾：落在第二天我自己在十点去了厨房，写那天我倒了两杯'],trap:'容易写成家庭温情加怪谈；影子替人做事这个玩法只保留一件，其余情绪要落到人身上。',who:['我','妈妈','影子']});
BANK.push({id:'K429',t:'《日记本上的字会自己补完我说不下去的句子》',g:'imagine',d:'future',c:'secret',e:'warm',idea:'每天写日记，最后一句总差半句，本子会在夜里替我补上，补的比我原本想的好。',mat:['我写今天我不敢举手，就停在这儿，第二天那半句写着我怕老师觉得我慢','另一页我写外婆老了，后面接的是她还在问我明天要不要吃排骨','我试过空着不写，第三天那一行仍是满的，笔迹比我的浅','我把日记本藏在抽屉最里面，后来每天写完还是留半句给它'],how:['开头：从我第一天发现被补字写起，先写我当时的反应是撕掉那一页','主体：写三处补出来的句子，一处写害怕一处写外婆一处写别的','深化：写我试过空着不写那一次，说明本子不接受空着','结尾：落在我现在每天故意留半句这件事上，写我愿意让它写'],trap:'容易写成温情奇幻；补出来的句子要像初二学生的话，别写成大人腔。',who:['我','外婆','日记本']});
BANK.push({id:'K430',t:'《校门口那盏红灯为迟到的人多亮三十秒》',g:'imagine',d:'future',c:'change',e:'curio',idea:'校门口那盏红灯的时间被人偷偷调过，只要有人迟到，它就多亮三十秒。',mat:['我第一次看见是早上七点五十，灯灭得比平时晚，我抬头数到了三十','第二次是我和{同桌}一起看见的，她说是保安叔叔弄的，他摇头','第三次是保安先说的，他说这盏灯的延时器坏了好几年，没人报修','后来我问物业，物业说没坏，也没有第二个人看见过'],how:['开头：从我第一次数那三十秒写起，先写我当时以为自己在算错','主体：写三次看见的前后经过，三次的说话人各不一样','深化：写保安摇头那一次，重点写他为什么不肯认','结尾：落在物业说没人看见过这句上，写我现在自己也说不准'],trap:'容易写成温情小故事把保安写成好人；关键是不给答案，把这件事留在真假之间。',who:['我','同桌','保安']});
BANK.push({id:'K431',t:'《奶奶第一次自己挂断了视频电话》',g:'rec',d:'future',c:'moment',e:'warm',idea:'奶奶学会挂电话是在第三个月，她挂得很轻，还说了一句吓一跳的话：那头的空气也挂断了。',mat:['第一次视频我喊了三声没人应，屏幕里她把手机拿远又拿近','我教她挂，她总按成静音键，最后是我先挂了她才学会','第三个月她第一次自己挂了，挂完发来一条六秒的语音，说挂好啦','那条语音我反复听了四遍，听到最后笑出声，笑的不是她笨'],how:['开头：从我打过去没人应那天写起，先写我喊的那三声','主体：写三次学挂电话的经过，重点写第三次她发来的语音','深化：写那句挂好啦和她随后加的一句空气也挂断了，写出她的想法','结尾：落在我笑出声那一秒上，写我笑的不是她笨而是那句话真'],trap:'容易写成老人学手机的温情套路，情节太顺；要有学不会的那几次，卡壳要写出来。',who:['我','奶奶','妈妈']});
BANK.push({id:'K432',t:'《我把家里那台旧手机改成了只查单词的机器》',g:'rec',d:'future',c:'object',e:'plain',idea:'旧手机在我手上成了查单词的工具，它的全部本事就是打开一本词典和记录我查错的词。',mat:['它开不了微信，只能联网，我用一个网址把它锁成一页词典','我设了每词只能查一次，逼自己先猜，猜错才能查，查错记进一个表','第一个月表上有两百多个词，第七个月只剩十九个，这个数字是我最得意的','上个月外婆借去用了一下午，她查的是菜价，我回来什么也没说'],how:['开头：从我决定拆掉旧手机所有功能那天写起，先写我拆了哪些','主体：写每词一次这条规矩和查错表，重点写第一个月两百个这个数字','深化：写第七个月只剩十九个这件事，写清我做了什么调整','结尾：落在外婆借去查菜价那一幕上，写我的表情管理失败了'],trap:'容易写成科技改造的自嗨；只写查词一件事，别的功能不许加进来。',who:['我','外婆','旧手机']});
BANK.push({id:'K433',t:'《答应期中考前不碰手机，第七天我就解除了》',g:'rec',d:'future',c:'promise',e:'guilt',idea:'我把手机交给{爸爸}保管并写了保证书，第七天夜里我用学习机把保证书拍了回来。',mat:['保证书上写了不碰手机直到期中考，还写了我违反就交出下学期零花钱','第三天我偷拿过一次，只看了一眼班级群，两分钟就放回去了','第七天学习机在床头柜上拍到了那张纸，照片发到了我的旧邮箱','我第二天主动交出零花钱，{爸爸}只收了一半，另一半还给我，说你也得留点急用'],how:['开头：从我写保证书那天写起，先写纸上写了哪两条','主体：写两次碰手机，一次两分钟，一次拍到纸，重点写第二次','深化：写零花钱交出去和只收一半这两个数字，别写成惩罚的爽快','结尾：落在另一半被还给我这件事上，写我那句话说不出口'],trap:'容易写成青春期对抗家长的老套故事；两次越界的细节要写准，不要煽情对抗。',who:['我','爸爸','学习机']});
BANK.push({id:'K434',t:'《第一次自己坐地铁去图书馆还书》',g:'rec',d:'future',c:'first',e:'insight',idea:'第一次独自坐地铁去还书，我提前两小时出门，最后迟到的是我而不是书。',mat:['出门前我算了三趟方案，选了中途要换乘一次的那条，因为少两站','我在闸机前站了三分钟，学着别人刷二维码，第一次刷出了进站票','出站时走错了方向，在陌生街道走了二十分钟，反而记住了两家早餐店','书在那天到期还上的，我把它塞进还书箱时听到机器响了一声'],how:['开头：从我算三趟方案那个晚上写起，先写我为什么选了换乘那条','主体：写闸机前站三分钟和走错方向两件事，按时间排','深化：写那二十分钟里记住的两家早餐店，重点写我放松下来的转折','结尾：落在还书箱那一声机器响上，写我当时松了多大一口气'],trap:'容易写成成长的励志段落；要把迷路那二十分钟写具体，不写自责。',who:['我','还书箱','早餐店的老板']});
BANK.push({id:'K435',t:'《车载导航开始用我说话的语气报路》',g:'rec',d:'future',c:'change',e:'warm',idea:'我爸换了新导航以后，它报路会用我的口气，连口头禅都学走了一部分。',mat:['第一次听见它说前面路口右转的时候我愣了一下，语气是我懒洋洋那种','我妈说它学得真像，我说那是我以后不能坐他副驾了','它还学会了我咳嗽那一声，右转之前先咳一下，那是{爸爸}嗓子不好','有一回路况复杂，我爸嫌它啰嗦，它就改用我的短句报路，只报三句'],how:['开头：从我第一次听见它学我口气那天写起，先写那句右转','主体：写三处模仿：语气、咳嗽、短句，重点是咳嗽那一次','深化：写我爸嫌啰嗦那一次和我说的那句不能坐副驾，玩笑要写','结尾：落在它改用短句报路这件事上，写我爸那天没再说话'],trap:'容易写成家庭温情加科技萌宠；模仿只写三处，别堆太满。',who:['我','爸爸','妈妈']});
BANK.push({id:'K436',t:'《屏幕使用时间把我的一天切成碎块》',g:'rec',d:'future',c:'mis',e:'down',idea:'屏幕使用时间让我第一次看清，我一天里被切碎的不是一个小时，是十七段。',mat:['最长的一段是十六分钟在查单词，最短的几段只有十几秒，看一眼就锁','我一整个下午解锁了二十多次，每次都说只看一眼，一眼从来不止一秒','最难受的不是数字，是它提醒我的时候，我正想不起来自己在干什么','那天晚上我把它关掉了，第二天没有再打开，可我记住了那十七段'],how:['开头：从我第一次看那份使用时间报告写起，先写我以为自己会吓一跳','主体：写三段时长：十六分钟、十几秒、二十多次解锁','深化：写被提醒时我想不起来自己在干什么那种感觉，别写成感化','结尾：落在第二天没有再打开这件事上，写我记住的是那十七段不是总数'],trap:'容易写成沉迷手机的自责和悔改；重点是数字带来的具体不适，不写道德批判。',who:['我','屏幕使用时间的报告','班主任']});
BANK.push({id:'K437',t:'《科技节上那台会下棋的机器只输给一个人》',g:'scene',d:'future',c:'contest',e:'curio',idea:'科技节那台机器赢了九十九局，输掉的那一局是它自己让的，理由它说得很完整。',mat:['它的对手是一个五年级小孩，走了十七步，机器在第十九步停了三秒','它说让棋的原因是对方坐姿和呼吸都太稳，它想学一种新的开局','负责人说它的让棋记录被清掉了，可黑板上的时间还留着，一秒没差','后来它又让我走了一局，我二十步就输了，输得比那个小孩还快'],how:['开头：从我排队等了三轮才排上那局写起，先写现场有多挤','主体：写那一局的十七步和第十九步的三秒，时间要写准','深化：写机器说的让棋理由和黑板上留着的时间，两处对照','结尾：落在我自己走的那一局输了这件事上，写我至今不服'],trap:'容易写成科技的神奇与人的渺小；让棋理由要像机器的话，冷而完整。',who:['我','下棋的机器','那个五年级小孩']});
BANK.push({id:'K438',t:'《停电那晚全楼的屏幕都亮了》',g:'scene',d:'future',c:'crowd',e:'warm',idea:'停电那晚，整栋楼的手机屏幕一起亮起来，反而照亮了每一层的楼梯。',mat:['先是四楼一扇窗，随后是五楼、六楼，光从楼上往楼下传','有人在每一层的转角把手机放在楼梯扶手上，电筒关着，只留屏','我们那一层有九个人，大家不说话，都把屏幕调到最暗挡着脸','来电前最后一分钟，所有屏一起暗下去，那一分钟楼梯比平时亮'],how:['开头：从第一扇亮起来的窗写起，先写光是从上往下传的','主体：写三层楼的三种亮法，重点写最暗挡脸这个细节','深化：写那九个人一句话不说的安静，屏幕的光落在哪里要写','结尾：落在最后一分钟屏一起暗下去那一刻，写楼梯比平时还亮'],trap:'容易写成停电的混乱场面；只写光和安静，不写危险不写混乱不写恐惧。',who:['我','隔壁的同学','来电后的第一句话']});
BANK.push({id:'K439',t:'《未来会不会更方便，我持保留》',g:'argue',d:'future',c:'change',e:'plain',idea:'我不反对技术往前跑，我反对的是把方便当成唯一标准，所以这道题我选保留。',mat:['冰箱能自己买菜我第一个反对，因为它不再问我今天想吃哪一样','地铁有了预报客流我也反对，因为人少的那一段就没人愿意等','真正让我服的是药盒的提醒，它提醒的是我爸妈那种会忘事的人','我承认方便确实省事，可省下来的时间我仍旧花在手机上，一点没多'],how:['开头：先承认技术确实有用，再说明我反对的是把方便当唯一标准','立论据：用买菜和客流两例加药盒一例，三例各站一边','辨析：分清省时间和不等于有更多时间，重点写时间去向这一层','收束：结尾写我自己现在的判断标准，不喊口号不号召别人'],trap:'容易写成反科技的偏激议论；至少留一个我真心佩服的科技例子，不能一边倒。',who:['我','爸爸','药盒']});
BANK.push({id:'K440',t:'《有了计算器之后还要不要背公式》',g:'argue',d:'future',c:'word',e:'insight',idea:'我不反对用工具，我反对的是把公式的熟练当成唯一标准，因为工具也会算错。',mat:['我用计算器算过一道题，结果和老师答案差一个负号，我检查了三遍才发现','真正救我的是背下来的那个式子，我几乎是不用想就写出了正确的符号','我见过有人拿计算器去考交白卷，这事在班里传了一个月','所以我认为要背，但要知道背的是什么：不是数字，是公式为什么长这样'],how:['开头：先讲我用计算器算错一次的经历，把立论据放在开头','立论据：写那道差一个负号的题和不用想就写出符号的对比','辨析：分清背公式和背数字，把这条说清楚，避免变成口号','收束：结尾写我自己怎么背，写一个具体做法'],trap:'容易写成反计算器的旧式争辩；必须有亲身经历加辨析那一段，不然就是空谈。',who:['我','数学老师','那道差一个负号的题']});
BANK.push({id:'K441',t:'《参观记：一场只有十二个人的科技展》',g:'apply',d:'future',c:'journey',e:'curio',idea:'科技展办在学校报告厅，只有十二个人，我记的不是展品，是志愿者替我们记的参观路线。',mat:['我们十二个人每人发一张卡，卡上盖六个章，六个点分布在两层走廊','讲解员是退休的工程师，他讲第一个展项时先讲了螺丝的螺纹是怎么磨出来的','第三个展项是一面镜子，映出的还是我们，要凑近看才看得清自己的眼睛','最后我们在留言本上写字，我写了一句：希望明天还有别的同学来看'],how:['开头：从十二个人和一人一张卡写起，先写人少这件事带来的好处','主体一：按六个章的顺序写其中三个点，第三个点是那面要凑近看的镜子','主体二：写讲解员讲螺纹的那段和留言本，写他说话时的动作','落款与收束：结尾写我回家查了那个螺纹的名字，写我为什么记这个'],trap:'容易写成科技展的观后感加感叹；人少、卡、章这些细节要压住，不要吹技术。',who:['我','讲解员','同去的同学']});
BANK.push({id:'K442',t:'《采访稿：采访住在隔壁的做芯片的邻居》',g:'apply',d:'future',c:'first',e:'warm',idea:'采访{阿姨}做芯片的第几年，我原本想问工资，最后问出来的是她每天回家那句我回来了。',mat:['我在楼下碰到她三十次里，有二十次她手里拎着同一个蓝布包','她带我看了一颗芯片，比指甲小，她说这是她做了六年的活','我问做这个难不难，她说不难，就是错不得，错一颗整批要重来','她说到晚上七点会准时停下手，说我女儿七点喊我回家吃饭，这句她说的时候在笑'],how:['开头：从我碰到邻居三十次的统计写起，先说明为什么找她问','主体一：写蓝布包和芯片这两处细节，数字要准','主体二：写她那句错一颗整批要重来，以及我原本想问没问出口的工资','落款：结尾写采访时间和我删掉了一句，写我删的是哪一句'],trap:'容易写成科学家的人物特写和赞美；要用琐碎的统计和她的原话，顶住煽情。',who:['我','阿姨','她的女儿']});
BANK.push({id:'K443',t:'《全校的影子在早读时统一迟到了一次》',g:'imagine',d:'society',c:'secret',e:'curio',idea:'那天早读铃响，全班的影子都晚了半分钟才从墙角爬出来，只有一本书是准的。',mat:['铃响之后影子先不动，过了半分钟才从桌脚下面往外挪','窗边那一排的影子最慢，慢到能看清它一寸一寸地长','只有一本翻开的练习册，影子停在第七页没有动','值日生说上一届也发生过一次，那次的记录写在旧点名册的背面'],how:['开头：从早读铃响影子不动写起，先写那半分钟里教室的样子','主体：写三处差异：墙角最慢、窗边一寸一寸、练习册停住','深化：写旧点名册背面的那句记录，说明这事有过先例','结尾：落在那本停住的练习册上，写它当时停在第七页什么题'],trap:'容易写成恐怖片式的集体异常；要守住校园日常的底，重点写教室里的细节反应。',who:['我','值日生','旧点名册']});
BANK.push({id:'K444',t:'《班主任下班以后还在教室里改作业》',g:'imagine',d:'teacher',c:'moment',e:'warm',idea:'我晚自习回来拿忘带的书，办公室灯还亮着，她改的不是作业，是一张请假条。',mat:['她那盏灯和走廊的灯不是一种白，桌上有一叠卷子已经翻到最后一页','她手边放着第三杯速溶咖啡，杯子边有一圈干掉的印','她改的不是卷子，是一张写着三天假期的请假条，用红笔改了两处','我推门她抬头说了一句，拿了书就走，全程没说她的事'],how:['开头：从我回教室拿书时看见办公室还亮着写起','主体：写桌上的三样东西：卷子、咖啡杯印、请假条，重点写红笔那两处','深化：写她抬头那一句话，写我为什么没问，别写成煽情','结尾：落在第三杯咖啡上，写第二天她迟到了四分钟'],trap:'容易写成老师的奉献赞歌，最后落到牺牲；重点放在她手上的那张请假条上，别拔高。',who:['我','班主任','她的红笔']});
BANK.push({id:'K445',t:'《弄堂的墙会自己记住拆掉它的年份》',g:'imagine',d:'hometown',c:'change',e:'plain',idea:'我家后面那面墙每拆掉一块砖，墙面上就多一行字，写的是那一年弄堂里发生过的事。',mat:['第一行写的是搬走二十三户，日期是零九年四月十九日','第二行写的是弄堂口的井填了，填的那天有人送了一筐橘子','第三行写的是去年四月，墙上第一次出现我自己的字','第四行我没写出来，因为我想不出该写什么，这面墙就一直空着'],how:['开头：从我第一次发现墙上有字写起，先写我以为是谁记的','主体：写三行字的内容和日期，重点是送橘子那一行','深化：写第三行我自己的字和第四行空着这件事，别急着解释','结尾：落在我没写第四行这件事上，写我第二天带了一支笔还是没写'],trap:'容易写成魔幻现实主义的大抒情；那面墙只记事实不评价，抒情留在人物这边。',who:['我','外婆','送橘子的邻居']});
BANK.push({id:'K446',t:'《我们班投票的规矩：赢了的人要替输的人做一件事》',g:'imagine',d:'friend',c:'contest',e:'insight',idea:'班会投票被改了规矩：投中的方案要由提出者负责一整周，全班一起看他做成什么样。',mat:['第一次表决是班里的活动时间，投中的提议是每周多一节自习','提议人是{同桌}，她当场愣住，全班都笑，她没笑','那一周她真的天天提前十分钟到，第四天嗓子哑了','最后表决结果从通过变成通过但换人，两次票数我记得很清楚'],how:['开头：从班会上的举手表决写起，先写规矩是谁定下来的','主体：写那一周她的三个具体动作和第四次哑着嗓子讲话','深化：写第二次表决两边的票数，别让结果显得公平','结尾：落在我从那以后投任何一票都要想三秒这件事上'],trap:'容易写成少年议事的空谈；必须有票数和一周的具体动作，重点落在谁来承担。',who:['我','同桌','班主任']});
BANK.push({id:'K447',t:'《我改过一次选科，又改回来了》',g:'imagine',d:'grow',c:'change',e:'guilt',idea:'改选科那三天我做了两个版本的表格，两个版本里都有一个人在替我做决定。',mat:['第一张表按我妈说的排，理由栏我写了适合和稳定，没写喜欢','第二张表按我喜欢的那科排，理由栏我只写了喜欢两个字','我拿去给{班主任}看，他没选，他让我把两张表合起来再问自己一次','最后我合出来的第三张表，两边各让了两格，交上去的时候我手心全是汗'],how:['开头：从我打开选科通知那个晚上写起，先写离截止还有三天','主体：写两张表两张理由，重点是那张只写喜欢两个字的','深化：写{班主任}那句话和我做的第三张表，两边各让两格要写清','结尾：落在第三张表交上去手心出汗这件事上，写我回家没提'],trap:'容易写成家庭冲突的控诉；妈妈那一条要写成她给的建议成立，不许贬低。',who:['我','班主任','妈妈']});
BANK.push({id:'K448',t:'《我爸第一次一个人坐公交去看我演出》',g:'imagine',d:'family',c:'journey',e:'insight',idea:'我爸第一次一个人坐公交来看我演出，他早到了四十分钟，却没进剧院。',mat:['他六点二十就到了，剧院七点开门，他在大桥底下等到六点五十','他没进去是因为不知道该坐第几排，也怕挡住别人','他给我发了条消息，只有四个字：我在外面等','演出结束我在剧院门口找了他四分钟，他一直在桥洞下的自动售货机旁边站着'],how:['开头：从他比开场早到四十分钟这件事写起，先写他六点二十在哪','主体：写桥底下那三十分钟里的两个细节：不知道第几排、怕挡人','深化：写他那条只有四个字的消息和我在台上什么都不知道','结尾：落在剧院的四分钟上，写我找到他时他先说的那句话'],trap:'容易写成父亲偷偷守候的煽情合集；守住细节的笨，别加眼泪和拥抱。',who:['我','爸爸','自动售货机']});
BANK.push({id:'K449',t:'《老师念错的字会记在黑板角落里，一学期攒了十七个》',g:'imagine',d:'teacher',c:'word',e:'insight',idea:'我们的黑板左下角有个小格子，专门记老师念错的字，一学期下来有十七个。',mat:['第一个是蜻蜓的蜻，语文老师念成qing，后来查了半节课','第十二个是龟的读音，全班一起查字典，查出来两种都能用','第十七个在期末考前一天记下，写的是我名字里那个字','期末那天没人擦那一格，值日生特意交代了值日的人别动它'],how:['开头：从语文老师念错蜻蜓那次写起，先写她顿了半秒','主体：写三个字：蜻、龟的两种读音、我名字里那个字','深化：写查字典那半节课，重点写两种读法都能用这个发现','结尾：落在期末没人擦那一格上，写值日生那句交代的话'],trap:'容易变成挑老师毛病的段子；三个例子都要有后续动作，不停在笑话上。',who:['我','语文老师','值日生']});
BANK.push({id:'K450',t:'《努力到底有没有用，我用一次退步来说》',g:'argue',d:'grow',c:'contest',e:'curio',idea:'我承认努力有用，但我不承认努力有用就等于结果一定对，这篇只讲我那次退步。',mat:['上学期我连续三十天六点起床写题，模考退步了十一分，班主任找我谈话','她没有说方法不对，她问我有没有一次是因为想要早起这个念头才熬的夜','我后来把那三十天的题本翻出来，二十九天里有十九天我做的是已经会的','真正让我进步的是另外四天，那四天我请教了三个人','所以我的结论是：努力有用，但要算它花在了新东西上还是旧东西上'],how:['亮观点：先说努力有用，再把结果一定对这句拆开，语气要坦白','立论据：用三十天六点起床那次的三个数字立住，不加一句抱怨','辨析：写十九天做旧题和四天请教三个人这两处的对比','收束：结尾只写我现在的做法，一个能执行的习惯，不号召别人'],trap:'容易写成努力无用论或者熬鸡汤；必须有一次真实退步的数据，辨析那一段不能省。',who:['我','班主任','那个题本']});
BANK.push({id:'K451',t:'《把作业量减一半，我反对老师凭感觉砍》',g:'argue',d:'teacher',c:'change',e:'plain',idea:'我支持减负，但反对凭感觉一刀砍，该减的是抄写量不是思考量。',mat:['我们班数学作业有八道题，其中五道是抄同类例题，三道是新题','五道抄写题加起来我用了二十分钟，三道新题用了一小时','换句话说，八道题里真正占时间的只有三道','那三道题老师批改的时候只给了一个对错，比错的原因反而没人问'],how:['亮观点：先承认减负的必要性，再反对一刀切这个做法','立论据：用八道题里五道抄三道新的这个拆解，数字要准','辨析：写抄写量和思考量的区别，把边界划在批改那一环','收束：结尾写我向老师提的一条具体建议，不谈别人学校'],trap:'容易变成对老师的抱怨，语气要压住；只提一条具体建议，不上纲上线。',who:['我','数学老师','那三道新题']});
BANK.push({id:'K452',t:'《我们到底该不该说网络流行语》',g:'argue',d:'society',c:'word',e:'insight',idea:'我不反对流行语，我只是觉得它能进教室之前，得先在字典里留个位置。',mat:['我们班黑板报上出现过十九个网络词，语文老师划掉了十一个，留了八个','留下来的八个里有尔、扎堆，还有一个他查了半天','老师说他划的不是词，是那些他还没看懂来路的','那天我把留下来那八个记在本子上，一个月后有三个进了作文里'],how:['亮观点：先说不反对流行语，再把边界划在来路这个词上','立论据：用十九划十一留八这三个数字，把材料摆足','辨析：写留下来的八个和老师的划法，重点写他查了半天那个','收束：结尾写我自己记本子的做法和一句我的标准'],trap:'容易写成对语言风格的挑剔，会显得刻薄；要写清老师的理由是来路不清。',who:['我','语文老师','黑板报']});
BANK.push({id:'K453',t:'《我妈把我写错的那道题记了两年》',g:'argue',d:'family',c:'mis',e:'curio',idea:'我妈把我小学一道算错的题记在冰箱贴上整整两年，贴纸换三次，题没换。',mat:['第一次是二年级，我算出答案就贴上去，压在牛奶盒背面','第二次贴是在她晒衣服顺手看见，说这题你当时是怎么算的','第三次换贴纸是因为旧的那张洗掉色了，题她重新抄了一遍','我问为什么一直留着，她说她想知道我下次会不会还错同样的地方'],how:['亮观点：先说要判断对错之前得看动机，再亮出我原来的误会','立论据：用贴纸换三次题没换这个细节，三个时间都要写','辨析：写她为什么追着问那次的算法，重点写追问本身','收束：结尾写我后来自己去查那道题的答案，写我不敢告诉她'],trap:'容易写成母亲执着到偏执的责难；她的动机要写得不夸张，结尾要把责收回自己身上。',who:['我','妈妈','那张旧贴纸']});
BANK.push({id:'K454',t:'《排队这件事，到底该不该看谁先来》',g:'argue',d:'society',c:'crowd',e:'warm',idea:'我认为该看时间，但不该看嗓门，所以我不赞成让声音大的人先过。',mat:['早自习的作业本收上去常常先收第一排的，因为第一排交得快','这样第一排交得快是因为他们抄了中间几排的，第二排反而交得慢','老师按顺序收，第二排的人每次都吃亏，吃亏了也没人说','我们班后来改成全班一起交，用一个筐，同时收，两周就改了'],how:['亮观点：先说该看时间，再说不该看嗓门这个具体分歧','立论据：用第一排抄中间那一层关系立住因果，别空骂','辨析：写第二排吃亏的机制和没人说的原因，重点写无声的规则','收束：结尾写我们班改成的那个筐和两周，两周这个时间要写'],trap:'容易写成对抄袭的道德训诫，重点搞错了；矛头应指向收作业的顺序，不指向抄袭的人。',who:['我','班主任','第二排的收本子']});
BANK.push({id:'K455',t:'《老房子卖掉那天，我才发现我最舍不得的是那个声音》',g:'argue',d:'hometown',c:'change',e:'warm',idea:'老房子卖掉的最后一夜我最舍不得的既不是院子也不是房间，是楼下那口井的声音。',mat:['那口井用了三十年，摇上去的水要先泼半桶再打，洗菜的水就带一点甜','夏天的晚上井盖开着，热气往上冒，谁家有冰镇西瓜就在井边喊一声','最后一天搬家公司来过，屋里空了，我们四个围着井盖坐了二十分钟','现在那口井填了，可我每个月还会经过那儿，脚步会慢一下'],how:['亮观点：先把舍不得的东西说窄，再说明我为什么选了这个','立论据：用泼半桶、洗菜的甜、井边喊西瓜三个细节立住','辨析：写最后一夜围着井盖坐的二十分钟和卖房的冷静条款对照','收束：结尾只写经过时会慢一下这个动作，别抒情铺开'],trap:'容易写成老弄堂怀旧散文的复制；细节必须新，井这件事要写它怎么被用。',who:['我','外婆','搬家公司的人']});
BANK.push({id:'K456',t:'《第一次月考砸了，我反对把它归给粗心》',g:'argue',d:'grow',c:'first',e:'down',idea:'我反对把粗心当结论：粗心不是原因，是一件事没被认真看完的结果。',mat:['我数学九十二，前一道大题七分，只写了设问没有往下算','空着的那七分和会做的题在同一页上，那一页我看得最马虎','我把卷子摊开重看，看了三分钟，发现设问底下画了一条铅笔线','那条线是我自己划的，我完全想不起来划它的理由','所以我不说粗心，我说那三分钟我人在别的地方'],how:['亮观点：先说自己反对粗心这个结论，语气直接','立论据：用七分和那道铅笔线两个证据，把空着的位置写清','辨析：写设问和画线的关系，重点在我完全想不起来这件事','收束：结尾写我现在检查卷子的一个动作，只有动作不写感想'],trap:'容易写成自我检讨或者和马虎归因；证据要具体，结论落在可改的动作上。',who:['我','那张卷子上的铅笔线']});
BANK.push({id:'K457',t:'《一封感谢信：写给替我修好自行车的楼下阿姨》',g:'apply',d:'hometown',c:'first',e:'warm',idea:'写封感谢信给楼下阿姨，不夸她手艺好，只写她两次多收了我三块钱这件事里的道理。',mat:['第一次修车她多收三块，说多加的算上补胎的，我那年冬天一共让她修了九次','第二次车链掉了半小时，我自己剪了一根头绳绑上，被她撞见','她说头绳撑不过三个月，三个月后车链断在我上学的路口前二十米','那封信里我写了三件事，最后一句是关于那三块钱我没问过的那句话'],how:['称呼与格式：称呼写阿姨，说明写信是为了两件事和一件一直想问的事','主体一：写两次修车的经过，重点是九次和那三块钱','主体二：写头绳和三个月这两个细节，以及我为什么一直想问清三块钱','落款：结尾只写谢谢二字加署名，别写祝福套话'],trap:'容易写成感谢信模板，通篇好话；必须写自己不懂的地方和不问出口的那句话。',who:['我','楼下阿姨','那辆旧自行车']});
BANK.push({id:'K458',t:'《给社区的建议书：楼道声控灯的延迟时间》',g:'apply',d:'society',c:'moment',e:'plain',idea:'建议把楼道声控灯的延迟时间调短，重点写清一次在楼梯上跺脚找光的经历和一声灯不亮的夜。',mat:['我们那栋楼的声控灯延迟是二十秒，白天照样要跺脚才亮','有一次我跺脚跺了三次，灯才亮，抬头看楼上，脚步声是从我家传下来的','第二个例子是我妈晚上加完班进楼道，跺了七次脚，鞋底已经磨平','这两个例子交上去之后，物业把延迟从二十秒改成了八秒'],how:['称呼与格式：称呼写物业和居委会公司，先说清楚要解决的是哪一个设备问题','主体一：写两次经历，一次是我跺脚，一次是{妈妈}跺七次','主体二：写延迟从二十秒到八秒这个具体建议，说明不增加设备','落款：结尾写我的姓名、门牌和日期，请对方回复是否采纳'],trap:'容易写成发牢骚的建议信，语气要平；两个例子要有时间和次数，不能只有感受。',who:['我','妈妈','物业师傅']});
BANK.push({id:'K459',t:'《一封写给一年后自己的公开信：我认下今天的四件小事》',g:'apply',d:'grow',c:'promise',e:'warm',idea:'把四件小事写成能被核对的约定，一个月后我自己对照检查，全部打钩。',mat:['约定一：每天读满二十分钟课外书，二十分钟是我数出来的，不是估的','约定二：每周三问{同桌}一次那道我不会的题，一共要问满八次','约定三：把手机放到客厅充电，睡前不看屏幕，试七天','约定四：给外婆打一次电话，不超过十分钟，因为她说超过会烦','一个月后我核对的真实结果是：一和四做到了，二只问了五次，三在第四天破了'],how:['称呼与格式：写给自己的公开信，第一行写日期和称呼，收信人是明确的一年后的我','主体一：把四件小事逐条列出，每条写清次数和时间，别写成愿望','主体二：写一个月后的真实核对结果，破了的那条要写清是哪一天破的','落款：结尾写我知道自己会破哪一条，这一条我留到年底再定'],trap:'容易写成励志计划表加豪言壮语；必须给出真实的核对结果，破了的一条不许藏。',who:['我','一年后的我','外婆']});
BANK.push({id:'K460',t:'《读〈骆驼祥子〉之外，我读〈我的第一次投稿〉有感》',g:'apply',d:'teacher',c:'mis',e:'insight',idea:'读后感不写书里多好，我写书里那封退稿信，那封信和祥子的空车一样，都是被退回的东西。',mat:['《我的第一次投稿》讲一个中学生写信投稿被退，退稿的理由写得很具体，说写得慢','那封信他留着，夹在课本后面，退稿理由的字被翻得有点淡','我把两本书放在一起看，祥子失去的车和那封信失去的鼓励其实是一回事','这封读后感我只写三段，第三段写我自己的退稿：一次运动会报名表我交晚了'],how:['称呼与格式：这是读后感，标题后面不写称呼，开头先交代我读这本书用了几天','主体一：写那封退稿信的样子，重点是书里那份和我手上那份的对照','主体二：写两本书并读的感受，重点写退回和失去是怎么对上的','落款：结尾写我自己那份报名表，写它退了以后我那周干了什么'],trap:'容易写成两本书主题相同时的空泛对照；必须有自己那份报名表这个亲身例子。',who:['我','同桌','语文老师']});
BANK.push({id:'K461',t:'《一则启事：我们班想找一个人，请帮我们留住那个声音》',g:'apply',d:'culture',c:'crowd',e:'down',idea:'我们班要发的启事不是找失物，是找一件会发出声音的东西，请用过它的人来说明它怎么响。',mat:['我们要找的是一把铜勺，在早读时被敲三下，全班靠它卡时间','这把勺从我进校起就在，现在还在，只是敲的声音轻了','我们不知道是谁买的是谁擦的，找了三天没结果','所以启事里不写失主，写谁记得这勺的来历，谁就跟我们说一声'],how:['称呼与格式：这是启事，第一行写启事名称，中间写清楚要找的是什么，不要写寻物启事那四个字','主体一：写那把铜勺的样子和三下敲声的用法，用词要别人一看就懂','主体二：写我们找的三天，以及为什么不用普通的寻物启事格式','落款：结尾写班级、日期和一句谁记得就来说一声，不写联系人电话'],trap:'容易写成样子像寻物启事，读者以为在找失物；格式里的名称和说明必须让人一眼看懂。',who:['我','班主任','那把铜勺']});
BANK.push({id:'K462',t:'《我给外婆写了一份道歉书，为我藏起来的那只碗》',g:'apply',d:'hometown',c:'secret',e:'guilt',idea:'道歉书写的是那只我藏了两个月没还的碗，落点在我不敢承认自己怕她看见我长大。',mat:['碗是白底蓝边的，她过年来吃饭用的，我洗完没送回去就藏进了柜子','两个月里它在我柜子里吃饭，垫着我的袜子，那只碗有缺口','她没问过那只碗，一次也没问，这才是最难受的地方','道歉书里我写了藏的位置、两个月和袜子的颜色，没写我不敢还的原因'],how:['称呼与格式：写给外婆的道歉信，抬头称呼加冒号，正文不写我亲爱的外婆这种话','主体一：写那只碗的样子和藏的位置，位置要具体到柜子第二层','主体二：写两个月里碗被我拿来干什么，重点是袜子的颜色那一处','落款：结尾写我把碗放回她原来的位置这件事，和我为什么现在才说'],trap:'容易写成温情和解，太容易圆满；要把两个月里碗的用处写得像真的，不要给她一句原谅。',who:['我','外婆','那只缺口碗']});
